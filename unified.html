<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }
  .nav-container {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    background: #f3f4f6;
    color: #374151;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: all 150ms ease;
    white-space: nowrap;
  }
  .nav-btn:hover {
    background: #e0f2f1;
    border-color: #01696f;
    color: #01696f;
  }
  .nav-btn.active {
    background: #01696f;
    color: white;
    border-color: #01696f;
  }
</style>
</head>
<body>
<nav class="nav-container">
  <a class="nav-btn" data-page="10"
     href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/10"
     target="_top">📊 Dashboard</a>
  <a class="nav-btn" data-page="7"
     href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/7"
     target="_top">🏠 Maison SPS</a>
  <a class="nav-btn" data-page="9"
     href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/9"
     target="_top">📅 Planning</a>
  <a class="nav-btn" data-page="8"
     href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/8"
     target="_top">📋 Programmes</a>
</nav>
<script>
  try {
    var url = window.parent.location.href;
    var match = url.match(/\/p\/(\d+)/);
    if (match) {
      document.querySelectorAll('.nav-btn').forEach(function(btn) {
        if (btn.getAttribute('data-page') === match[1]) {
          btn.classList.add('active');
        }
      });
    }
  } catch(e) {}
</script>
</body>
</html>
