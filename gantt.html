<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Gantt SPS</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #f0f4f8;
  display: flex;
  align-items: flex-start;
}

/* ── WRAPPER 1400x860 ── */
#gantt-wrap {
  width: 1400px;
  height: 860px;
  transform-origin: top left;
  display: none;
  flex-direction: column;
}

/* ── HEADER ── */
.top-bar {
  display: flex;
  align-items: center;
  background: white;
  border-bottom: 2px solid #e2e8f0;
  padding: 10px 20px;
  gap: 14px;
  flex-shrink: 0;
  height: 60px;
}
.logo-sm {
  font-size: 0.85rem;
  font-weight: 900;
  color: #c0392b;
  border: 2.5px solid #c0392b;
  padding: 3px 8px;
  border-radius: 3px;
  line-height: 1.3;
  text-align: center;
  flex-shrink: 0;
}
.logo-sm span { font-size: 0.6rem; color: #2c3e50; display: block; }
.page-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: #1e293b;
  flex: 1;
}
.nav-btns { display: flex; gap: 10px; }
.nav-btn {
  padding: 7px 28px;
  font-size: 0.82rem;
  font-weight: 700;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.15s;
}
.nav-btn:hover { opacity: 0.85; }
.nav-btn.maison   { background: #1a6b6b; color: white; }
.nav-btn.fiche    { background: #2980b9; color: white; }

/* ── FILTRES ── */
.filters-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 20px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.filters-bar label {
  font-size: 0.78rem;
  font-weight: 600;
  color: #475569;
}
.filters-bar select, .filters-bar input {
  padding: 4px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  font-size: 0.78rem;
  font-family: inherit;
  color: #1e293b;
  background: white;
}
.zoom-btns { display: flex; gap: 4px; margin-left: auto; }
.zoom-btn {
  padding: 4px 12px;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: white;
  cursor: pointer;
  font-family: inherit;
  color: #475569;
  transition: all 0.15s;
}
.zoom-btn:hover, .zoom-btn.active { background: #2c3e50; color: white; border-color: #2c3e50; }

/* ── ZONE GANTT ── */
.gantt-container {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── PANNEAU GAUCHE (liste) ── */
.task-list {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #e2e8f0;
  overflow: hidden;
}
.task-list-header {
  display: grid;
  grid-template-columns: 1fr 80px 80px;
  background: #2c3e50;
  color: white;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0;
  flex-shrink: 0;
  height: 52px;
}
.task-list-header div {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  border-right: 1px solid rgba(255,255,255,0.15);
  text-align: center;
  line-height: 1.3;
}
.task-list-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.task-row {
  display: grid;
  grid-template-columns: 1fr 80px 80px;
  border-bottom: 1px solid #f1f5f9;
  cursor: pointer;
  transition: background 0.1s;
  min-height: 36px;
}
.task-row:hover   { background: #f0f9ff; }
.task-row.selected { background: #dbeafe; }
.task-row div {
  display: flex;
  align-items: center;
  padding: 4px 8px;
  font-size: 0.75rem;
  color: #334155;
  border-right: 1px solid #f1f5f9;
  overflow: hidden;
}
.task-name {
  font-weight: 600;
  color: #1e293b !important;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.task-date { justify-content: center !important; font-size: 0.7rem !important; color: #64748b !important; }

/* Pilier badge dans la liste */
.pilier-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  flex-shrink: 0;
}

/* ── PANNEAU DROIT (barres) ── */
.gantt-chart {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Header dates */
.gantt-header {
  flex-shrink: 0;
  background: #2c3e50;
  overflow: hidden;
  position: relative;
}
.gantt-header-months {
  display: flex;
  height: 26px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
.gantt-header-month {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: white;
  border-right: 1px solid rgba(255,255,255,0.2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.gantt-header-weeks {
  display: flex;
  height: 26px;
}
.gantt-header-week {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.7);
  border-right: 1px solid rgba(255,255,255,0.1);
}

/* Corps barres */
.gantt-body {
  flex: 1;
  overflow: auto;
  position: relative;
}
.gantt-rows {
  position: absolute;
  top: 0; left: 0;
  min-width: 100%;
}
.gantt-row {
  position: relative;
  height: 36px;
  border-bottom: 1px solid #f1f5f9;
}
.gantt-row:hover { background: rgba(0,0,0,0.02); }
.gantt-row.selected { background: rgba(59,130,246,0.06); }

/* Lignes verticales (mois/semaines) */
.gantt-vline {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: #e2e8f0;
  pointer-events: none;
}
.gantt-vline.month { background: #cbd5e1; }

/* Ligne aujourd'hui */
.today-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: #ef4444;
  z-index: 5;
  pointer-events: none;
}
.today-line::before {
  content: "Aujourd'hui";
  position: absolute;
  top: -18px;
  left: 4px;
  font-size: 0.65rem;
  color: #ef4444;
  font-weight: 600;
  white-space: nowrap;
}

/* Barre Gantt */
.gantt-bar {
  position: absolute;
  top: 6px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.15s, filter 0.15s;
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  z-index: 2;
  min-width: 4px;
}
.gantt-bar:hover { filter: brightness(1.1); opacity: 0.9; }
.gantt-bar.selected { filter: brightness(1.05); box-shadow: 0 0 0 2px #3b82f6; }
.gantt-bar-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Barre de progression */
.gantt-bar-progress {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 4px;
  background: rgba(0,0,0,0.15);
  pointer-events: none;
}

/* Légende piliers */
.legend {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px 20px;
  background: white;
  border-top: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: #475569;
  font-weight: 600;
}
.legend-dot {
  width: 12px; height: 12px;
  border-radius: 3px;
}

/* Statut badge */
.statut-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 0.65rem;
  font-weight: 600;
}
.s-en-cours { background: #dbeafe; color: #1d4ed8; }
.s-termine  { background: #dcfce7; color: #15803d; }
.s-a-venir  { background: #fef9c3; color: #854d0e; }

/* ── LOADING ── */
#loading {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100vh;
  color: #888; gap: 10px; font-size: 0.9rem;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid #ddd;
  border-top-color: #c0392b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── EMPTY ── */
.no-date-msg {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: #94a3b8; font-size: 0.85rem; font-style: italic;
  text-align: center; flex-direction: column; gap: 8px;
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Chargement...</div>

<div id="gantt-wrap">

  <!-- HEADER -->
  <div class="top-bar">
    <div class="logo-sm">SPS<span>MEDICAL</span></div>
    <div class="page-title">📅 Planning Gantt — Maison SPS Medical (Vision 3 ans)</div>
    <div class="nav-btns">
      <button class="nav-btn maison" onclick="goMaison()">MAISON</button>
      <button class="nav-btn fiche"  onclick="goFiche()">FICHE</button>
    </div>
  </div>

  <!-- FILTRES -->
  <div class="filters-bar">
    <label>Pilier :</label>
    <select id="filter-pilier" onchange="applyFilters()">
      <option value="">Tous</option>
      <option value="dev">Développement Business</option>
      <option value="impact">Impact</option>
      <option value="culture">Culture Managériale</option>
    </select>
    <label>Statut :</label>
    <select id="filter-statut" onchange="applyFilters()">
      <option value="">Tous</option>
      <option value="En cours">En cours</option>
      <option value="Terminé">Terminé</option>
      <option value="A venir">A venir</option>
    </select>
    <label>Priorité :</label>
    <select id="filter-prio" onchange="applyFilters()">
      <option value="">Toutes</option>
      <option value="Critique">Critique</option>
      <option value="Haute">Haute</option>
      <option value="Moyenne">Moyenne</option>
      <option value="Basse">Basse</option>
    </select>
    <div class="zoom-btns">
      <button class="zoom-btn" onclick="setZoom('semaine')" id="z-semaine">Semaine</button>
      <button class="zoom-btn active" onclick="setZoom('mois')" id="z-mois">Mois</button>
      <button class="zoom-btn" onclick="setZoom('trimestre')" id="z-trimestre">Trimestre</button>
    </div>
  </div>

  <!-- GANTT -->
  <div class="gantt-container">

    <!-- Liste gauche -->
    <div class="task-list">
      <div class="task-list-header">
        <div>Programme</div>
        <div>Début</div>
        <div>Fin</div>
      </div>
      <div class="task-list-body" id="task-list-body"></div>
    </div>

    <!-- Barres droite -->
    <div class="gantt-chart">
      <div class="gantt-header" id="gantt-header">
        <div class="gantt-header-months" id="header-months"></div>
        <div class="gantt-header-weeks"  id="header-weeks"></div>
      </div>
      <div class="gantt-body" id="gantt-body">
        <div class="gantt-rows" id="gantt-rows"></div>
      </div>
    </div>

  </div>

  <!-- LÉGENDE -->
  <div class="legend">
    <span style="font-size:0.72rem;font-weight:700;color:#475569;margin-right:4px">Piliers :</span>
    <div class="legend-item"><div class="legend-dot" style="background:#2980b9"></div>Développement Business</div>
    <div class="legend-item"><div class="legend-dot" style="background:#27ae60"></div>Impact</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c0392b"></div>Culture Managériale</div>
    <span style="margin-left:16px;font-size:0.72rem;font-weight:700;color:#475569">Statuts :</span>
    <span class="statut-badge s-en-cours">En cours</span>
    <span class="statut-badge s-termine">Terminé</span>
    <span class="statut-badge s-a-venir">A venir</span>
    <span style="margin-left:auto;font-size:0.7rem;color:#94a3b8;font-style:italic">
      La bande sombre sur chaque barre = avancement global
    </span>
  </div>

</div>

<script>
let allFiches  = [];
let filtered   = [];
let selectedId = null;
let zoom       = 'mois'; // 'semaine' | 'mois' | 'trimestre'
const W = 1400, H = 860;

// ── Couleurs piliers ──
const PILIER_COLORS = {
  dev:     '#2980b9',
  impact:  '#27ae60',
  culture: '#c0392b',
};
function getPilierKey(p) {
  if (!p) return 'dev';
  const s = String(p).toLowerCase();
  if (s.includes('impact'))  return 'impact';
  if (s.includes('culture')) return 'culture';
  return 'dev';
}

// ── Scale ──
function scaleToFit() {
  const el = document.getElementById('gantt-wrap');
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  el.style.transform = `scale(${scale})`;
  el.style.marginLeft = Math.max(0, (window.innerWidth  - W * scale) / 2) + 'px';
  el.style.marginTop  = Math.max(0, (window.innerHeight - H * scale) / 2) + 'px';
}
window.addEventListener('resize', scaleToFit);

// ── Dates ──
function parseDate(val) {
  if (!val) return null;
  if (typeof val === 'number') return new Date(val * 1000); // timestamp Grist
  const d = new Date(val);
  return isNaN(d) ? null : d;
}
function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function fmtMonth(d) {
  return d.toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' }).replace(' ', '\u00a0');
}

// ── Calcul plage globale ──
function getRange(fiches) {
  let min = null, max = null;
  fiches.forEach(f => {
    const d = parseDate(f.Date_Debut), e = parseDate(f.Date_Fin);
    if (d && (!min || d < min)) min = d;
    if (e && (!max || e > max)) max = e;
  });
  if (!min) min = new Date();
  if (!max) { max = new Date(min); max.setFullYear(max.getFullYear() + 1); }
  // Padding 1 mois de chaque côté
  min = new Date(min); min.setMonth(min.getMonth() - 1); min.setDate(1);
  max = new Date(max); max.setMonth(max.getMonth() + 2); max.setDate(1);
  return { min, max };
}

// ── Largeur d'une unité selon le zoom ──
const UNIT_PX = { semaine: 40, mois: 60, trimestre: 80 };

function daysBetween(a, b) {
  return (b - a) / 86400000;
}
function dateToX(date, rangeMin) {
  const days = daysBetween(rangeMin, date);
  const u    = UNIT_PX[zoom];
  if (zoom === 'semaine')   return days * (u / 7);
  if (zoom === 'mois')      return days * (u / 30);
  if (zoom === 'trimestre') return days * (u / 90);
  return days;
}

// ── Render header ──
function renderHeader(range) {
  const months  = document.getElementById('header-months');
  const weeks   = document.getElementById('header-weeks');
  months.innerHTML = '';
  weeks.innerHTML  = '';

  const cur = new Date(range.min);
  const end = range.max;

  if (zoom === 'trimestre') {
    // Trimestres
    while (cur < end) {
      const qStart = new Date(cur);
      const q = Math.floor(cur.getMonth() / 3);
      cur.setMonth((q + 1) * 3); cur.setDate(1);
      const qEnd = cur < end ? new Date(cur) : new Date(end);
      const w = dateToX(qEnd, range.min) - dateToX(qStart, range.min);
      const div = document.createElement('div');
      div.className = 'gantt-header-month';
      div.style.width = w + 'px';
      div.textContent = `T${q+1} ${qStart.getFullYear()}`;
      months.appendChild(div);
    }
    return;
  }

  // Mois dans la rangée du haut
  const cur2 = new Date(range.min);
  while (cur2 < end) {
    const mStart = new Date(cur2);
    cur2.setMonth(cur2.getMonth() + 1); cur2.setDate(1);
    const mEnd = cur2 < end ? new Date(cur2) : new Date(end);
    const w = dateToX(mEnd, range.min) - dateToX(mStart, range.min);
    const div = document.createElement('div');
    div.className = 'gantt-header-month';
    div.style.width = w + 'px';
    div.textContent = fmtMonth(mStart);
    months.appendChild(div);
  }

  // Semaines dans la rangée du bas
  if (zoom === 'semaine' || zoom === 'mois') {
    const cur3 = new Date(range.min);
    // Aligne au lundi
    const day = cur3.getDay();
    cur3.setDate(cur3.getDate() - (day === 0 ? 6 : day - 1));
    while (cur3 < end) {
      const wStart = new Date(cur3);
      cur3.setDate(cur3.getDate() + 7);
      const wEnd = cur3 < end ? new Date(cur3) : new Date(end);
      const x1 = Math.max(0, dateToX(wStart, range.min));
      const x2 = dateToX(wEnd, range.min);
      const w  = x2 - x1;
      if (w < 1) continue;
      const div = document.createElement('div');
      div.className = 'gantt-header-week';
      div.style.width = w + 'px';
      if (zoom === 'semaine') {
        div.textContent = `S${getWeekNum(wStart)}`;
      } else {
        div.textContent = wStart.getDate();
      }
      weeks.appendChild(div);
    }
  }
}

function getWeekNum(d) {
  const onejan = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
}

// ── Render lignes verticales ──
function renderVLines(range, totalW, totalH) {
  const rows = document.getElementById('gantt-rows');
  // Supprime anciens vlines
  rows.querySelectorAll('.gantt-vline').forEach(e => e.remove());
  const cur = new Date(range.min);
  while (cur < range.max) {
    const x = dateToX(cur, range.min);
    const line = document.createElement('div');
    line.className = 'gantt-vline' + (cur.getDate() === 1 ? ' month' : '');
    line.style.left = x + 'px';
    line.style.height = totalH + 'px';
    rows.appendChild(line);
    if (zoom === 'trimestre') cur.setMonth(cur.getMonth() + 3);
    else if (zoom === 'mois') cur.setMonth(cur.getMonth() + 1);
    else cur.setDate(cur.getDate() + 7);
  }
  // Ligne aujourd'hui
  const todayX = dateToX(new Date(), range.min);
  if (todayX > 0 && todayX < totalW) {
    const tl = document.createElement('div');
    tl.className = 'today-line';
    tl.style.left = todayX + 'px';
    tl.style.height = totalH + 'px';
    rows.appendChild(tl);
  }
}

// ── Render principal ──
function render() {
  const hasDates = filtered.some(f => parseDate(f.Date_Debut) && parseDate(f.Date_Fin));

  // Liste gauche
  const listBody = document.getElementById('task-list-body');
  listBody.innerHTML = '';
  filtered.forEach(f => {
    const pk    = getPilierKey(f.Pilier);
    const color = PILIER_COLORS[pk];
    const row   = document.createElement('div');
    row.className = 'task-row' + (selectedId === f.id ? ' selected' : '');
    row.innerHTML = `
      <div class="task-name">
        <div class="pilier-dot" style="background:${color}"></div>
        ${esc(f.Programme || '—')}
      </div>
      <div class="task-date">${fmtDate(parseDate(f.Date_Debut))}</div>
      <div class="task-date">${fmtDate(parseDate(f.Date_Fin))}</div>
    `;
    row.onclick = () => selectFiche(f.id);
    listBody.appendChild(row);
  });

  if (!hasDates) {
    // Pas de dates → message
    document.getElementById('gantt-rows').innerHTML = `
      <div class="no-date-msg" style="padding:40px">
        <div style="font-size:2rem">📅</div>
        <div>Aucune date renseignée dans les fiches programmes.</div>
        <div style="font-size:0.75rem">Ajoutez les colonnes <strong>Date_Debut</strong> et <strong>Date_Fin</strong> dans votre table Grist.</div>
      </div>`;
    return;
  }

  const range  = getRange(filtered);
  const totalW = dateToX(range.max, range.min);
  const totalH = filtered.length * 36;

  // Header
  renderHeader(range);
  document.getElementById('gantt-header').style.width = totalW + 'px';

  // Corps
  const ganttRows = document.getElementById('gantt-rows');
  ganttRows.style.width  = totalW + 'px';
  ganttRows.style.height = totalH + 'px';

  // Vider les barres (garder les vlines)
  ganttRows.querySelectorAll('.gantt-row').forEach(e => e.remove());

  filtered.forEach((f, idx) => {
    const dStart = parseDate(f.Date_Debut);
    const dEnd   = parseDate(f.Date_Fin);
    const pk     = getPilierKey(f.Pilier);
    const color  = PILIER_COLORS[pk];
    const avct   = Math.min(100, Math.max(0, f.Avancement_Global || 0));

    const row = document.createElement('div');
    row.className = 'gantt-row' + (selectedId === f.id ? ' selected' : '');
    row.style.top = (idx * 36) + 'px';
    row.style.left = '0';
    row.style.right = '0';
    row.style.position = 'absolute';
    row.onclick = () => selectFiche(f.id);

    if (dStart && dEnd) {
      const x1 = Math.max(0, dateToX(dStart, range.min));
      const x2 = Math.max(x1 + 4, dateToX(dEnd, range.min));
      const bw = x2 - x1;

      const bar = document.createElement('div');
      bar.className = 'gantt-bar' + (selectedId === f.id ? ' selected' : '');
      bar.style.left       = x1 + 'px';
      bar.style.width      = bw + 'px';
      bar.style.background = color;
      bar.title = `${f.Programme} | ${fmtDate(dStart)} → ${fmtDate(dEnd)} | ${avct}%`;

      // Barre de progression
      const prog = document.createElement('div');
      prog.className = 'gantt-bar-progress';
      prog.style.width = avct + '%';
      bar.appendChild(prog);

      // Label
      if (bw > 30) {
        const lbl = document.createElement('div');
        lbl.className = 'gantt-bar-label';
        lbl.textContent = f.Programme || '';
        bar.appendChild(lbl);
      }

      row.appendChild(bar);
    }
    ganttRows.appendChild(row);
  });

  renderVLines(range, totalW, totalH);

  // Sync scroll liste / barres
  syncScroll();
}

// ── Sync scroll vertical ──
function syncScroll() {
  const listBody  = document.getElementById('task-list-body');
  const ganttBody = document.getElementById('gantt-body');
  listBody.onscroll = () => { ganttBody.scrollTop = listBody.scrollTop; };
  ganttBody.onscroll = () => { listBody.scrollTop = ganttBody.scrollTop; };
}

// ── Filtres ──
function applyFilters() {
  const pilier = document.getElementById('filter-pilier').value;
  const statut = document.getElementById('filter-statut').value;
  const prio   = document.getElementById('filter-prio').value;
  filtered = allFiches.filter(f => {
    if (pilier && getPilierKey(f.Pilier) !== pilier) return false;
    if (statut && !String(f.Statut || '').toLowerCase().includes(statut.toLowerCase())) return false;
    if (prio   && !String(f.Priorite || '').toLowerCase().includes(prio.toLowerCase())) return false;
    return true;
  });
  render();
}

// ── Zoom ──
function setZoom(z) {
  zoom = z;
  ['semaine','mois','trimestre'].forEach(id => {
    document.getElementById('z-' + id).classList.toggle('active', id === z);
  });
  render();
}

// ── Sélection ──
function selectFiche(id) {
  selectedId = (selectedId === id) ? null : id;
  if (selectedId) grist.setSelectedRows([selectedId]);
  render();
}

// ── Navigation ──
function goMaison()  { try { grist.setSelectedRows([]); } catch(e) {} }
function goFiche()   { try { grist.setSelectedRows([selectedId]); } catch(e) {} }

// ── Helpers ──
function esc(t) {
  const d = document.createElement('div');
  d.textContent = String(t || '');
  return d.innerHTML;
}

// ── Init ──
const fallbackTimer = setTimeout(() => {
  allFiches = DEMO;
  filtered  = DEMO;
  show();
  render();
}, 1500);

function show() {
  document.getElementById('loading').style.display = 'none';
  const wrap = document.getElementById('gantt-wrap');
  wrap.style.display = 'flex';
  scaleToFit();
}

try {
  grist.ready({ requiredAccess: 'full' });

  grist.onRecords(records => {
    if (records && records.length > 0) {
      clearTimeout(fallbackTimer);
      allFiches = records;
      filtered  = records;
      show();
      render();
    }
  });

  grist.onRecord(rec => {
    if (rec && rec.id) {
      selectedId = rec.id;
      render();
    }
  });

} catch(e) {
  clearTimeout(fallbackTimer);
  allFiches = DEMO;
  filtered  = DEMO;
  show();
  render();
}
