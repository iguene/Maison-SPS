<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Gantt SPS</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #f0f4f8;
  display: flex;
  align-items: flex-start;
}

/* ── WRAPPER 1400x860 ── */
#gantt-wrap {
  width: 1400px;
  height: 860px;
  transform-origin: top left;
  display: none;
  flex-direction: column;
}

/* ── HEADER ── */
.top-bar {
  display: flex;
  align-items: center;
  background: white;
  border-bottom: 2px solid #e2e8f0;
  padding: 10px 20px;
  gap: 14px;
  flex-shrink: 0;
  height: 60px;
}
.logo-sm {
  font-size: 0.85rem;
  font-weight: 900;
  color: #c0392b;
  border: 2.5px solid #c0392b;
  padding: 3px 8px;
  border-radius: 3px;
  line-height: 1.3;
  text-align: center;
  flex-shrink: 0;
}
.logo-sm span { font-size: 0.6rem; color: #2c3e50; display: block; }
.page-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: #1e293b;
  flex: 1;
}
.nav-btns { display: flex; gap: 10px; }
.nav-btn {
  padding: 7px 28px;
  font-size: 0.82rem;
  font-weight: 700;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.15s;
}
.nav-btn:hover { opacity: 0.85; }
.nav-btn.maison   { background: #1a6b6b; color: white; }
.nav-btn.fiche    { background: #2980b9; color: white; }

/* ── FILTRES ── */
.filters-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 20px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.filters-bar label {
  font-size: 0.78rem;
  font-weight: 600;
  color: #475569;
}
.filters-bar select, .filters-bar input {
  padding: 4px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  font-size: 0.78rem;
  font-family: inherit;
  color: #1e293b;
  background: white;
}
.zoom-btns { display: flex; gap: 4px; margin-left: auto; }
.zoom-btn {
  padding: 4px 12px;
  font-size: 0.75rem;
  font-weight: 600;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: white;
  cursor: pointer;
  font-family: inherit;
  color: #475569;
  transition: all 0.15s;
}
.zoom-btn:hover, .zoom-btn.active { background: #2c3e50; color: white; border-color: #2c3e50; }

/* ── ZONE GANTT ── */
.gantt-container {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── PANNEAU GAUCHE (liste) ── */
.task-list {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #e2e8f0;
  overflow: hidden;
}
.task-list-header {
  display: grid;
  grid-template-columns: 1fr 80px 80px;
  background: #2c3e50;
  color: white;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0;
  flex-shrink: 0;
  height: 52px;
}
.task-list-header div {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  border-right: 1px solid rgba(255,255,255,0.15);
  text-align: center;
  line-height: 1.3;
}
.task-list-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.task-row {
  display: grid;
  grid-template-columns: 1fr 80px 80px;
  border-bottom: 1px solid #f1f5f9;
  cursor: pointer;
  transition: background 0.1s;
  min-height: 36px;
}
.task-row:hover   { background: #f0f9ff; }
.task-row.selected { background: #dbeafe; }
.task-row div {
  display: flex;
  align-items: center;
  padding: 4px 8px;
  font-size: 0.75rem;
  color: #334155;
  border-right: 1px solid #f1f5f9;
  overflow: hidden;
}
.task-name {
  font-weight: 600;
  color: #1e293b !important;
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}
.task-date { justify-content: center !important; font-size: 0.7rem !important; color: #64748b !important; }

/* Pilier badge dans la liste */
.pilier-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  flex-shrink: 0;
}

/* ── PANNEAU DROIT (barres) ── */
.gantt-chart {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Header dates */
.gantt-header {
  flex-shrink: 0;
  background: #2c3e50;
  overflow: hidden;
  position: relative;
}
.gantt-header-months {
  display: flex;
  height: 26px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
.gantt-header-month {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: white;
  border-right: 1px solid rgba(255,255,255,0.2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.gantt-header-weeks {
  display: flex;
  height: 26px;
}
.gantt-header-week {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.7);
  border-right: 1px solid rgba(255,255,255,0.1);
}

/* Corps barres */
.gantt-body {
  flex: 1;
  overflow: auto;
  position: relative;
}
.gantt-rows {
  position: absolute;
  top: 0; left: 0;
  min-width: 100%;
}
.gantt-row {
  position: relative;
  height: 36px;
  border-bottom: 1px solid #f1f5f9;
}
.gantt-row:hover { background: rgba(0,0,0,0.02); }
.gantt-row.selected { background: rgba(59,130,246,0.06); }

/* Lignes verticales (mois/semaines) */
.gantt-vline {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: #e2e8f0;
  pointer-events: none;
}
.gantt-vline.month { background: #cbd5e1; }

/* Ligne aujourd'hui */
.today-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: #ef4444;
  z-index: 5;
  pointer-events: none;
}
.today-line::before {
  content: "Aujourd'hui";
  position: absolute;
  top: -18px;
  left: 4px;
  font-size: 0.65rem;
  color: #ef4444;
  font-weight: 600;
  white-space: nowrap;
}

/* Barre Gantt */
.gantt-bar {
  position: absolute;
  top: 6px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.15s, filter 0.15s;
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  z-index: 2;
  min-width: 4px;
}
.gantt-bar:hover { filter: brightness(1.1); opacity: 0.9; }
.gantt-bar.selected { filter: brightness(1.05); box-shadow: 0 0 0 2px #3b82f6; }
.gantt-bar-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Barre de progression */
.gantt-bar-progress {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 4px;
  background: rgba(0,0,0,0.15);
  pointer-events: none;
}

/* Légende piliers */
.legend {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px 20px;
  background: white;
  border-top: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  color: #475569;
  font-weight: 600;
}
.legend-dot {
  width: 12px; height: 12px;
  border-radius: 3px;
}

/* Statut badge */
.statut-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 0.65rem;
  font-weight: 600;
}
.s-en-cours { background: #dbeafe; color: #1d4ed8; }
.s-termine  { background: #dcfce7; color: #15803d; }
.s-a-venir  { background: #fef9c3; color: #854d0e; }

/* ── LOADING ── */
#loading {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100vh;
  color: #888; gap: 10px; font-size: 0.9rem;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid #ddd;
  border-top-color: #c0392b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── EMPTY ── */
.no-date-msg {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: #94a3b8; font-size: 0.85rem; font-style: italic;
  text-align: center; flex-direction: column; gap: 8px;
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Chargement...</div>

<div id="gantt-wrap">

  <!-- HEADER -->
  <div class="top-bar">
    <div class="logo-sm">SPS<span>MEDICAL</span></div>
    <div class="page-title">📅 Planning Gantt — Maison SPS Medical (Vision 3 ans)</div>
    <div class="nav-btns">
      <button class="nav-btn maison" onclick="goMaison()">MAISON</button>
      <button class="nav-btn fiche"  onclick="goFiche()">FICHE</button>
    </div>
  </div>

  <!-- FILTRES -->
  <div class="filters-bar">

      <option value="A venir">A venir</option>

      <option value="">Toutes</option>

      <option value="Haute">Haute</option>
      <option value="Moyenne">Moyenne</option>
      <option value="Basse">Basse</option>
    </select>
    <div class="zoom-btns">
      <button class="zoom-btn" onclick="setZoom('semaine')" id="z-semaine">Semaine</button>
      <button class="zoom-btn active" onclick="setZoom('mois')" id="z-mois">Mois</button>
      <button class="zoom-btn" onclick="setZoom('trimestre')" id="z-trimestre">Trimestre</button>
    </div>
  </div>

  <!-- GANTT -->
  <div class="gantt-container">

    <!-- Liste gauche -->
    <div class="task-list">

        <div>Programme</div>

    <!-- Barres droite -->
    <div class="gantt-chart">
      <div class="gantt-header" id="gantt-header">
        <div class="gantt-header-months" id="header-months"></div>
        <div class="gantt-header-weeks"  id="header-weeks"></div>
      </div>
      <div class="gantt-body" id="gantt-body">
        <div class="gantt-rows" id="gantt-rows"></div>
      </div>
    </div>

  </div>

  <!-- LÉGENDE -->
  <div class="legend">
    <span style="font-size:0.72rem;font-weight:700;color:#475569;margin-right:4px">Piliers :</span>
    <div class="legend-item"><div class="legend-dot" style="background:#2980b9"></div>Développement Business</div>
    <div class="legend-item"><div class="legend-dot" style="background:#27ae60"></div>Impact</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c0392b"></div>Culture Managériale</div>
    <span style="margin-left:16px;font-size:0.72rem;font-weight:700;color:#475569">Statuts :</span>
    <span class="statut-badge s-en-cours">En cours</span>
    <span class="statut-badge s-termine">Terminé</span>
    <span class="statut-badge s-a-venir">A venir</span>
    <span style="margin-left:auto;font-size:0.7rem;color:#94a3b8;font-style:italic">
      La bande sombre sur chaque barre = avancement global
    </span>
  </div>

</div>
