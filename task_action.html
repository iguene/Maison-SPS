<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--border:#e4e9f2;--border2:#c8d3e6;--text:#111827;--text2:#4b5563;--text3:#9ca3af;--blue:#2563eb;--blue-lt:#dbeafe;--green:#16a34a;--green-lt:#dcfce7;--orange:#d97706;--orange-lt:#fef3c7;--red:#dc2626;--red-lt:#fee2e2;--grey-lt:#f3f4f6;--sps:#c0392b;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;--r:10px;--r-sm:6px;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);--shadow-h:0 2px 8px rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.08);--panel-w:500px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px}body{display:flex;flex-direction:column}button,input,select,textarea{font-family:var(--font)}*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}*::-webkit-scrollbar{width:5px}*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}.app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.sps-nav-bar{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.95);border-bottom:1px solid rgba(0,0,0,.08);padding:6px 14px;flex-shrink:0;z-index:1000;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-wrap:nowrap}.sps-nav-bar::-webkit-scrollbar{display:none}.sps-nav-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;border:1.5px solid transparent;background:#f3f4f6;color:#374151;font-size:12.5px;font-weight:500;text-decoration:none;transition:all 150ms;white-space:nowrap;cursor:pointer}.sps-nav-btn:hover{background:#e0f2f1;border-color:#01696f;color:#01696f}.sps-nav-btn.sps-active{background:var(--sps);color:white;border-color:var(--sps)}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:30}.topbar-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}.topbar-sep{flex:1}.search-wrap{position:relative;width:280px}.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;pointer-events:none}.search-input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);font-size:12px;color:var(--text);outline:none}.search-input:focus,.field-input:focus,.field-textarea:focus,.field-select:focus,.filter-sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1);background:white}.filter-sel{padding:6px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;color:var(--text);background:var(--bg);outline:none;cursor:pointer}.btn-new{background:var(--sps);color:white;border:none;border-radius:var(--r-sm);padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}.btn-new:hover{opacity:.88}.save-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--green-lt);color:var(--green);opacity:0;transition:opacity .3s}.save-pill.show{opacity:1}
.body-wrap{flex:1;display:flex;overflow:hidden;position:relative}.list-area{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:margin-right .3s}.list-area.panel-open{margin-right:var(--panel-w)}.action-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s,transform .15s;position:relative}.action-row:hover{box-shadow:var(--shadow-h);border-color:var(--border2);transform:translateY(-1px)}.action-row.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.15)}.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.action-main{flex:1;min-width:0}.action-name{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action-sub{font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.action-sub-item{display:flex;align-items:center;gap:4px}.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0}.badge.ec{background:var(--blue-lt);color:var(--blue)}.badge.ok{background:var(--green-lt);color:var(--green)}.badge.av{background:var(--orange-lt);color:var(--orange)}.badge.af{background:var(--grey-lt);color:var(--text2)}.level-badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:8px;background:#eef2ff;color:#3730a3}.date-badge{font-size:10.5px;color:var(--text2);font-family:var(--mono);white-space:nowrap}.prog-wrap{width:100px;flex-shrink:0}.prog-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:3px}.prog-fill{height:100%;border-radius:3px;background:var(--blue);transition:width .3s}.prog-label{font-size:10px;color:var(--text3);text-align:right;font-family:var(--mono)}.action-arrow{font-size:14px;color:var(--text3);flex-shrink:0}.empty-state{padding:40px;text-align:center;color:var(--text3)}.empty-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}.empty-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:5px}.empty-sub{font-size:12px;line-height:1.6}.loading{display:flex;align-items:center;justify-content:center;flex:1;gap:10px;color:var(--text3)}.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--sps);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.side-panel{position:absolute;right:0;top:0;bottom:0;width:var(--panel-w);background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:20;box-shadow:-4px 0 20px rgba(0,0,0,.08);overflow:hidden}.side-panel.open{transform:translateX(0)}.panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}.panel-head-title{flex:1;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);padding:2px;line-height:1}.panel-close:hover{color:var(--text)}.panel-btns{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0}.btn-edit,.btn-save{color:white;border:none;border-radius:var(--r-sm);padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}.btn-edit{background:var(--blue)}.btn-save{background:var(--green)}.btn-cancel{background:var(--grey-lt);color:var(--text2);border:none;border-radius:var(--r-sm);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer}.btn-delete{background:none;color:var(--red);border:1px solid var(--red-lt);border-radius:var(--r-sm);padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-left:auto}.btn-delete:hover{background:var(--red-lt)}.panel-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}.field-group{display:flex;flex-direction:column;gap:5px}.field-label{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}.field-label.required::after{content:' *';color:var(--red)}.field-value{font-size:13px;color:var(--text);line-height:1.6}.field-input,.field-select{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12.5px;color:var(--text);background:var(--bg);outline:none}.field-textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12.5px;color:var(--text);background:var(--bg);outline:none;resize:vertical;min-height:80px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel-section{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-top:4px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(60px);background:#1e293b;color:#fff;padding:7px 18px;border-radius:20px;font-size:12px;font-weight:500;z-index:9999;pointer-events:none;opacity:0;transition:all .3s;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.error-box{background:var(--red-lt);color:var(--red);border:1px solid #fecaca;border-radius:var(--r-sm);padding:8px 10px;font-size:12px;display:none}.error-box.show{display:block}
</style>
</head>
<body>
<div class="app">
<div class="sps-nav-bar" id="spsNav">
  <a class="sps-nav-btn" data-page="10" href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/10" target="_top">📊 Dashboard</a>
  <a class="sps-nav-btn" data-page="7" href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/7" target="_top">🏠 Maison SPS</a>
  <a class="sps-nav-btn" data-page="9" href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/9" target="_top">📅 Planning</a>
  <a class="sps-nav-btn" data-page="8" href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/8" target="_top">📋 Programmes</a>
  <a class="sps-nav-btn" data-page="11" href="https://grist.numerique.gouv.fr/o/docs/15oDBrVdEDCJ/Maison-SPS/p/11" target="_top">📁 Fiches</a>
  <a class="sps-nav-btn sps-active" href="#">✅ Actions</a>
</div>
<div class="topbar">
  <div class="topbar-title">✅ Actions</div>
  <div class="topbar-sep"></div>
  <div class="search-wrap"><span class="search-icon">🔍</span><input id="searchInput" class="search-input" type="search" placeholder="Rechercher une action…" oninput="applyFilters()"></div>
  <select class="filter-sel" id="filterProgramme" onchange="applyFilters()"><option value="">Tous les programmes</option></select>
  <select class="filter-sel" id="filterStatut" onchange="applyFilters()"><option value="">Tous les statuts</option><option value="A faire">À faire</option><option value="En cours">En cours</option><option value="Terminé">Terminé</option><option value="Planifié">Planifié</option></select>
  <select class="filter-sel" id="filterPilote" onchange="applyFilters()"><option value="">Tous les pilotes</option></select>
  <button class="btn-new" onclick="openCreate()">+ Nouvelle action</button>
  <span class="save-pill" id="savePill">✓ Enregistré</span>
</div>
<div class="body-wrap">
  <div class="list-area" id="listArea"><div class="loading"><div class="spinner"></div>Chargement…</div></div>
  <div class="side-panel" id="sidePanel"><div class="panel-head"><div class="panel-head-title" id="panelTitle">—</div><button class="panel-close" onclick="closePanel()" title="Fermer">✕</button></div><div class="panel-btns" id="panelBtns"></div><div class="panel-body" id="panelBody"></div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var allActions=[], allProgrammes=[], membresRows=[];
var resolvedTable='Actions', selectedId=null, panelMode=null;
var dateFields=['Date_Demarrage','Date_Fin'];
var actionFields=['Libelle','Initiative_ID','Niveau','Action_Parent','Tache_precedente','Pilote','Date_Demarrage','Date_Fin','Montant_EUR','PDCA','Statut','Description','Tags','Est_Projet'];
var esc=function(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML};
var toast_t;function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast_t);toast_t=setTimeout(function(){el.classList.remove('show')},2600)}
function savePill(){var el=document.getElementById('savePill');el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2000)}
function convertColumnar(data){if(!data)return[];if(Array.isArray(data))return data;var cols=Object.keys(data);if(!cols.length)return[];var n=data[cols[0]]&&data[cols[0]].length||0;return Array.from({length:n},function(_,i){var r={};cols.forEach(function(c){r[c]=data[c][i]});return r})}
async function fetchT(candidates){for(var i=0;i<candidates.length;i++){try{return{name:candidates[i],rows:convertColumnar(await grist.docApi.fetchTable(candidates[i]))}}catch(e){}}try{var all=await grist.docApi.listTables();var norm=function(s){return String(s).toLowerCase().replace(/[\s_]/g,'')};var match=all.find(function(t){return candidates.map(norm).includes(norm(t))});if(match)return{name:match,rows:convertColumnar(await grist.docApi.fetchTable(match))}}catch(e){}return{name:null,rows:[]}}
function refId(val){if(!val&&val!==0)return null;if(Array.isArray(val))return val.find(function(v){return typeof v==='number'&&v>0})||null;if(typeof val==='number')return val;if(typeof val==='string'&&!isNaN(val)&&val!=='')return Number(val);return null}
function memberLabel(val){var id=refId(val);if(id){var m=membresRows.find(function(x){return x.id===id});if(m)return String(m.Nom||m.name||m.Prenom||m.Prénom||id)}if(Array.isArray(val)&&val[0]&&typeof val[0]==='string')return val[0];return String(val||'')}
function programmeLabel(val){var id=refId(val);if(id){var p=allProgrammes.find(function(x){return x.id===id});if(p)return String(p.Programme||p.Programme_No||p.Nom||p.name||id)}if(Array.isArray(val)&&val[0]&&typeof val[0]==='string')return val[0];return String(val||'')}
function actionLabel(val){var id=refId(val);if(id){var a=allActions.find(function(x){return x.id===id});if(a)return String(a.Libelle||a.name||id)}if(Array.isArray(val)&&val[0]&&typeof val[0]==='string')return val[0];return String(val||'')}
function dateInputValue(v){if(v==null||v==='')return'';if(typeof v==='number'){var d=new Date(v*1000);return d.toISOString().slice(0,10)}var s=String(v).trim();var m=s.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);if(m)return m[3]+'-'+m[2]+'-'+m[1];m=s.match(/^(\d{4})[-\/](\d{2})[-\/](\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];return''}
function toGristDate(s){if(!s)return null;var p=s.split('-').map(Number);if(p.length!==3||!p[0]||!p[1]||!p[2])return null;return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/1000)}
function displayDate(v){var s=dateInputValue(v);if(!s)return'—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function getStatutClass(s){s=String(s||'').toLowerCase();if(s.includes('cours'))return'ec';if(s.includes('termin'))return'ok';if(s.includes('plan')||s.includes('venir'))return'av';return'af'}
function dotColor(s){var c=getStatutClass(s);return c==='ok'?'#16a34a':c==='ec'?'#2563eb':c==='av'?'#d97706':'#9ca3af'}
function pctValue(a){var p=Number(a.PDCA);if(!isFinite(p))return 0;if(p<=1&&p>0)p=p*100;return Math.min(100,Math.max(0,p))}
function applyFilters(){var q=document.getElementById('searchInput').value.trim().toLowerCase();var prog=document.getElementById('filterProgramme').value;var statut=document.getElementById('filterStatut').value;var pilote=document.getElementById('filterPilote').value;var list=allActions.filter(function(a){if(q&&!String(a.Libelle||'').toLowerCase().includes(q)&&!String(a.Description||'').toLowerCase().includes(q)&&!programmeLabel(a.Initiative_ID).toLowerCase().includes(q))return false;if(prog&&String(refId(a.Initiative_ID))!==prog)return false;if(statut&&String(a.Statut||'')!==statut)return false;if(pilote&&String(refId(a.Pilote))!==pilote)return false;return true});renderList(list)}
function renderList(list){var area=document.getElementById('listArea');if(!list.length){area.innerHTML='<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">Aucune action trouvée</div><div class="empty-sub">Modifiez les filtres ou créez une nouvelle action.</div></div>';return}area.innerHTML=list.map(function(a){var pct=pctValue(a),sel=a.id===selectedId;return '<div class="action-row'+(sel?' selected':'')+'" onclick="openView('+a.id+')" data-id="'+a.id+'"><div class="status-dot" style="background:'+dotColor(a.Statut)+'"></div><div class="action-main"><div class="action-name">'+esc(a.Libelle||'Sans titre')+'</div><div class="action-sub"><span class="action-sub-item">📁 '+esc(programmeLabel(a.Initiative_ID)||'—')+'</span><span class="action-sub-item">👤 '+esc(memberLabel(a.Pilote)||'—')+'</span><span class="action-sub-item">📅 '+esc(displayDate(a.Date_Demarrage))+' → '+esc(displayDate(a.Date_Fin))+'</span></div></div><span class="level-badge">'+esc(a.Niveau||'Action')+'</span><span class="badge '+getStatutClass(a.Statut)+'">'+esc(a.Statut||'À faire')+'</span><div class="prog-wrap"><div class="prog-bg"><div class="prog-fill" style="width:'+pct+'%"></div></div><div class="prog-label">'+Math.round(pct)+'%</div></div><span class="action-arrow">›</span></div>'}).join('')}
function openView(id){selectedId=id;panelMode='view';var a=allActions.find(function(x){return x.id===id});if(!a)return;document.querySelectorAll('.action-row').forEach(function(r){r.classList.toggle('selected',parseInt(r.dataset.id)===id)});document.getElementById('panelTitle').textContent=a.Libelle||'—';document.getElementById('panelBtns').innerHTML='<button class="btn-edit" onclick="openEdit('+id+')">✏️ Modifier</button><button class="btn-delete" onclick="confirmDelete('+id+')">🗑 Supprimer</button>';var pct=pctValue(a);document.getElementById('panelBody').innerHTML='<div class="field-grid"><div class="field-group"><div class="field-label">Statut</div><span class="badge '+getStatutClass(a.Statut)+'">'+esc(a.Statut||'À faire')+'</span></div><div class="field-group"><div class="field-label">PDCA</div><div class="field-value" style="font-family:var(--mono);font-weight:800;color:var(--blue)">'+Math.round(pct)+'%</div></div></div><div class="field-grid"><div class="field-group"><div class="field-label">Début</div><div class="field-value">'+esc(displayDate(a.Date_Demarrage))+'</div></div><div class="field-group"><div class="field-label">Fin</div><div class="field-value">'+esc(displayDate(a.Date_Fin))+'</div></div></div><div class="field-grid"><div class="field-group"><div class="field-label">Programme lié</div><div class="field-value">'+esc(programmeLabel(a.Initiative_ID)||'—')+'</div></div><div class="field-group"><div class="field-label">Pilote</div><div class="field-value">'+esc(memberLabel(a.Pilote)||'—')+'</div></div></div><div class="field-grid"><div class="field-group"><div class="field-label">Projet parent</div><div class="field-value">'+esc(actionLabel(a.Action_Parent)||'—')+'</div></div><div class="field-group"><div class="field-label">Tâche précédente</div><div class="field-value">'+esc(actionLabel(a.Tache_precedente)||'—')+'</div></div></div><div class="field-grid"><div class="field-group"><div class="field-label">Montant EUR</div><div class="field-value">'+esc(a.Montant_EUR||'—')+'</div></div><div class="field-group"><div class="field-label">Est projet</div><div class="field-value">'+(a.Est_Projet?'Oui':'Non')+'</div></div></div>'+(a.Description?'<div class="field-group"><div class="field-label">Description</div><div class="field-value">'+esc(a.Description)+'</div></div>':'')+(a.Tags?'<div class="field-group"><div class="field-label">Tags</div><div class="field-value">'+esc(a.Tags)+'</div></div>':'');openPanel()}
function options(rows,labelFn,selected,excludeId){return rows.filter(function(r){return !excludeId||r.id!==excludeId}).map(function(r){var id=r.id;return '<option value="'+id+'"'+(String(id)===String(selected)?' selected':'')+'>'+esc(labelFn(r))+'</option>'}).join('')}
function lookupLabel(rows,labelFn,id){id=refId(id);if(!id)return'';var r=rows.find(function(x){return x.id===id});return r?String(labelFn(r))+' (#'+id+')':''}
function datalistOptions(rows,labelFn,excludeId){return rows.filter(function(r){return !excludeId||r.id!==excludeId}).map(function(r){var label=String(labelFn(r)||r.id);return '<option value="'+esc(label+' (#'+r.id+')')+'"></option>'}).join('')}
function resolveLookup(value,rows,labelFn){if(value==null||value==='')return null;var s=String(value).trim();var m=s.match(/\(#(\d+)\)\s*$/);if(m)return Number(m[1]);var exact=rows.find(function(r){return String(labelFn(r)||r.id).trim().toLowerCase()===s.toLowerCase()});if(exact)return exact.id;if(!isNaN(s))return Number(s);return null}
function datalistInput(id,label,value,listId,opts,placeholder,required){return '<div class="field-group"><div class="field-label'+(required?' required':'')+'">'+esc(label)+'</div><input class="field-input" id="'+id+'" list="'+listId+'" value="'+esc(value||'')+'" placeholder="'+esc(placeholder||'Tapez pour rechercher…')+'"><datalist id="'+listId+'">'+opts+'</datalist></div>'}
function fixedDatalistOptions(items){return items.map(function(x){return '<option value="'+esc(x)+'"></option>'}).join('')}
function renderEditForm(d,excludeId){
  var progSel=lookupLabel(allProgrammes,function(p){return p.Programme||p.Programme_No||p.Nom||p.name||p.id},d.Initiative_ID);
  var piloteSel=lookupLabel(membresRows,function(m){return m.Nom||m.name||m.Prenom||m.Prénom||m.id},d.Pilote);
  var parentSel=lookupLabel(allActions,function(a){return a.Libelle||a.name||a.id},d.Action_Parent);
  var prevSel=lookupLabel(allActions,function(a){return a.Libelle||a.name||a.id},d.Tache_precedente);
  var niveaux=['1 - Projet','2 - Tâche','3 - Sous-tâche'];
  var statuts=['A faire','En cours','Terminé','Planifié'];
  document.getElementById('panelBody').innerHTML=
    '<div class="error-box" id="formError"></div>'+ 
    '<div class="field-group"><div class="field-label required">Libellé</div><input class="field-input" id="ef_Libelle" value="'+esc(d.Libelle||'')+'" placeholder="Nom de l’action" required></div>'+ 
    '<div class="field-grid"><div class="field-group"><div class="field-label required">Début</div><input class="field-input" id="ef_Date_Demarrage" type="date" value="'+esc(dateInputValue(d.Date_Demarrage))+'" required></div><div class="field-group"><div class="field-label required">Fin</div><input class="field-input" id="ef_Date_Fin" type="date" value="'+esc(dateInputValue(d.Date_Fin))+'" required></div></div>'+ 
    '<div class="field-grid">'+
      datalistInput('ef_Initiative_ID','Programme lié',progSel,'dl_Initiative_ID',datalistOptions(allProgrammes,function(p){return p.Programme||p.Programme_No||p.Nom||p.name||p.id},null),'Tapez le nom du programme…',true)+
      datalistInput('ef_Pilote','Pilote',piloteSel,'dl_Pilote',datalistOptions(membresRows,function(m){return m.Nom||m.name||m.Prenom||m.Prénom||m.id},null),'Tapez le nom du pilote…',true)+
    '</div>'+ 
    '<div class="field-grid">'+
      datalistInput('ef_Action_Parent','Projet parent',parentSel,'dl_Action_Parent',datalistOptions(allActions,function(a){return a.Libelle||a.name||a.id},excludeId),'Tapez le projet parent…',true)+
      datalistInput('ef_Tache_precedente','Tâche précédente',prevSel,'dl_Tache_precedente',datalistOptions(allActions,function(a){return a.Libelle||a.name||a.id},excludeId),'Tapez la tâche précédente…',true)+
    '</div>'+ 
    '<div class="field-grid">'+
      datalistInput('ef_Niveau','Niveau',String(d.Niveau||'2 - Tâche'),'dl_Niveau',fixedDatalistOptions(niveaux),'Tapez ou choisissez le niveau…',true)+
      datalistInput('ef_Statut','Statut',String(d.Statut||'A faire'),'dl_Statut',fixedDatalistOptions(statuts),'Tapez ou choisissez le statut…',true)+
    '</div>'+ 
    '<div class="field-grid"><div class="field-group"><div class="field-label">PDCA (%)</div><input class="field-input" id="ef_PDCA" type="number" min="0" max="100" step="1" value="'+esc(Math.round(pctValue(d)))+'"></div><div class="field-group"><div class="field-label">Montant EUR</div><input class="field-input" id="ef_Montant_EUR" type="number" step="0.01" value="'+esc(d.Montant_EUR||'')+'"></div></div>'+ 
    '<div class="field-group"><label style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2)"><input type="checkbox" id="ef_Est_Projet" '+(d.Est_Projet?'checked':'')+'> Est un projet</label></div>'+ 
    '<div class="field-group"><div class="field-label">Description</div><textarea class="field-textarea" id="ef_Description" placeholder="Description de l’action…">'+esc(d.Description||'')+'</textarea></div>'+ 
    '<div class="field-group"><div class="field-label">Tags</div><input class="field-input" id="ef_Tags" value="'+esc(d.Tags||'')+'" placeholder="tag1, tag2…"></div>'
}
function openEdit(id){selectedId=id;panelMode='edit';var a=allActions.find(function(x){return x.id===id});if(!a)return;document.getElementById('panelTitle').textContent='✏️ Modifier l’action';document.getElementById('panelBtns').innerHTML='<button class="btn-save" onclick="saveEdit()">💾 Enregistrer</button><button class="btn-cancel" onclick="openView('+id+')">Annuler</button>';renderEditForm(a,id);openPanel()}
function openCreate(){selectedId=null;panelMode='create';document.querySelectorAll('.action-row').forEach(function(r){r.classList.remove('selected')});document.getElementById('panelTitle').textContent='✨ Nouvelle action';document.getElementById('panelBtns').innerHTML='<button class="btn-save" onclick="saveCreate()">✨ Créer l’action</button><button class="btn-cancel" onclick="closePanel()">Annuler</button>';renderEditForm({Libelle:'',Statut:'A faire',Niveau:'2 - Tâche',PDCA:0,Est_Projet:false});openPanel()}
function showFormError(msg){var e=document.getElementById('formError');if(e){e.textContent=msg;e.classList.add('show')}toast('⚠ '+msg)}
function collectFormData(){var data={};actionFields.forEach(function(f){var el=document.getElementById('ef_'+f);if(!el)return;if(f==='Est_Projet')data[f]=!!el.checked;else data[f]=el.value});
  data.Initiative_ID=resolveLookup(data.Initiative_ID,allProgrammes,function(p){return p.Programme||p.Programme_No||p.Nom||p.name||p.id});
  data.Pilote=resolveLookup(data.Pilote,membresRows,function(m){return m.Nom||m.name||m.Prenom||m.Prénom||m.id});
  data.Action_Parent=resolveLookup(data.Action_Parent,allActions,function(a){return a.Libelle||a.name||a.id});
  data.Tache_precedente=resolveLookup(data.Tache_precedente,allActions,function(a){return a.Libelle||a.name||a.id});
  dateFields.forEach(function(f){if(data[f]!==undefined)data[f]=toGristDate(data[f])});if(data.Montant_EUR!==undefined)data.Montant_EUR=data.Montant_EUR===''?null:(parseFloat(data.Montant_EUR)||0);if(data.PDCA!==undefined)data.PDCA=Math.min(100,Math.max(0,parseFloat(data.PDCA)||0));Object.keys(data).forEach(function(k){if(data[k]==='')data[k]=null});return data}
function validateData(data){
  if(!data.Libelle){showFormError('Le libellé est obligatoire');return false}
  if(!data.Date_Demarrage){showFormError('La date de début est obligatoire');return false}
  if(!data.Date_Fin){showFormError('La date de fin est obligatoire');return false}
  if(data.Date_Fin<data.Date_Demarrage){showFormError('La date de fin doit être après la date de début');return false}
  if(!data.Initiative_ID){showFormError('Le programme lié est obligatoire. Sélectionnez une valeur dans la recherche.');return false}
  if(!data.Pilote){showFormError('Le pilote est obligatoire. Sélectionnez une valeur dans la recherche.');return false}
  if(!data.Action_Parent){showFormError('Le projet parent est obligatoire. Sélectionnez une valeur dans la recherche.');return false}
  if(!data.Tache_precedente){showFormError('La tâche précédente est obligatoire. Sélectionnez une valeur dans la recherche.');return false}
  if(!data.Niveau){showFormError('Le niveau est obligatoire');return false}
  if(!data.Statut){showFormError('Le statut est obligatoire');return false}
  return true}
function saveEdit(){if(!selectedId)return;var data=collectFormData();if(!validateData(data))return;grist.docApi.applyUserActions([['UpdateRecord',resolvedTable,selectedId,data]]).then(function(){toast('✓ Action mise à jour');savePill();return loadAll()}).then(function(){applyFilters();openView(selectedId)}).catch(function(e){toast('⚠ Erreur : '+(e&&e.message||'?'))})}
function saveCreate(){var data=collectFormData();if(!validateData(data))return;grist.docApi.applyUserActions([['AddRecord',resolvedTable,null,data]]).then(function(){toast('✓ Action créée');savePill();return loadAll()}).then(function(){applyFilters();closePanel()}).catch(function(e){toast('⚠ Erreur : '+(e&&e.message||'?'))})}
function confirmDelete(id){var a=allActions.find(function(x){return x.id===id});if(!a)return;if(!confirm('Supprimer l’action "'+(a.Libelle||'—')+'" ?\n\nCette action est irréversible.'))return;grist.docApi.applyUserActions([['RemoveRecord',resolvedTable,id]]).then(function(){toast('🗑 Action supprimée');allActions=allActions.filter(function(x){return x.id!==id});closePanel();applyFilters()}).catch(function(e){toast('⚠ Erreur : '+(e&&e.message||'?'))})}
function openPanel(){document.getElementById('sidePanel').classList.add('open');document.getElementById('listArea').classList.add('panel-open')}function closePanel(){document.getElementById('sidePanel').classList.remove('open');document.getElementById('listArea').classList.remove('panel-open');selectedId=null;panelMode=null;document.querySelectorAll('.action-row').forEach(function(r){r.classList.remove('selected')})}
function populateFilters(){var ps=document.getElementById('filterProgramme'),pcur=ps.value;ps.innerHTML='<option value="">Tous les programmes</option>'+allProgrammes.map(function(p){return '<option value="'+p.id+'"'+(String(p.id)===pcur?' selected':'')+'>'+esc(p.Programme||p.Programme_No||p.Nom||p.name||p.id)+'</option>'}).join('');var used=new Set();allActions.forEach(function(a){var id=refId(a.Pilote);if(id)used.add(id)});membresRows.forEach(function(m){if(m.id)used.add(m.id)});var ms=document.getElementById('filterPilote'),mcur=ms.value;ms.innerHTML='<option value="">Tous les pilotes</option>'+Array.from(used).map(function(id){var m=membresRows.find(function(x){return x.id===id});var label=m?(m.Nom||m.name||m.Prenom||m.Prénom||id):id;return '<option value="'+id+'"'+(String(id)===mcur?' selected':'')+'>'+esc(label)+'</option>'}).join('')}
async function loadAll(){var results=await Promise.all([fetchT(['Actions','Actionset','ActionSet']),fetchT(['Fiches_Programmes','Fiches Programmes','FichesProgrammes']),fetchT(['Membres','Table1'])]);if(results[0].name)resolvedTable=results[0].name;allActions=results[0].rows;allProgrammes=results[1].rows;membresRows=results[2].rows;populateFilters();applyFilters()}
gristsafe=false;grist.ready({requiredAccess:'full'});grist.onRecords(function(records){if(records&&records.length&&records[0]&&('Libelle'in records[0]||'Date_Demarrage'in records[0])){allActions=records;populateFilters();applyFilters()}});setTimeout(loadAll,400);
(function(){try{var url=window.parent.location.href;var match=url.match(/\/p\/(\d+)/);if(match){document.querySelectorAll('.sps-nav-btn[data-page]').forEach(function(btn){btn.classList.toggle('sps-active',btn.getAttribute('data-page')===match[1])})}}catch(e){}})();
</script>
