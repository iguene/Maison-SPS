<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt – Actions & Programmes</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   TOKENS & RESET
══════════════════════════════════════════════ */
:root {
  --bg:        #ffffff;
  --surface:   #ffffff;
  --surface2:  #f8fafc;
  --surface3:  #eef2f7;
  --border:    #d8dee9;
  --border2:   #bcc7d6;
  --text:      #172033;
  --text2:     #475569;
  --text3:     #64748b;
  --accent:    #4f7cff;
  --accent2:   #7c4dff;
  --success:   #22c55e;
  --warning:   #f59e0b;
  --danger:    #ef4444;
  --done:      #22c55e;
  --inprog:    #4f7cff;
  --todo:      #8b92a8;
  --radius:    8px;
  --radius-sm: 5px;
  --shadow:    0 10px 30px rgba(15,23,42,.10);
  --font:      'DM Sans', sans-serif;
  --mono:      'DM Mono', monospace;

  --row-h:     42px;
  --hdr-h:     28px;
  --left-w:    280px;
  --header-h:  52px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px; }
body { background:#ffffff; display:flex; flex-direction:column; }

/* ══════════════════════════════════════════════
   TOOLBAR
══════════════════════════════════════════════ */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 40;
  flex-wrap: nowrap;
  min-height: var(--header-h);
  overflow-x: auto;        /* scroll horizontal si vraiment trop étroit */
  overflow-y: hidden;
  scrollbar-width: none;   /* masquer la scrollbar */
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar-brand {
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.toolbar-brand svg { color: var(--accent); }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink:0; }

/* NAV BUTTONS */
.nav-group { display:flex; align-items:center; gap:2px; flex-shrink:0; }
.btn-icon {
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 13px;
  transition: all .15s;
  flex-shrink: 0;
}
.btn-icon:hover { background:var(--surface3); color:var(--text); border-color:var(--border2); }

.period-label {
  font-weight: 600;
  font-size: 11px;
  min-width: 70px;
  max-width: 95px;
  text-align: center;
  color: var(--text);
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ZOOM TOGGLE */
.zoom-group { display:flex; background:var(--surface3); border-radius:var(--radius-sm); padding:2px; gap:1px; border:1px solid var(--border); flex-shrink:0; }
.zoom-btn {
  padding: 3px 7px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.zoom-btn.active { background: var(--accent); color: #fff; }
.zoom-btn:hover:not(.active) { color: var(--text); }

/* FILTERS */
.filter-group { display:flex; align-items:center; gap:4px; margin-left:auto; flex-shrink:0; }
.filter-label { font-size:10px; color:var(--text3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
.filter-select {
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  outline: none;
  transition: border-color .15s;
  max-width: 100px;
}
.filter-select:focus { border-color: var(--accent); }
.filter-select option { background: var(--surface2); }

/* ── FILTER AUTOCOMPLETE ── */
.filter-ac-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.filter-ac-input {
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  padding: 4px 20px 4px 6px;
  border-radius: var(--radius-sm);
  outline: none;
  width: 120px;
  transition: border-color .15s, width .2s;
}
.filter-ac-input:focus {
  border-color: var(--accent);
  width: 160px;
  background: white;
}
.filter-ac-input::placeholder { color: var(--text3); font-style: italic; }
.filter-ac-clear {
  position: absolute;
  right: 4px;
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  font-size: 11px;
  display: none;
  padding: 0;
  line-height: 1;
}
.filter-ac-clear.visible { display: block; }
.filter-ac-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 180px;
  max-width: 280px;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 500;
  max-height: 220px;
  overflow-y: auto;
  display: none;
}
.filter-ac-dropdown.open { display: block; }
.fac-item {
  padding: 6px 10px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text);
  border-bottom: 1px solid var(--surface3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background .1s;
}
.fac-item:last-child { border-bottom: none; }
.fac-item:hover, .fac-item.selected { background: var(--surface3); }
.fac-item mark { background: #fef9c3; border-radius: 2px; padding: 0 1px; }

/* UNDO & SAVE */
.save-area { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.btn-undo {
  padding: 5px 10px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--warning);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
  transition: all .15s;
}
.btn-undo.visible { display:flex; }
.btn-undo:hover { background:rgba(245,158,11,.08); }

.save-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  display: none;
  align-items: center;
  gap: 5px;
}
.save-pill.saving  { display:flex; background:rgba(79,124,255,.15); color:var(--accent); }
.save-pill.saved   { display:flex; background:rgba(34,197,94,.12); color:var(--success); }
.save-pill.error   { display:flex; background:rgba(239,68,68,.12); color:var(--danger); }

/* ══════════════════════════════════════════════
   GANTT LAYOUT
══════════════════════════════════════════════ */
.gantt-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
/* Header row (months + days) */
.gantt-head {
  display: flex;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  user-select: none;
}
.head-left {
  width: var(--left-w);
  min-width: var(--left-w);
  border-right: 1px solid var(--border);
  padding: 0 14px;
  display: flex;
  align-items: flex-end;
  padding-bottom: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
}
.head-right {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.month-row { display:flex; border-bottom: 1px solid var(--border); }
.month-cell {
  border-right: 1px dashed var(--border);
  padding: 3px 8px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: .5px;
  text-transform: uppercase;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.day-row { display:flex; }
.day-cell {
  flex-shrink: 0;
  height: var(--hdr-h);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  border-right: 1px solid transparent;
  position: relative;
}
.day-cell.weekend { color: #94a3b8; }
.day-cell.today-col { color: var(--accent); font-weight: 700; }
.day-cell.month-sep::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 1px;
  background: var(--border2);
}

/* ══════════════════════════════════════════════
   BODY
══════════════════════════════════════════════ */
.gantt-body { display:flex; flex:1; min-height:0; overflow:hidden; }

.gantt-left {
  width: var(--left-w);
  min-width: var(--left-w);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--surface);
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.gantt-left::-webkit-scrollbar { width:5px; }
.gantt-left::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

.gantt-scroll {
  flex: 1;
  overflow: auto;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.gantt-scroll::-webkit-scrollbar { height:5px; width:5px; }
.gantt-scroll::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

.gantt-grid { position:relative; }

/* ══════════════════════════════════════════════
   LEFT PANEL ROWS
══════════════════════════════════════════════ */
/* ── COULEURS PAR NIVEAU ── */
.prog-row {
  background: #1e3a5f !important; /* Programme = bleu foncé */
  color: white;
}
.proj-row {
  background: #dbeafe !important; /* Projet = bleu clair */
}
.task-left-row {
  background: #ffffff; /* Tâche = blanc */
}
.subtask-left-row {
  background: #f8fafc; /* Sous-tâche = gris très clair */
  padding-left: 28px !important; /* indentation */
}
.subtask-left-row .task-status-dot {
  background: #94a3b8 !important;
}
.subtask-bar {
  height: 60%;
  top: 20%;
  border-radius: 3px;
  position: absolute;
  opacity: 0.85;
}
.subtask-bar span {
  font-size: 10px;
  color: white;
  padding: 0 4px;
  white-space: nowrap;
  overflow: hidden;
}
/* Override prog-row pour que le texte soit blanc */
.prog-row .prog-name, .prog-row .prog-count { color: white; }
.prog-row .collapse-btn { color: rgba(255,255,255,0.8); }
.proj-row .prog-name { color: #1d4ed8; font-size: 12px; }
.proj-row .prog-count { color: #3b82f6; }

.prog-row {
  height: var(--row-h);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface2);
  transition: background .1s;
  position: relative;
}
.prog-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 0 2px 2px 0;
}
.prog-row:hover { background: var(--surface3); }
.prog-row.selected { background: var(--surface3); }

.collapse-btn {
  width: 18px; height: 18px;
  border-radius: 4px;
  display: flex; align-items:center; justify-content:center;
  color: var(--text3);
  font-size: 10px;
  flex-shrink: 0;
  transition: transform .2s;
}
.collapse-btn.open { transform: rotate(90deg); }

.prog-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.prog-name {
  flex: 1;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.prog-count {
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  background: var(--surface3);
  padding: 2px 6px;
  border-radius: 10px;
  flex-shrink: 0;
}

/* Task rows */
.task-left-row {
  height: var(--row-h);
  display: flex;
  align-items: center;
  padding: 0 12px 0 32px;
  gap: 7px;
  border-bottom: 1px solid rgba(148,163,184,.16);
  cursor: pointer;
  transition: background .1s;
}
.task-left-row:hover { background: rgba(79,124,255,.05); }
.task-left-row.selected { background: rgba(79,124,255,.10); }

.task-status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.task-left-name {
  flex: 1;
  font-size: 12px;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text2);
}
.task-left-dates {
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  flex-shrink: 0;
}

/* ══════════════════════════════════════════════
   GRID ROWS (RIGHT SIDE)
══════════════════════════════════════════════ */
.grid-row {
  height: var(--row-h);
  position: relative;
  border-bottom: 1px solid rgba(148,163,184,.16);
  display: flex;
}
.grid-row.prog-bg {
  background: rgba(148,163,184,.08);
  border-bottom: 1px solid var(--border);
}
.grid-col {
  flex-shrink: 0;
  height: 100%;
  border-right: 1px solid transparent;
  position: relative;
}
.grid-col.weekend { background: rgba(148,163,184,.08); }
.grid-col.today-col { background: rgba(79,124,255,.08); }
.grid-col.month-sep { border-right: 1px dashed rgba(148,163,184,.28); }

/* TODAY LINE */
.today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1.5px;
  background: var(--accent);
  z-index: 25;
  pointer-events: none;
  opacity: .55;
}
.today-line::before {
  content: '●';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: var(--accent);
}

/* ══════════════════════════════════════════════
   BARS
══════════════════════════════════════════════ */
.prog-bar {
  position: absolute;
  height: 22px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: grab;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(15,23,42,.14);
  transition: box-shadow .15s, opacity .15s;
  min-width: 20px;
  user-select: none;
}
.prog-bar:active { cursor:grabbing; box-shadow:0 6px 20px rgba(0,0,0,.5); }
.prog-bar.overdue {
  box-shadow: 0 0 0 2px var(--danger), 0 2px 8px rgba(0,0,0,.3);
  animation: pulse-warn 2s ease-in-out infinite;
}
@keyframes pulse-warn {
  0%,100% { box-shadow:0 0 0 2px rgba(239,68,68,.55), 0 2px 8px rgba(15,23,42,.14); }
  50%      { box-shadow:0 0 0 4px rgba(239,68,68,.18), 0 2px 8px rgba(15,23,42,.14); }
}
.prog-bar-label { pointer-events:none; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.prog-bar-warn { margin-left:4px; font-size:12px; flex-shrink:0; pointer-events:none; }

/* Task bar */
.task-bar {
  position: absolute;
  height: 18px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 4px;
  display: flex;
  align-items: center;
  cursor: grab;
  z-index: 12;
  min-width: 8px;
  user-select: none;
  transition: filter .1s, box-shadow .1s;
}
.task-bar:active { cursor:grabbing; }
.task-bar:hover  { filter:brightness(1.05); z-index:20; box-shadow: 0 2px 8px rgba(15,23,42,.12); }

.task-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 4px 0 0 4px;
  background: rgba(255,255,255,.28);
  pointer-events: none;
}
.task-bar-label {
  position: relative;
  z-index: 1;
  font-size: 10.5px;
  font-weight: 500;
  color: #ffffff;
  padding: 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

/* Resize handles */
.resize-handle {
  position: absolute;
  top: 0; bottom: 0;
  width: 7px;
  cursor: ew-resize;
  z-index: 15;
  border-radius: inherit;
}
.resize-handle.left  { left: 0; }
.resize-handle.right { right: 0; }
.resize-handle:hover { background: rgba(255,255,255,.15); }

/* ══════════════════════════════════════════════
   SVG ARROWS
══════════════════════════════════════════════ */
.dep-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 8;
  overflow: visible;
}

/* ══════════════════════════════════════════════
   TOOLTIP
══════════════════════════════════════════════ */
.tooltip {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 13px;
  font-size: 12px;
  box-shadow: 0 10px 30px rgba(15,23,42,.10);
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .15s, transform .15s;
  min-width: 180px;
  max-width: 260px;
}
.tooltip.show { opacity:1; transform:translateY(0); }
.tooltip-name { font-weight:700; color:var(--text); margin-bottom:7px; font-size:13px; }
.tooltip-row { display:flex; justify-content:space-between; gap:16px; margin-top:4px; }
.tooltip-key { color:var(--text3); font-size:11px; }
.tooltip-val { color:var(--text2); font-size:11px; font-family:var(--mono); }
.tooltip-status { display:inline-block; padding:2px 7px; border-radius:10px; font-size:10px; font-weight:600; margin-top:6px; }

/* ══════════════════════════════════════════════
   DRAG GHOST / SELECTION
══════════════════════════════════════════════ */
.dragging { opacity:.6; filter:brightness(1.3); cursor:grabbing !important; z-index:100 !important; }

/* ══════════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════════ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  gap: 10px;
  font-size: 13px;
}
.empty-state svg { opacity:.3; }

/* ══════════════════════════════════════════════
   LEGEND
══════════════════════════════════════════════ */
.legend {
  position: absolute;
  bottom: 10px;
  right: 14px;
  display: flex;
  gap: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 12px;
  z-index: 30;
}
.legend-item { display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text3); }
.legend-dot  { width:8px; height:8px; border-radius:50%; }
.legend-bar  { width:18px; height:5px; border-radius:2px; }


/* RIGHT PANEL + ACTION BUTTONS */
.btn-primary {
  padding: 7px 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.03); }
.btn-secondary {
  padding: 7px 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.btn-secondary:hover { background: var(--surface3); }
.gantt-main { display:flex; flex:1; min-height:0; }
.side-panel {
  width: 0;
  border-left: 1px solid transparent;
  background: var(--surface);
  overflow: hidden;
  transition: width .18s ease, border-color .18s ease;
  flex-shrink: 0;
}
.side-panel.open { width: 360px; border-color: var(--border); }
.side-panel-inner { width: 360px; height: 100%; display:flex; flex-direction:column; }
.panel-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.panel-title { font-weight:700; font-size:14px; }
.panel-close { background:none; border:none; font-size:18px; cursor:pointer; color:var(--text3); }
.panel-body { padding: 14px 16px 18px; overflow:auto; display:flex; flex-direction:column; gap:12px; }
.form-row { display:flex; flex-direction:column; gap:6px; }
.form-grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.form-label { font-size:11px; color:var(--text3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.form-input, .form-select, .form-textarea {
  width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius: var(--radius-sm); padding: 9px 10px; font: inherit; outline:none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { min-height: 90px; resize: vertical; }
.panel-meta { font-size:12px; color:var(--text3); display:flex; gap:10px; flex-wrap:wrap; }
.panel-actions { margin-top:auto; display:flex; gap:8px; padding-top:4px; }
.panel-empty { color:var(--text3); font-size:12px; line-height:1.5; }

/* ── AUTOCOMPLETE ── */
.ac-wrap { position:relative; width:100%; }
.ac-input {
  width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius:var(--radius-sm); padding:9px 30px 9px 10px;
  font:inherit; outline:none; transition:border-color .15s; cursor:text;
}
.ac-input:focus { border-color:var(--accent); }
.ac-input.has-value { border-color:var(--accent); background:#f0f5ff; font-weight:500; }
.ac-clear {
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text3); cursor:pointer;
  font-size:14px; line-height:1; padding:2px; display:none;
}
.ac-clear.visible { display:block; }
.ac-dropdown {
  position:absolute; top:calc(100% + 3px); left:0; right:0;
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--radius-sm); box-shadow:0 8px 24px rgba(15,23,42,.12);
  z-index:500; max-height:200px; overflow-y:auto; display:none;
}
.ac-dropdown.open { display:block; }
.ac-option {
  padding:8px 12px; cursor:pointer; font-size:12.5px; color:var(--text);
  border-bottom:1px solid var(--border); display:flex; align-items:center;
  gap:6px; transition:background .1s;
}
.ac-option:last-child { border-bottom:none; }
.ac-option:hover, .ac-option.focused { background:var(--surface3); }
.ac-option.selected { background:#e8f0ff; color:var(--accent); font-weight:600; }
.ac-option .ac-opt-label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-option .ac-opt-check { font-size:12px; color:var(--accent); flex-shrink:0; }
.ac-empty { padding:10px 12px; font-size:12px; color:var(--text3); font-style:italic; }
.ac-option mark { background:#fff3cd; border-radius:2px; padding:0 1px; font-weight:600; }


/* ─── BARRE NAVIGATION SPS ─── */
.sps-nav-bar {
  display: flex;
  gap: 6px;
  align-items: center;
  background: rgba(255,255,255,0.95);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  padding: 6px 14px;
  flex-shrink: 0;
  width: 100%;
  z-index: 1000;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  overflow-x: auto;       /* scroll si trop étroit */
  overflow-y: hidden;
  scrollbar-width: none;  /* scrollbar invisible */
  flex-wrap: nowrap;      /* boutons sur une seule ligne */
}
.sps-nav-bar::-webkit-scrollbar { display: none; }
.sps-nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 7px;
  border: 1.5px solid transparent;
  background: #f3f4f6;
  color: #374151;
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
  transition: all 150ms ease;
  white-space: nowrap;
  cursor: pointer;
  font-family: inherit;
}
.sps-nav-btn:hover {
  background: #e0f2f1;
  border-color: #01696f;
  color: #01696f;
}
.sps-nav-btn.sps-active {
  background: #c0392b;
  color: white;
  border-color: #c0392b;
}
/* ─────────────────────────── */
</style>

<script>
/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let allActions = [];          // raw from Grist
let programs   = [];          // Fiches Programmes
let projsByProg= {};          // progId → [projets niveau 1]
let tasksByProj= {};          // projId → [taches niveau 2]
let subsByTask = {};          // taskId → [sous-taches niveau 3]
let tasksByProg= {};          // progId → toutes les actions (compat)
let membersRows = [];         // table Membres
let programSheetRows = [];    // table Fiches Programmes
let programSheetById = {};   // id -> nom du programme
let _detectedProgramNameCol = null; // colonne detectee auto
let collapsed  = {};          // progId → bool
let filterStatus  = '';
let filterProgram = '';
let filterPilot = '';
let selectedId = null;
let panelMode = 'view';

let zoom = 'month';
let viewStart;               // Date (first day shown)
let hasAutoFittedView = false;

const LEVEL1_COLOR = '#2563eb'; // bleu
const LEVEL2_COLOR = '#16a34a'; // vert
let progColors = {};

/* ════════════════════════════════════════════
   ZOOM CONFIG
════════════════════════════════════════════ */
const ZOOM_CFG = {
  week:     { cellW: 48, days: 21,  navDays: 7  },
  month:    { cellW: 30, days: 60,  navDays: 14 },
  quarter:  { cellW: 12, days: 120, navDays: 30 },
  halfyear: { cellW: 8,  days: 183, navDays: 45 },
  year:     { cellW: 4,  days: 365, navDays: 90 },
};

function cellWidth()  { return ZOOM_CFG[zoom].cellW; }
function visibleDays(){ return ZOOM_CFG[zoom].days;  }

/* ════════════════════════════════════════════
   DATE UTILS
════════════════════════════════════════════ */
const MS_DAY = 86400000;
const fmtSh = d => d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '—';
const fmtFull = d => d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const isWE = d => { const day = d.getDay(); return day===0||day===6; };
const isToday = d => d.toDateString()===new Date().toDateString();
const daysDiff = (a,b) => Math.round((b-a)/MS_DAY);
const addDays  = (d,n) => new Date(d.getTime()+n*MS_DAY);
const startOfMonth = d => new Date(d.getFullYear(),d.getMonth(),1);
const startOfWeek  = d => { const r=new Date(d); r.setDate(r.getDate()-((r.getDay()+6)%7)); return r; };

function gristTs(ts) {
  if (ts == null || ts === '') return null;
  if (ts instanceof Date) return new Date(ts.getTime());

  if (typeof ts === 'string') {
    const raw = ts.trim();
    if (!raw) return null;
    if (!Number.isNaN(Number(raw))) {
      ts = Number(raw);
    } else {
      const parsed = new Date(raw);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }
  }

  const n = Number(ts);
  if (Number.isNaN(n)) return null;

  // Grist stocke généralement les dates en timestamp Unix (secondes).
  // On garde quand même des garde-fous pour d'autres formats éventuels.
  if (Math.abs(n) >= 1e12) return new Date(n);          // millisecondes
  if (Math.abs(n) >= 1e8)  return new Date(n * 1000);   // secondes Unix
  if (Math.abs(n) >= 1000) return new Date(n * MS_DAY); // ancien fallback en jours
  return null;
}
function toGristTs(d) {
  if (!d) return null;
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000);
}

function leftPx(date) {
  return daysDiff(viewStart, date) * cellWidth();
}
function widthPx(start, end) {
  return Math.max(daysDiff(start, end)+1, 1) * cellWidth();
}

/* ════════════════════════════════════════════
   DATA PROCESSING
════════════════════════════════════════════ */
function buildProgramStructure(rawActions) {
  programs    = [];
  projsByProg = {};
  tasksByProj = {};
  subsByTask  = {};
  tasksByProg = {};
  progColors  = {};

  // ── Séparer par Niveau ──
  const lvl1 = rawActions.filter(a => {
    const n = String(a.Niveau||'').toLowerCase();
    return n.includes('1') || n.includes('projet') || n.includes('project');
  });
  const lvl2 = rawActions.filter(a => {
    const n = String(a.Niveau||'').toLowerCase();
    return n.includes('2') || n.includes('tâche') || n.includes('tache') || n.includes('task');
  });
  const lvl3 = rawActions.filter(a => {
    const n = String(a.Niveau||'').toLowerCase();
    return n.includes('3') || n.includes('sous');
  });

  // ── Construire les programmes depuis Fiches_Programmes ──
  const usedProgIds = new Set();
  lvl1.forEach(a => {
    const id = directInitiativeIdOf(a);
    if (id) usedProgIds.add(id);
  });

  const progSource = programSheetRows.length > 0 ? programSheetRows : [];
  progSource.forEach(r => {
    if (!r.id) return;
    if (progSource.length > 5 && !usedProgIds.has(r.id)) return;
    const name = programSheetById[String(r.id)] || r.Programme || r.Nom || r.Libelle || `Programme ${r.id}`;
    const prog = {
      id: r.id, Libelle: name, Programme_Nom: name,
      Statut: r.Statut||'', PDCA: r.Avancement_Global||0,
      _isFromFiches: true,
    };
    progColors[r.id] = LEVEL1_COLOR;
    if (!collapsed.hasOwnProperty(r.id)) collapsed[r.id] = true;
    programs.push(prog);
    projsByProg[r.id] = [];
    tasksByProg[r.id] = [];
  });

  // Fallback si pas de Fiches_Programmes
  if (programs.length === 0) {
    lvl1.forEach(a => {
      const fakeId = 'prog_' + a.id;
      programs.push({ id: fakeId, Libelle: a.Libelle||`Projet ${a.id}`, Statut: a.Statut||'' });
      projsByProg[fakeId] = [a];
      tasksByProg[fakeId] = [];
      progColors[fakeId] = LEVEL1_COLOR;
      if (!collapsed.hasOwnProperty(fakeId)) collapsed[fakeId] = true;
    });
  } else {
    // Mapper les projets (lvl1) vers leur programme via Initiative_ID
    lvl1.forEach(a => {
      const progId = directInitiativeIdOf(a);
      if (progId != null && projsByProg[progId] !== undefined) {
        progColors[a.id] = '#2563eb'; // couleur projet
        if (!collapsed.hasOwnProperty(a.id)) collapsed[a.id] = true;
        projsByProg[progId].push(a);
        tasksByProg[progId].push(a);
      }
    });
  }

  // Mapper les tâches (lvl2) vers leur projet via Action_Parent
  // Si pas d'Action_Parent → rattacher directement au Programme via Initiative_ID
  const projMap = {};
  lvl1.forEach(a => { projMap[a.id] = a; });

  // Créer un "pseudo-projet" par programme pour accueillir les tâches orphelines
  const orphanProjByProg = {}; // progId → pseudo-projet

  lvl2.forEach(t => {
    const parentId = refIdOf(t.Action_Parent);
    const prevRaw  = t.Tache_precedente || t['Tache_précédente'] || null;
    t._prevId      = refIdOf(prevRaw) || null;

    if (parentId && projMap[parentId]) {
      // Cas normal : tâche rattachée à un projet
      if (!tasksByProj[parentId]) tasksByProj[parentId] = [];
      tasksByProj[parentId].push(t);
      const progId = directInitiativeIdOf(projMap[parentId]);
      if (progId && tasksByProg[progId]) tasksByProg[progId].push(t);

    } else {
      // Pas d'Action_Parent → rattacher au Programme via Initiative_ID
      const progId = directInitiativeIdOf(t);
      if (progId != null && tasksByProg[progId] !== undefined) {
        // Créer un pseudo-projet "Actions directes" si besoin
        if (!orphanProjByProg[progId]) {
          const pseudoId = 'orphan_' + progId;
          const pseudoProj = {
            id: pseudoId,
            Libelle: 'Actions directes',
            Programme_Nom: 'Actions directes',
            Statut: '',
            _isOrphan: true,
          };
          progColors[pseudoId] = '#6366f1'; // violet pour distinguer
          if (!collapsed.hasOwnProperty(pseudoId)) collapsed[pseudoId] = false; // ouvert par défaut
          projsByProg[progId].push(pseudoProj);
          tasksByProj[pseudoId] = [];
          orphanProjByProg[progId] = pseudoId;
        }
        const pseudoId = orphanProjByProg[progId];
        tasksByProj[pseudoId].push(t);
        tasksByProg[progId].push(t);
      }
    }
  });

  // Mapper les sous-tâches (lvl3) vers leur tâche parente
  // Si pas d'Action_Parent → rattacher directement au projet via Initiative_ID
  const taskMap = {};
  lvl2.forEach(t => { taskMap[t.id] = t; });

  lvl3.forEach(s => {
    const parentId = refIdOf(s.Action_Parent);
    const prevRaw  = s.Tache_precedente || s['Tache_précédente'] || null;
    s._prevId      = refIdOf(prevRaw) || null;

    if (parentId && taskMap[parentId]) {
      if (!subsByTask[parentId]) subsByTask[parentId] = [];
      subsByTask[parentId].push(s);
    } else {
      // Sous-tâche orpheline → la traiter comme une tâche niveau 2
      const progId = directInitiativeIdOf(s);
      if (progId != null && tasksByProg[progId] !== undefined) {
        if (!orphanProjByProg[progId]) {
          const pseudoId = 'orphan_' + progId;
          const pseudoProj = {
            id: pseudoId, Libelle: 'Actions directes',
            Programme_Nom: 'Actions directes', Statut: '', _isOrphan: true,
          };
          progColors[pseudoId] = '#6366f1';
          if (!collapsed.hasOwnProperty(pseudoId)) collapsed[pseudoId] = false;
          projsByProg[progId].push(pseudoProj);
          tasksByProj[pseudoId] = [];
          orphanProjByProg[progId] = pseudoId;
        }
        tasksByProj[orphanProjByProg[progId]].push(s);
        tasksByProg[progId].push(s);
      }
    }
  });

  populateProgFilter();
  populatePilotFilter();
  if (!hasAutoFittedView) initViewStart();
}

/* ══════════════════════════════════════════════
   FILTER AUTOCOMPLETE SYSTEM (FAC)
══════════════════════════════════════════════ */
const FAC_OPTIONS = { status: [], prog: [], pilot: [] };

const FAC_STATIC_STATUS = [
  { value: 'En Cours',  label: 'En Cours'  },
  { value: 'A faire',   label: 'À faire'   },
  { value: 'Terminé',   label: 'Terminé'   },
  { value: 'Planifié',  label: 'Planifié'  },
];

function populateProgFilter() {
  FAC_OPTIONS.prog = programs.map(p => ({
    value: String(p.id),
    label: p.Libelle || p.Programme_Nom || `Programme ${p.id}`
  }));
  // Ne pas réinitialiser la valeur actuelle
}

function populatePilotFilter() {
  const pilots = [...new Set(allActions.map(a => pilotNameOf(a)).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,'fr'));
  FAC_OPTIONS.pilot = pilots.map(name => ({ value: name, label: name }));
}

function facOptions(id) {
  if (id === 'status') return FAC_STATIC_STATUS;
  return FAC_OPTIONS[id] || [];
}

function facFilter(id) {
  const inp = document.getElementById(`filter${cap(id)}Input`);
  if (!inp) return;
  const q = inp.value.trim().toLowerCase();
  const opts = facOptions(id).filter(o => !q || o.label.toLowerCase().includes(q));
  facRender(id, opts, q);
  document.getElementById(`facDrop_${id}`).classList.add('open');
  // Vider la valeur filtre si le texte ne correspond plus
  const exact = facOptions(id).find(o => o.label.toLowerCase() === q);
  if (!exact) {
    if (id === 'status')  { filterStatus  = ''; }
    if (id === 'prog')    { filterProgram = ''; }
    if (id === 'pilot')   { filterPilot   = ''; }
  }
  const clr = document.getElementById(`facClear_${id}`);
  if (clr) clr.classList.toggle('visible', inp.value.length > 0);
}

function facOpen(id) {
  // Fermer les autres
  ['status','prog','pilot'].forEach(k => {
    if (k !== id) document.getElementById(`facDrop_${k}`)?.classList.remove('open');
  });
  const inp = document.getElementById(`filter${cap(id)}Input`);
  const q   = inp ? inp.value.trim().toLowerCase() : '';
  const opts = facOptions(id).filter(o => !q || o.label.toLowerCase().includes(q));
  facRender(id, opts, q);
  document.getElementById(`facDrop_${id}`).classList.add('open');
}

function facRender(id, opts, q) {
  const drop = document.getElementById(`facDrop_${id}`);
  if (!drop) return;
  const currentVal = id==='status' ? filterStatus : id==='prog' ? String(filterProgram) : filterPilot;
  let html = '<div class="fac-item" data-val="" onclick="facSelect(''+id+'','','Tous')">Tous</div>';
  html += opts.map(o => {
    const label = q
      ? o.label.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\]/g,'\$&')})`, 'gi'), '<mark>$1</mark>')
      : o.label;
    const sel = String(o.value) === String(currentVal) ? ' selected' : '';
    return `<div class="fac-item${sel}" data-val="${esc(String(o.value))}" onclick="facSelect('${id}','${esc(String(o.value))}','${esc(o.label)}')">${label}</div>`;
  }).join('');
  drop.innerHTML = html;
}

function facSelect(id, value, label) {
  if (id === 'status')  filterStatus  = value;
  if (id === 'prog')    filterProgram = value ? Number(value)||value : '';
  if (id === 'pilot')   filterPilot   = value;

  const inp = document.getElementById(`filter${cap(id)}Input`);
  if (inp) inp.value = value ? label : '';
  document.getElementById(`facDrop_${id}`)?.classList.remove('open');
  const clr = document.getElementById(`facClear_${id}`);
  if (clr) clr.classList.toggle('visible', !!value);
  render();
}

function facClear(id) {
  facSelect(id, '', '');
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// Fermer dropdowns au clic extérieur
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.filter-ac-wrap')) {
    document.querySelectorAll('.filter-ac-dropdown').forEach(d => d.classList.remove('open'));
  }
});

function getFilteredPrograms() {
  return programs.filter(p => {
    if (filterProgram && String(p.id) !== String(filterProgram)) return false;
    return true;
  });
}
function getFilteredTasks(progId) {
  const tks = tasksByProg[progId]||[];
  return tks.filter(t => {
    if (filterStatus) {
      const s = String(t.Statut||'');
      // Comparaison flexible
      if (filterStatus === 'En Cours' && !s.toLowerCase().includes('cours')) return false;
      if (filterStatus === 'A faire'  && !s.toLowerCase().includes('fair'))  return false;
      if (filterStatus === 'Terminé'  && !s.toLowerCase().includes('termin')) return false;
      if (filterStatus === 'Planifié' && !s.toLowerCase().includes('planif')) return false;
    }
    if (filterPilot && pilotNameOf(t) !== filterPilot) return false;
    return true;
  });
}

/* ════════════════════════════════════════════
   VIEW START
════════════════════════════════════════════ */
function getTimelineBounds() {
  let earliest = null;
  let latest = null;
  // Inclure toutes les actions (niveaux 2 et 3 qui ont des barres)
  allActions.forEach(a => {
    const s = gristTs(a.Date_Demarrage);
    const e = gristTs(a.Date_Fin);
    if (s && (!earliest || s < earliest)) earliest = s;
    if (e && (!latest || e > latest)) latest = e;
  });
  if (!earliest && !latest) {
    const today = new Date();
    return { earliest: today, latest: addDays(today, 30) };
  }
  if (!earliest) earliest = latest;
  if (!latest) latest = earliest;
  return { earliest, latest };
}

function fitTimelineToAll() {
  const { earliest, latest } = getTimelineBounds();
  const totalDays = Math.max(daysDiff(earliest, latest) + 1, 1);
  const withMargin = totalDays + 14;

  if (withMargin <= ZOOM_CFG.week.days)     zoom = 'week';
  else if (withMargin <= ZOOM_CFG.month.days)    zoom = 'month';
  else if (withMargin <= ZOOM_CFG.quarter.days)  zoom = 'quarter';
  else if (withMargin <= ZOOM_CFG.halfyear.days) zoom = 'halfyear';
  else if (withMargin <= ZOOM_CFG.year.days)     zoom = 'year';
  else {
    // Planning > 1 an : zoom dynamique pour tout faire tenir
    zoom = 'year';
    // Calculer le cellW nécessaire pour que tout tienne dans la zone visible
    const scrollEl = document.getElementById('ganttScroll');
    const availWidth = scrollEl ? scrollEl.clientWidth : 800;
    const neededCellW = Math.max(2, Math.floor(availWidth / withMargin));
    // Mettre à jour ZOOM_CFG.year dynamiquement
    ZOOM_CFG.year = { cellW: neededCellW, days: withMargin, navDays: Math.round(withMargin / 4) };
  }

  document.querySelectorAll('.zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom===zoom));
  viewStart = startOfMonth(addDays(earliest, -7));
  updatePeriodLabel();
}

function initViewStart() {
  fitTimelineToAll();
}

function navigate(dir) {
  const navDays = ZOOM_CFG[zoom].navDays;
  viewStart = addDays(viewStart, dir * navDays);
  updatePeriodLabel();
  render();
}
function goToday() {
  viewStart = startOfMonth(addDays(new Date(), -14));
  updatePeriodLabel();
  render();
}
function setZoom(z) {
  zoom = z;
  document.querySelectorAll('.zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom===z));
  updatePeriodLabel();
  render();
}
function updatePeriodLabel() {
  const end = addDays(viewStart, visibleDays());
  const fmt = d => d.toLocaleDateString('fr-FR',{month:'short',year:'numeric'});
  document.getElementById('periodLabel').textContent = fmt(viewStart)+' – '+fmt(end);
}

/* ════════════════════════════════════════════
   PROG BAR METRICS
════════════════════════════════════════════ */
function computeProgDates(progId) {
  const p = programs.find(x=>x.id===progId);
  if (!p) return null;
  const tks = tasksByProg[progId]||[];
  let minS = gristTs(p.Date_Demarrage);
  let maxE = gristTs(p.Date_Fin);
  tks.forEach(t => {
    const s = gristTs(t.Date_Demarrage);
    const e = gristTs(t.Date_Fin);
    if (s && (!minS||s<minS)) minS=s;
    if (e && (!maxE||e>maxE)) maxE=e;
  });
  const progEnd = gristTs(p.Date_Fin);
  const overdue = progEnd && maxE && maxE > progEnd;
  return { start:minS, end:maxE, overdue };
}

function taskDurationDays(task) {
  const s = gristTs(task?.Date_Demarrage);
  const e = gristTs(task?.Date_Fin);
  if (!s || !e) return 1;
  return Math.max(daysDiff(s, e) + 1, 1);
}

function setTaskDateRange(task, startDate, endDate) {
  if (!task || !startDate || !endDate) return;
  task.Date_Demarrage = toGristTs(startDate);
  task.Date_Fin = toGristTs(endDate);
}

function shiftTaskToStart(task, newStart) {
  if (!task || !newStart) return;
  const duration = taskDurationDays(task);
  const newEnd = addDays(newStart, duration - 1);
  setTaskDateRange(task, newStart, newEnd);
}

function shiftTaskToEnd(task, newEnd) {
  if (!task || !newEnd) return;
  const duration = taskDurationDays(task);
  const newStart = addDays(newEnd, -(duration - 1));
  setTaskDateRange(task, newStart, newEnd);
}

function syncProgramDatesFromTasks(progId) {
  const prog = programs.find(p => String(p.id) === String(progId));
  const tks = (tasksByProg[progId] || []).filter(t => gristTs(t.Date_Demarrage) && gristTs(t.Date_Fin));
  if (!prog || !tks.length) return;

  let minTask = tks[0];
  let maxTask = tks[0];
  tks.forEach(t => {
    if (gristTs(t.Date_Demarrage) < gristTs(minTask.Date_Demarrage)) minTask = t;
    if (gristTs(t.Date_Fin) > gristTs(maxTask.Date_Fin)) maxTask = t;
  });

  prog.Date_Demarrage = toGristTs(gristTs(minTask.Date_Demarrage));
  prog.Date_Fin = toGristTs(gristTs(maxTask.Date_Fin));
}

function alignBoundaryTasksToProgram(progId) {
  const prog = programs.find(p => String(p.id) === String(progId));
  const tks = (tasksByProg[progId] || []).filter(t => gristTs(t.Date_Demarrage) && gristTs(t.Date_Fin));
  if (!prog || !tks.length) return;

  const progStart = gristTs(prog.Date_Demarrage);
  const progEnd = gristTs(prog.Date_Fin);
  if (!progStart && !progEnd) return;

  let firstTask = tks[0];
  let lastTask = tks[0];
  tks.forEach(t => {
    if (gristTs(t.Date_Demarrage) < gristTs(firstTask.Date_Demarrage)) firstTask = t;
    if (gristTs(t.Date_Fin) > gristTs(lastTask.Date_Fin)) lastTask = t;
  });

  if (progStart && progEnd && String(firstTask.id) === String(lastTask.id)) {
    setTaskDateRange(firstTask, progStart, progEnd);
    return;
  }
  if (progStart) shiftTaskToStart(firstTask, progStart);
  if (progEnd) shiftTaskToEnd(lastTask, progEnd);
}

function enforceDependenciesInProgram(progId) {
  const tks = tasksByProg[progId] || [];
  if (!tks.length) return;

  let changed = true;
  let safety = 0;
  while (changed && safety++ < 50) {
    changed = false;
    tks.forEach(task => {
      if (!task._prevId) return;
      const prev = tks.find(t => String(t.id) === String(task._prevId));
      if (!prev) return;

      const prevEnd = gristTs(prev.Date_Fin);
      const taskStart = gristTs(task.Date_Demarrage);
      if (!prevEnd || !taskStart) return;

      const minStart = addDays(prevEnd, 1);
      if (taskStart < minStart) {
        shiftTaskToStart(task, minStart);
        changed = true;
      }
    });
  }
}

/* ════════════════════════════════════════════
   RENDER HEADER
════════════════════════════════════════════ */
function renderHeader() {
  const days = visibleDays();
  const cw   = cellWidth();
  const totalW = days * cw;

  // Month row
  const monthRow = document.getElementById('monthRow');
  const dayRow   = document.getElementById('dayRow');
  monthRow.innerHTML = '';
  dayRow.innerHTML   = '';

  // Build month spans
  const months = {};
  for (let i=0; i<days; i++) {
    const d = addDays(viewStart, i);
    const key = d.getFullYear()*100+d.getMonth();
    if (!months[key]) months[key]={label:d.toLocaleDateString('fr-FR',{month:'short',year:'numeric'}), count:0};
    months[key].count++;
  }
  Object.values(months).forEach(m => {
    const el = document.createElement('div');
    el.className = 'month-cell';
    el.style.width = (m.count*cw)+'px';
    el.textContent = m.label.toUpperCase();
    monthRow.appendChild(el);
  });

  // Day row
  for (let i=0; i<days; i++) {
    const d = addDays(viewStart, i);
    const el = document.createElement('div');
    el.className = 'day-cell';
    el.style.width = cw+'px';
    if (isWE(d)) el.classList.add('weekend');
    if (isToday(d)) el.classList.add('today-col');
    if (d.getDate()===1) el.classList.add('month-sep');

    if (zoom==='week') el.textContent = d.getDate();
    else if (zoom==='month') el.textContent = d.getDate()%2===1 ? d.getDate() : '';
    else el.textContent = d.getDate()===1 ? d.getDate() : '';
    dayRow.appendChild(el);
  }
}

/* ════════════════════════════════════════════
   RENDER ROWS (LEFT + GRID)
════════════════════════════════════════════ */
function toggleCollapse(id, e) {
  if (e) e.stopPropagation();
  const key = String(id);
  collapsed[key] = !collapsed[key];
  // Aussi gérer les ids numériques
  if (!isNaN(id)) collapsed[Number(id)] = collapsed[key];
  render();
}

function render() {
  renderHeader();
  const leftEl  = document.getElementById('ganttLeft');
  const gridEl  = document.getElementById('ganttGrid');
  leftEl.innerHTML  = '';
  gridEl.innerHTML  = '';

  const days  = visibleDays();
  const cw    = cellWidth();
  const totalW = days * cw;
  gridEl.style.width  = totalW+'px';
  const rowH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h'))||42;

  // Today line
  const todayOff = daysDiff(viewStart, new Date());
  if (todayOff>=0 && todayOff<days) {
    const tl = document.createElement('div');
    tl.className = 'today-line';
    tl.style.left = (todayOff*cw + cw/2)+'px';
    tl.style.height = '100%';
    gridEl.appendChild(tl);
  }

  const progs = getFilteredPrograms();
  if (!progs.length) {
    leftEl.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h18M3 12h18M3 17h18"/></svg><div>Aucun programme trouvé</div></div>';
    return;
  }

  const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.classList.add('dep-svg');
  svgEl.style.width = totalW+'px';
  svgEl.setAttribute('height','10');
  gridEl.appendChild(svgEl);

  let rowIndex = 0;
  let rowPositions = {};

  // ── Couleur selon niveau ──
  const COLOR_PROG = '#1e3a5f';
  const COLOR_PROJ = '#2563eb';
  const COLOR_TASK = '#4f7cff';
  const COLOR_SUB  = '#94a3b8';

  // ────────────────────────────────────────────
  // Niveau 1 : PROGRAMMES
  // ────────────────────────────────────────────
  progs.forEach(prog => {
    const isProgOpen = !(collapsed[prog.id] ?? collapsed[String(prog.id)] ?? true);
    const projets    = (projsByProg[prog.id]||[]);
    const pName      = prog.Libelle || prog.Programme_Nom || 'Programme '+prog.id;

    // Calculer l'étendue temporelle du programme
    let minS = null, maxE = null;
    projets.forEach(pr => {
      (tasksByProj[pr.id]||[]).forEach(t => {
        const s = gristTs(t.Date_Demarrage), e = gristTs(t.Date_Fin);
        if (s && (!minS||s<minS)) minS=s;
        if (e && (!maxE||e>maxE)) maxE=e;
        // Sous-tâches
        (subsByTask[t.id]||[]).forEach(st => {
          const ss = gristTs(st.Date_Demarrage), se = gristTs(st.Date_Fin);
          if (ss && (!minS||ss<minS)) minS=ss;
          if (se && (!maxE||se>maxE)) maxE=se;
        });
      });
    });

    // ── Ligne Programme (gauche) ──
    const pLeft = document.createElement('div');
    pLeft.className = 'prog-row'+(selectedId===prog.id?' selected':'');
    pLeft.style.borderLeft = '4px solid '+COLOR_PROG;
    const nbProj = projets.length;
    pLeft.innerHTML = `
      <span class="collapse-btn ${isProgOpen?'open':''}" onclick="toggleCollapse(${JSON.stringify(prog.id)},event)">▶</span>
      <span class="prog-dot" style="background:${COLOR_PROG}"></span>
      <span class="prog-name">${esc(pName)}</span>
      <span class="prog-count">${nbProj} projet${nbProj!==1?'s':''}</span>
    `;
    pLeft.onclick = () => { panelMode='view'; selectedId=prog.id; renderSidePanel(); render(); };
    leftEl.appendChild(pLeft);

    // ── Ligne Programme (grille) ──
    const pGrid = buildGridRow(days, cw, true);
    gridEl.appendChild(pGrid);
    if (minS && maxE) {
      const bar = document.createElement('div');
      bar.className = 'prog-bar';
      bar.style.cssText = `left:${leftPx(minS)}px;width:${widthPx(minS,maxE)}px;background:${COLOR_PROG};opacity:0.7;`;
      bar.innerHTML = `<span class="prog-bar-label">${esc(pName)}</span>`;
      pGrid.appendChild(bar);
    }
    rowIndex++;

    if (!isProgOpen) return;

    // ────────────────────────────────────────────
    // Niveau 2 : PROJETS
    // ────────────────────────────────────────────
    projets.forEach(proj => {
      const isProjOpen = !(collapsed[proj.id] ?? collapsed[String(proj.id)] ?? true);
      const taches     = getFilteredTasks_proj(proj.id);
      const projName   = proj.Libelle || 'Projet '+proj.id;

      // Étendue temporelle du projet
      let pminS = null, pmaxE = null;
      taches.forEach(t => {
        const s = gristTs(t.Date_Demarrage), e = gristTs(t.Date_Fin);
        if (s && (!pminS||s<pminS)) pminS=s;
        if (e && (!pmaxE||e>pmaxE)) pmaxE=e;
        (subsByTask[t.id]||[]).forEach(st => {
          const ss=gristTs(st.Date_Demarrage), se=gristTs(st.Date_Fin);
          if (ss && (!pminS||ss<pminS)) pminS=ss;
          if (se && (!pmaxE||se>pmaxE)) pmaxE=se;
        });
      });

      // ── Ligne Projet (gauche) ──
      const prLeft = document.createElement('div');
      prLeft.className = 'proj-row prog-row'+(selectedId===proj.id?' selected':'');
      prLeft.style.borderLeft = '3px solid '+COLOR_PROJ;
      prLeft.style.paddingLeft = '14px';
      prLeft.innerHTML = `
        <span class="collapse-btn ${isProjOpen?'open':''}" onclick="toggleCollapse(${proj.id},event)">▶</span>
        <span class="prog-dot" style="background:${COLOR_PROJ}"></span>
        <span class="prog-name" style="color:#1d4ed8">${esc(projName)}</span>
        <span class="prog-count" style="color:#3b82f6">${taches.length}</span>
      `;
      prLeft.onclick = () => { panelMode='view'; selectedId=proj.id; renderSidePanel(); render(); };
      leftEl.appendChild(prLeft);

      // ── Ligne Projet (grille) ──
      const prGrid = buildGridRow(days, cw, true);
      gridEl.appendChild(prGrid);
      if (pminS && pmaxE) {
        const bar = document.createElement('div');
        bar.className = 'prog-bar';
        bar.style.cssText = `left:${leftPx(pminS)}px;width:${widthPx(pminS,pmaxE)}px;background:${COLOR_PROJ};opacity:0.5;`;
        bar.innerHTML = `<span class="prog-bar-label" style="color:white">${esc(projName)}</span>`;
        prGrid.appendChild(bar);
      }
      rowIndex++;

      if (!isProjOpen) return;

      // ────────────────────────────────────────────
      // Niveau 3 : TÂCHES + SOUS-TÂCHES
      // ────────────────────────────────────────────
      taches.forEach(task => {
        const rowTop = rowIndex * rowH;
        const tStart = gristTs(task.Date_Demarrage);
        const tEnd   = gristTs(task.Date_Fin);

        // ── Ligne Tâche (gauche) ──
        const tLeft = document.createElement('div');
        tLeft.className = 'task-left-row'+(selectedId===task.id?' selected':'');
        const tName = task.Libelle||'Tâche '+task.id;
        tLeft.style.paddingLeft = '28px';
        tLeft.innerHTML = `
          <span class="task-status-dot" style="background:${COLOR_TASK}"></span>
          <span class="task-left-name">${esc(tName)}</span>
          <span class="task-left-dates">${tStart?fmtSh(tStart):''}</span>
        `;
        tLeft.onclick = () => { panelMode='view'; selectedId=task.id; renderSidePanel(); render(); };
        leftEl.appendChild(tLeft);

        // ── Ligne Tâche (grille) ──
        const tGrid = buildGridRow(days, cw, false);
        gridEl.appendChild(tGrid);
        if (tStart && tEnd) {
          const bar = document.createElement('div');
          bar.className = 'task-bar';
          const st = task.Statut||'';
          const barColor = st.toLowerCase().includes('termin') ? 'var(--done)'
            : st.toLowerCase().includes('cours') ? 'var(--inprog)' : 'var(--todo)';
          const pct = Math.min(100,Math.max(0,task.PDCA||0));
          bar.style.cssText = `left:${leftPx(tStart)}px;width:${widthPx(tStart,tEnd)}px;background:${barColor};`;
          bar.innerHTML = `<div class="task-bar-progress" style="width:${pct}%"></div><span class="task-bar-label">${esc(tName)}</span>`;
          bar.setAttribute('data-type','task');
          bar.setAttribute('data-id',task.id);
          bar.onclick = (e) => { e.stopPropagation(); panelMode='view'; selectedId=task.id; renderSidePanel(); render(); };
          setupTooltip(bar, {
            name: tName,
            rows: [
              ['Début', fmtFull(tStart)],
              ['Fin',   fmtFull(tEnd)],
              ['Pilote', pilotNameOf(task)||'—'],
              ['Avancement', (task.PDCA||0)+'%'],
            ],
            status: task.Statut,
            color: barColor,
          });
          setupTaskDrag(bar, task.id);
          tGrid.appendChild(bar);
          rowPositions[task.id] = { y: rowTop+rowH/2, barLeft: leftPx(tStart), barRight: leftPx(tStart)+widthPx(tStart,tEnd), rowTop };
        }
        rowIndex++;

        // ── Sous-tâches ──
        const subs = (subsByTask[task.id]||[]).filter(s => {
          if (filterStatus) {
            const st = String(s.Statut||'');
            if (filterStatus==='En Cours' && !st.toLowerCase().includes('cours')) return false;
            if (filterStatus==='A faire'  && !st.toLowerCase().includes('fair')) return false;
            if (filterStatus==='Terminé'  && !st.toLowerCase().includes('termin')) return false;
          }
          if (filterPilot && pilotNameOf(s)!==filterPilot) return false;
          return true;
        });

        subs.forEach(sub => {
          const sStart = gristTs(sub.Date_Demarrage);
          const sEnd   = gristTs(sub.Date_Fin);
          const sName  = sub.Libelle||'Sous-tâche '+sub.id;

          // Ligne sous-tâche gauche
          const sLeft = document.createElement('div');
          sLeft.className = 'task-left-row subtask-left-row'+(selectedId===sub.id?' selected':'');
          sLeft.style.paddingLeft = '42px';
          sLeft.innerHTML = `
            <span class="task-status-dot" style="background:${COLOR_SUB}"></span>
            <span class="task-left-name" style="font-size:11px;color:var(--text3)">${esc(sName)}</span>
            <span class="task-left-dates">${sStart?fmtSh(sStart):''}</span>
          `;
          sLeft.onclick = () => { panelMode='view'; selectedId=sub.id; renderSidePanel(); render(); };
          leftEl.appendChild(sLeft);

          // Grille sous-tâche
          const sGrid = buildGridRow(days, cw, false);
          sGrid.style.background = '#f8fafc';
          gridEl.appendChild(sGrid);
          if (sStart && sEnd) {
            const bar = document.createElement('div');
            bar.className = 'subtask-bar';
            const pct = Math.min(100,Math.max(0,sub.PDCA||0));
            bar.style.cssText = `left:${leftPx(sStart)}px;width:${widthPx(sStart,sEnd)}px;background:${COLOR_SUB};top:20%;height:60%;border-radius:3px;position:absolute;`;
            bar.innerHTML = `<span style="font-size:10px;color:white;padding:0 4px;white-space:nowrap;overflow:hidden">${esc(sName)}</span>`;
            bar.onclick = (e) => { e.stopPropagation(); panelMode='view'; selectedId=sub.id; renderSidePanel(); render(); };
            sGrid.appendChild(bar);
          }
          rowIndex++;
        });
      }); // fin taches
    }); // fin projets
  }); // fin progs

  // Dépendances (flèches)
  try { renderDependencyArrows(svgEl, rowPositions, days, cw, rowH); } catch(e){}
  svgEl.setAttribute('height', rowIndex * rowH + 'px');
}

function getFilteredTasks_proj(projId) {
  const tks = tasksByProj[projId]||[];
  return tks.filter(t => {
    if (filterStatus) {
      const s = String(t.Statut||'');
      if (filterStatus==='En Cours' && !s.toLowerCase().includes('cours')) return false;
      if (filterStatus==='A faire'  && !s.toLowerCase().includes('fair')) return false;
      if (filterStatus==='Terminé'  && !s.toLowerCase().includes('termin')) return false;
      if (filterStatus==='Planifié' && !s.toLowerCase().includes('planif')) return false;
    }
    if (filterPilot && pilotNameOf(t)!==filterPilot) return false;
    return true;
  });
}

function setupTooltip(el, data) {
  el.addEventListener('mouseenter', e => showTooltip(e, data));
  el.addEventListener('mousemove',  e => moveTooltip(e));
  el.addEventListener('mouseleave', hideTooltip);
}
function showTooltip(e, data) {
  const tt = document.getElementById('tooltip');
  document.getElementById('ttName').textContent = data.name;
  const rowsEl = document.getElementById('ttRows');
  rowsEl.innerHTML = data.rows.map(r=>`
    <div class="tooltip-row">
      <span class="tooltip-key">${r[0]}</span>
      <span class="tooltip-val">${r[1]}</span>
    </div>`).join('');
  if (data.status) {
    rowsEl.innerHTML += `<span class="tooltip-status" style="background:${hexToRgba(data.color||'#4f7cff',.15)};color:${data.color||'#4f7cff'}">${data.status}</span>`;
  }
  tt.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  const x = e.clientX+14, y = e.clientY+14;
  tt.style.left = Math.min(x, window.innerWidth-280)+'px';
  tt.style.top  = Math.min(y, window.innerHeight-200)+'px';
}
function hideTooltip() {

}

/* ════════════════════════════════════════════
   DRAG & DROP – TASK BAR
════════════════════════════════════════════ */
let dragCtx = null;
let undoSnapshot = null;
let saveTimer = null;

function setupTaskDrag(bar, taskId, progId) {
  bar.addEventListener('mousedown', e => {
    if (e.button!==0) return;
    if (e.target.classList.contains('resize-handle')) return;
    e.preventDefault();
    const task = findTask(taskId);
    if (!task) return;
    startDrag(e, { type:'task', taskId, progId, bar,
      origStart: gristTs(task.Date_Demarrage),
      origEnd:   gristTs(task.Date_Fin),
    });
  });
  // Resize handles
  bar.querySelectorAll('.resize-handle').forEach(h => {
    h.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const task = findTask(taskId);
      if (!task) return;
      startDrag(e, { type:'resize', side:h.dataset.side, taskId, progId, bar,
        origStart: gristTs(task.Date_Demarrage),
        origEnd:   gristTs(task.Date_Fin),
      });
    });
  });
}

function setupProgDrag(bar, progId) {
  bar.addEventListener('mousedown', e => {
    if (e.button!==0) return;
    e.preventDefault();
    const prog = programs.find(p=>p.id===progId);
    if (!prog) return;
    const tks = tasksByProg[progId]||[];
    startDrag(e, { type:'prog', progId, bar,
      origProgStart: gristTs(prog.Date_Demarrage),
      origProgEnd:   gristTs(prog.Date_Fin),
      taskSnapshots: tks.map(t=>({ id:t.id, start:gristTs(t.Date_Demarrage), end:gristTs(t.Date_Fin) })),
    });
  });
}

function startDrag(e, ctx) {
  hideTooltip();
  if (!undoSnapshot) takeSnapshot();
  ctx.startX = e.clientX;
  ctx.cw     = cellWidth();
  ctx.bar.classList.add('dragging');
  dragCtx = ctx;
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragEnd);
}

function onDragMove(e) {
  if (!dragCtx) return;
  const dx    = e.clientX - dragCtx.startX;
  const days  = Math.round(dx / dragCtx.cw);
  const bar   = dragCtx.bar;

  if (dragCtx.type === 'task') {
    const ns = addDays(dragCtx.origStart, days);
    const ne = addDays(dragCtx.origEnd,   days);
    bar.style.left  = leftPx(ns)+'px';
    bar.style.width = widthPx(ns,ne)+'px';
    bar.setAttribute('data-start',ns.getTime());
    bar.setAttribute('data-end',ne.getTime());

  } else if (dragCtx.type === 'resize') {
    let ns = dragCtx.origStart, ne = dragCtx.origEnd;
    if (dragCtx.side==='right')  ne = addDays(dragCtx.origEnd,   days);
    else                          ns = addDays(dragCtx.origStart, days);
    if (daysDiff(ns,ne)<0) return;
    bar.style.left  = leftPx(ns)+'px';
    bar.style.width = widthPx(ns,ne)+'px';
    bar.setAttribute('data-start',ns.getTime());
    bar.setAttribute('data-end',ne.getTime());

  } else if (dragCtx.type === 'prog') {
    // Move entire program + all tasks
    const progBar = bar;
    const ns = addDays(dragCtx.origProgStart, days);
    const ne = addDays(dragCtx.origProgEnd,   days);
    progBar.style.left  = leftPx(ns)+'px';
    // Also move task bars live
    dragCtx.taskSnapshots.forEach(snap => {
      const tBar = document.querySelector(`.task-bar[data-id="${snap.id}"]`);
      if (!tBar) return;
      const ts = addDays(snap.start, days);
      const te = addDays(snap.end,   days);
      tBar.style.left  = leftPx(ts)+'px';
      tBar.setAttribute('data-start',ts.getTime());
      tBar.setAttribute('data-end',te.getTime());
    });
  }
}

function onDragEnd(e) {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup',   onDragEnd);
  if (!dragCtx) return;
  const dx   = e.clientX - dragCtx.startX;
  const days = Math.round(dx / dragCtx.cw);
  dragCtx.bar.classList.remove('dragging');

  if (days===0) { dragCtx=null; return; }

  if (dragCtx.type==='task' || dragCtx.type==='resize') {
    const task = findTask(dragCtx.taskId);
    if (task) {
      let ns = dragCtx.origStart, ne = dragCtx.origEnd;
      if (dragCtx.type==='task') {
        ns = addDays(ns, days); ne = addDays(ne, days);
      } else {
        if (dragCtx.side==='right') ne = addDays(ne, days);
        else ns = addDays(ns, days);
      }
      if (daysDiff(ns,ne)<0) { dragCtx=null; render(); return; }
      task.Date_Demarrage = toGristTs(ns);
      task.Date_Fin       = toGristTs(ne);
      // Cascade: push successor tasks that now overlap
      cascadeTasksAfter(task, dragCtx.progId);
      scheduleSave(task.id, 'task');
    }
  } else if (dragCtx.type==='prog') {
    const prog = programs.find(p=>p.id===dragCtx.progId);
    if (prog) {
      prog.Date_Demarrage = toGristTs(addDays(dragCtx.origProgStart, days));
      prog.Date_Fin       = toGristTs(addDays(dragCtx.origProgEnd,   days));
      dragCtx.taskSnapshots.forEach(snap => {
        const t = findTask(snap.id);
        if (t) {
          t.Date_Demarrage = toGristTs(addDays(snap.start, days));
          t.Date_Fin       = toGristTs(addDays(snap.end,   days));
        }
      });
      alignBoundaryTasksToProgram(prog.id);
      enforceDependenciesInProgram(prog.id);
      syncProgramDatesFromTasks(prog.id);
      scheduleSave(prog.id, 'prog');
    }
  }

  dragCtx = null;
  render();
  showUndoBtn();
}

/* ════════════════════════════════════════════
   CASCADE (push successor tasks)
════════════════════════════════════════════ */
function cascadeTasksAfter(movedTask, progId) {
  const tks = tasksByProg[progId]||[];
  // Build successor map: who has movedTask as _prevId?
  let changed = [movedTask];
  let safety  = 0;
  while (changed.length && safety++<20) {
    const next = [];
    changed.forEach(t => {
      const successors = tks.filter(s => s._prevId === t.id);
      successors.forEach(s => {
        const tEnd = gristTs(t.Date_Fin);
        const sStart = gristTs(s.Date_Demarrage);
        const sEnd   = gristTs(s.Date_Fin);
        if (!tEnd||!sStart) return;
        if (sStart <= tEnd) {
          const gap = daysDiff(sStart, tEnd)+1;
          const newS = addDays(sStart, gap);
          const newE = addDays(sEnd,   gap);
          s.Date_Demarrage = toGristTs(newS);
          s.Date_Fin       = toGristTs(newE);
          next.push(s);
        }
      });
    });
    changed = next;
  }
  syncProgramDatesFromTasks(progId);
}

/* ════════════════════════════════════════════
   UNDO
════════════════════════════════════════════ */
function takeSnapshot() {
  undoSnapshot = {
    actions: JSON.parse(JSON.stringify(allActions)),
    programs: JSON.parse(JSON.stringify(programs)),
    tasksByProg: JSON.parse(JSON.stringify(tasksByProg)),
  };
}

function undoChanges() {
  if (!undoSnapshot) return;
  clearTimeout(saveTimer);
  allActions  = undoSnapshot.actions;
  programs    = undoSnapshot.programs;
  tasksByProg = undoSnapshot.tasksByProg;
  // Restore _prevId
  programs.forEach(p=>{
    (tasksByProg[p.id]||[]).forEach(t=>{
      const prevRaw = t.Tache_precedente||t['Tache_précédente']||null;
      t._prevId = Array.isArray(prevRaw)?prevRaw[1]:(prevRaw||null);
    });
  });
  undoSnapshot = null;
  setSavePill('');
  hideUndoBtn();
  render();
}

function showUndoBtn() { document.getElementById('undoBtn').classList.add('visible'); }
function hideUndoBtn() { document.getElementById('undoBtn').classList.remove('visible'); }

/* ════════════════════════════════════════════
   SAVE (debounced, 800ms)
════════════════════════════════════════════ */
function scheduleSave(id, type) {
  clearTimeout(saveTimer);
  setSavePill('saving');
  saveTimer = setTimeout(()=>doSave(id,type), 800);
}

async function doSave(id, type) {
  if (!gristReady) { setSavePill('saved'); undoSnapshot=null; hideUndoBtn(); return; }
  setSavePill('saving');
  try {
    suppressNextRecordRefresh = true;
    if (type==='task') {
      // Collect all modified tasks in the cascade
      const allTasks = Object.values(tasksByProg).flat();
      const actions_grist = allTasks.map(t=>([
        'UpdateRecord','Actions',t.id,{
          Date_Demarrage: t.Date_Demarrage,
          Date_Fin: t.Date_Fin,
        }
      ]));
      const prog_actions = programs.map(p=>([
        'UpdateRecord','Actions',p.id,{
          Date_Demarrage: p.Date_Demarrage,
          Date_Fin: p.Date_Fin,
        }
      ]));
      await grist.docApi.applyUserActions([...actions_grist, ...prog_actions]);
    } else {
      // prog move: update prog + tasks
      const prog = programs.find(p=>p.id===id);
      const tks  = tasksByProg[id]||[];
      const acts = [
        ['UpdateRecord','Actions',prog.id,{Date_Demarrage:prog.Date_Demarrage, Date_Fin:prog.Date_Fin}],
        ...tks.map(t=>(['UpdateRecord','Actions',t.id,{Date_Demarrage:t.Date_Demarrage, Date_Fin:t.Date_Fin}]))
      ];
      await grist.docApi.applyUserActions(acts);
    }
    await refreshFromGrist();
    setSavePill('saved');
    undoSnapshot = null;
    hideUndoBtn();
    setTimeout(()=>setSavePill(''),2500);
  } catch(err) {
    console.error('Save error', err);
    setSavePill('error', err && err.message ? err.message : 'Erreur de sauvegarde');
  }
}

function setSavePill(state, message='') {
  const pill = document.getElementById('savePill');
  pill.className = 'save-pill';
  pill.title = message || '';
  if (state==='saving') { pill.classList.add('saving'); pill.innerHTML='<span>↺</span> Sauvegarde…'; }
  else if (state==='saved')  { pill.classList.add('saved');  pill.innerHTML='<span>✓</span> Sauvegardé'; }
  else if (state==='error')  { pill.classList.add('error');  pill.innerHTML=`<span>!</span> ${esc(message || 'Erreur')}`; }
}

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
function findTask(id) {
  for (const arr of Object.values(tasksByProg)) {
    const t = arr.find(x=>x.id===id);
    if (t) return t;
  }
  return null;
}


/* ═══════════════════════════════════════════════════════
   AUTOCOMPLETE ENGINE
═══════════════════════════════════════════════════════ */
const AC_CONFIGS = {};  // id → { options:[{value,label}], currentValue, onSelect }

function acInit(id, options, currentValue, onSelect) {
  // options = [{value, label}]
  AC_CONFIGS[id] = { options, currentValue: currentValue ?? '', onSelect };
  const inp  = document.getElementById('panelInitiative_text'.replace('initiative', id === 'initiative' ? 'initiative' : id));
  const inpId = `panel${id.charAt(0).toUpperCase()+id.slice(1)}_text`;
  const hidId = `panel${id.charAt(0).toUpperCase()+id.slice(1)}`;
  const inp2  = document.getElementById(inpId);
  const hid   = document.getElementById(hidId);
  if (!inp2 || !hid) return;

  // Set current value display
  const cur = options.find(o => String(o.value) === String(currentValue));
  inp2.value = cur ? cur.label : (currentValue ? String(currentValue) : '');
  inp2.classList.toggle('has-value', !!cur);
  hid.value  = cur ? cur.value : (currentValue || '');
  const clr  = document.getElementById(`acClear_${id}`);
  if (clr) clr.classList.toggle('visible', !!cur || !!currentValue);
}

// Map id → field name for input/hidden IDs
function acIds(id) {
  const cap = id.charAt(0).toUpperCase() + id.slice(1);
  return {
    inp:  document.getElementById(`panel${cap}_text`),
    hid:  document.getElementById(`panel${cap}`),
    drop: document.getElementById(`acDrop_${id}`),
    clr:  document.getElementById(`acClear_${id}`),
  };
}

function acFilter(id) {
  const cfg = AC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop} = acIds(id);
  if (!inp || !drop) return;
  const q = inp.value.trim().toLowerCase();
  const filtered = q
    ? cfg.options.filter(o => o.label.toLowerCase().includes(q))
    : cfg.options;
  acRenderDropdown(id, filtered, q, String(hid ? hid.value : ''));
  drop.classList.add('open');
  // Clear hidden if text doesn't match any option exactly
  if (hid) {
    const exact = cfg.options.find(o => o.label.toLowerCase() === q);
    if (!exact) {
      hid.value = '';
      inp.classList.remove('has-value');
    }
  }
  const clr = acIds(id).clr;
  if (clr) clr.classList.toggle('visible', inp.value.length > 0);
}

function acOpen(id) {
  const cfg = AC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop} = acIds(id);
  if (!drop) return;
  const q = inp ? inp.value.trim().toLowerCase() : '';
  const filtered = q ? cfg.options.filter(o => o.label.toLowerCase().includes(q)) : cfg.options;
  acRenderDropdown(id, filtered, q, hid ? String(hid.value) : '');
  drop.classList.add('open');
  // Close other dropdowns
  document.querySelectorAll('.ac-dropdown').forEach(d => {
    if (d.id !== `acDrop_${id}`) d.classList.remove('open');
  });
}

function acRenderDropdown(id, options, q, selectedVal) {
  const {drop} = acIds(id);
  if (!drop) return;
  if (!options.length) {
    drop.innerHTML = `<div class="ac-empty">Aucun résultat pour "${q}"</div>`;
    return;
  }
  drop.innerHTML = options.map((o, i) => {
    const isSel = String(o.value) === selectedVal;
    const label = q ? o.label.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>') : esc(o.label);
    return `<div class="ac-option${isSel?' selected':''}" data-value="${o.value}" data-label="${esc(o.label)}" data-index="${i}"
      onmousedown="acSelect('${id}', this)" >
      <span class="ac-opt-label">${label}</span>
      ${isSel ? '<span class="ac-opt-check">✓</span>' : ''}
    </div>`;
  }).join('');
}

function acSelect(id, optEl) {
  const cfg = AC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop, clr} = acIds(id);
  const val   = optEl.dataset.value;
  const label = optEl.dataset.label;
  if (inp) { inp.value = label; inp.classList.add('has-value'); }
  if (hid) hid.value = val;
  if (clr) clr.classList.add('visible');
  if (drop) drop.classList.remove('open');
  cfg.currentValue = val;
  if (cfg.onSelect) cfg.onSelect(val, label);
}

function acClear(id) {
  const cfg = AC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop, clr} = acIds(id);
  if (inp) { inp.value = ''; inp.classList.remove('has-value'); inp.focus(); }
  if (hid) hid.value = '';
  if (clr) clr.classList.remove('visible');
  cfg.currentValue = '';
  if (cfg.onSelect) cfg.onSelect('', '');
  if (drop) {
    acRenderDropdown(id, cfg.options, '', '');
    drop.classList.add('open');
  }
}

function acKeydown(e, id) {
  const {drop} = acIds(id);
  if (!drop || !drop.classList.contains('open')) return;
  const opts = drop.querySelectorAll('.ac-option');
  const cur  = drop.querySelector('.ac-option.focused');
  let idx    = cur ? parseInt(cur.dataset.index) : -1;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    idx = Math.min(idx + 1, opts.length - 1);
    opts.forEach(o => o.classList.remove('focused'));
    if (opts[idx]) { opts[idx].classList.add('focused'); opts[idx].scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    idx = Math.max(idx - 1, 0);
    opts.forEach(o => o.classList.remove('focused'));
    if (opts[idx]) { opts[idx].classList.add('focused'); opts[idx].scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const focused = drop.querySelector('.ac-option.focused') || opts[0];
    if (focused) acSelect(id, focused);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open');
  }
}

// Close dropdowns when clicking outside
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.ac-wrap')) {
    document.querySelectorAll('.ac-dropdown').forEach(d => d.classList.remove('open'));
  }
});

/* ── Helpers to build option lists ── */
function buildInitiativeOptions() {
  return getInitiativeChoices().map(r => ({ value: String(r.id), label: r.label || `Programme ${r.id}` }));
}
function buildParentOptions(initiativeVal) {
  return getParentProjectOptions(initiativeVal).map(p => ({
    value: String(p.id),
    label: p.Libelle || p.Programme_Nom || `Projet ${p.id}`
  }));
}
function buildPrevOptions(parentId, excludeId) {
  return [{ value: '', label: 'Aucune' }, ...getTaskPredecessorOptions(parentId, excludeId).map(t => ({
    value: String(t.id),
    label: t.Libelle || `Tâche ${t.id}`
  }))];
}
function buildPilotOptions() {
  return [{ value: '', label: 'Sélectionner…' }, ...membersRows.map(m => ({
    value: String(m.id),
    label: memberName(m) || `Membre ${m.id}`
  }))];
}

/* ── Init all ACs after formHtml renders ── */
function initFormAC(item, mode, isCreate) {
  const parentVal      = refIdOf(item.Action_Parent) || '';
  const prevVal        = refIdOf(item.Tache_precedente || item['Tache_précédente']) || '';
  const initiativeVal  = directInitiativeIdOf(item) || linkedProgramIdForAction(item) || '';
  const pilotCurrentId = pilotRefIdOf(item);
  const isNotProg      = mode !== 'prog';

  // Programme lié
  if (document.getElementById('panelInitiative_text')) {
    acInit('initiative', buildInitiativeOptions(), String(initiativeVal || ''), (val) => {
      // When programme changes, refresh parent options
      const parentOpts = buildParentOptions(val);
      acInit('parent', parentOpts, '', (pVal) => {
        const prevOpts = buildPrevOptions(pVal, item.id);
        acInit('prev', prevOpts, '', null);
      });
    });
  }

  // Projet parent
  if (document.getElementById('panelParent_text') && isNotProg) {
    acInit('parent', buildParentOptions(String(initiativeVal || '')), String(parentVal || ''), (val) => {
      const prevOpts = buildPrevOptions(val, item.id);
      acInit('prev', prevOpts, '', null);
    });
  }

  // Tâche précédente
  if (document.getElementById('panelPrev_text') && isNotProg) {
    acInit('prev', buildPrevOptions(String(parentVal || ''), item.id), String(prevVal || ''), null);
  }

  // Pilote
  if (document.getElementById('panelPilot_text')) {
    acInit('pilot', buildPilotOptions(), String(pilotCurrentId || ''), null);
  }
}

let gristReady = false;
const ACTIONS_TABLE_CANDIDATES = ['Actions'];
const MEMBERS_TABLE_CANDIDATES = ['Membres', 'Table1'];
const PROGRAMS_TABLE_CANDIDATES = ['Fiches_Programmes','Fiches Programmes','Fiches_programmes','FichesProgrammes','fiches_programmes'];
let resolvedTableNames = { Actions:'Actions', Membres:null, Programmes:null };

function convertColumnar(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  const cols = Object.keys(data);
  if (!cols.length) return [];
  const n = data[cols[0]]?.length||0;
  return Array.from({length:n},(_,i)=>{
    const r={};
    cols.forEach(c=>r[c]=data[c][i]);
    return r;
  });
}

let suppressNextRecordRefresh = false;

async function fetchFirstAvailableTable(candidates) {
  // 1) Try exact candidates first
  for (const name of candidates) {
    try {
      const raw = await grist.docApi.fetchTable(name);
      return { name, rows: convertColumnar(raw) };
    } catch (err) { /* continue */ }
  }

  // 2) List all tables in the document and fuzzy-match
  try {
    const allTables = await grist.docApi.listTables();
    // Normalize: lowercase, no spaces/underscores
    const normalize = s => String(s).toLowerCase().replace(/[\s_]/g, '');
    const candidateNorms = candidates.map(normalize);
    const match = allTables.find(t => candidateNorms.includes(normalize(t)));
    if (match) {
      try {
        const raw = await grist.docApi.fetchTable(match);
        return { name: match, rows: convertColumnar(raw) };
      } catch (err) { /* continue */ }
    }
  } catch (err) {
    console.warn('listTables failed:', err);
  }

  console.warn('Table introuvable parmi', candidates);
  return { name: null, rows: [] };
}

function currentActionsTable() {
  return resolvedTableNames.Actions || ACTIONS_TABLE_CANDIDATES[0];
}

async function refreshFromGrist(keepActions = false) {
  // keepActions=true → ne pas recharger les actions (déjà fourni par onRecords)
  if (!keepActions) {
    const actionsResult = await fetchFirstAvailableTable(ACTIONS_TABLE_CANDIDATES);
    resolvedTableNames.Actions = actionsResult.name || ACTIONS_TABLE_CANDIDATES[0];
    allActions = actionsResult.rows;
  }

  const membersResult = await fetchFirstAvailableTable(MEMBERS_TABLE_CANDIDATES);
  resolvedTableNames.Membres = membersResult.name;
  membersRows = membersResult.rows;

  const programsResult = await fetchFirstAvailableTable(PROGRAMS_TABLE_CANDIDATES);
  resolvedTableNames.Programmes = programsResult.name;
  programSheetRows = programsResult.rows;
  rebuildProgramSheetIndex();   // reconstruit id→nom depuis la colonne "Programme"

  buildProgramStructure(allActions);
  populatePilotFilter();
  if (!hasAutoFittedView) fitTimelineToAll();
  render();
}

async function initGrist() {
  try {
    await grist.ready({ requiredAccess:'full' });
    gristReady = true;
    await refreshFromGrist();

    grist.onRecords(async (records) => {
      if (suppressNextRecordRefresh) {
        suppressNextRecordRefresh = false;
        return;
      }
      if (records && Array.isArray(records) && records.length) {
        allActions = records;
        // Toujours recharger programSheetRows + membersRows avant de construire
        // la structure — sinon le groupement par Initiative_ID échoue
        // Toujours recharger members + programs pour garantir l'index
        await refreshFromGrist(true);  // keepActions=true, on garde allActions déjà mis à jour
      } else {
        await refreshFromGrist();
      }
    });
  } catch(err) {
    console.warn('Grist unavailable, loading demo data', err);
    loadDemo();
  }
}
