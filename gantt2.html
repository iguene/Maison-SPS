<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt – Actions & Programmes</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   TOKENS & RESET
══════════════════════════════════════════════ */
:root {
  --bg:        #ffffff;
  --surface:   #ffffff;
  --surface2:  #f8fafc;
  --surface3:  #eef2f7;
  --border:    #d8dee9;
  --border2:   #bcc7d6;
  --text:      #172033;
  --text2:     #475569;
  --text3:     #64748b;
  --accent:    #4f7cff;
  --accent2:   #7c4dff;
  --success:   #22c55e;
  --warning:   #f59e0b;
  --danger:    #ef4444;
  --done:      #22c55e;
  --inprog:    #4f7cff;
  --todo:      #8b92a8;
  --radius:    8px;
  --radius-sm: 5px;
  --shadow:    0 10px 30px rgba(15,23,42,.10);
  --font:      'DM Sans', sans-serif;
  --mono:      'DM Mono', monospace;

  --row-h:     42px;
  --hdr-h:     28px;
  --left-w:    280px;
  --header-h:  52px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font); font-size:13px; }
body { background:#ffffff; display:flex; flex-direction:column; }

/* ══════════════════════════════════════════════
   TOOLBAR
══════════════════════════════════════════════ */
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 8px;
  flex-shrink: 0;
  position: relative;
  z-index: 40;
  flex-wrap: nowrap;
  min-height: var(--header-h);
  overflow-x: auto;        /* scroll horizontal si vraiment trop étroit */
  overflow-y: hidden;
  scrollbar-width: none;   /* masquer la scrollbar */
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar-brand {
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.toolbar-brand svg { color: var(--accent); }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink:0; }

/* NAV BUTTONS */
.nav-group { display:flex; align-items:center; gap:2px; flex-shrink:0; }
.btn-icon {
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items:center; justify-content:center;
  font-size: 13px;
  transition: all .15s;
  flex-shrink: 0;
}
.btn-icon:hover { background:var(--surface3); color:var(--text); border-color:var(--border2); }

.period-label {
  font-weight: 600;
  font-size: 11px;
  min-width: 70px;
  max-width: 95px;
  text-align: center;
  color: var(--text);
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ZOOM TOGGLE */
.zoom-group { display:flex; background:var(--surface3); border-radius:var(--radius-sm); padding:2px; gap:1px; border:1px solid var(--border); flex-shrink:0; }
.zoom-btn {
  padding: 3px 7px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.zoom-btn.active { background: var(--accent); color: #fff; }
.zoom-btn:hover:not(.active) { color: var(--text); }

/* FILTERS */
.filter-group { display:flex; align-items:center; gap:4px; margin-left:auto; flex-shrink:0; }
.filter-label { font-size:10px; color:var(--text3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
.filter-select {
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 11px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  outline: none;
  transition: border-color .15s;
  max-width: 100px;
}
.filter-select:focus { border-color: var(--accent); }
.filter-select option { background: var(--surface2); }
.filter-ac { width: 120px; flex-shrink: 0; }
.filter-ac-program { width: 150px; }
.filter-ac-input {
  background: var(--surface3);
  border-color: var(--border);
  font-size: 11px;
  padding: 4px 24px 4px 6px;
  height: 27px;
}
.filter-ac-input.has-value { background:#f0f5ff; }
.filter-ac .ac-dropdown { min-width: 190px; max-height: 240px; }
.filter-ac-program .ac-dropdown { min-width: 260px; }
.filter-ac .ac-option { font-size: 12px; padding: 7px 10px; }

/* UNDO & SAVE */
.save-area { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.btn-undo {
  padding: 5px 10px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--warning);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
  transition: all .15s;
}
.btn-undo.visible { display:flex; }
.btn-undo:hover { background:rgba(245,158,11,.08); }

.save-pill {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  display: none;
  align-items: center;
  gap: 5px;
}
.save-pill.saving  { display:flex; background:rgba(79,124,255,.15); color:var(--accent); }
.save-pill.saved   { display:flex; background:rgba(34,197,94,.12); color:var(--success); }
.save-pill.error   { display:flex; background:rgba(239,68,68,.12); color:var(--danger); }

/* ══════════════════════════════════════════════
   GANTT LAYOUT
══════════════════════════════════════════════ */
.gantt-wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
/* Header row (months + days) */
.gantt-head {
  display: flex;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  user-select: none;
}
.head-left {
  width: var(--left-w);
  min-width: var(--left-w);
  border-right: 1px solid var(--border);
  padding: 0 14px;
  display: flex;
  align-items: flex-end;
  padding-bottom: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
}
.head-right {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.month-row { display:flex; border-bottom: 1px solid var(--border); }
.month-cell {
  border-right: 1px dashed var(--border);
  padding: 3px 8px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  letter-spacing: .5px;
  text-transform: uppercase;
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.day-row { display:flex; }
.day-cell {
  flex-shrink: 0;
  height: var(--hdr-h);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  border-right: 1px solid transparent;
  position: relative;
}
.day-cell.weekend { color: #94a3b8; }
.day-cell.today-col { color: var(--accent); font-weight: 700; }
.day-cell.month-sep::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 1px;
  background: var(--border2);
}

/* ══════════════════════════════════════════════
   BODY
══════════════════════════════════════════════ */
.gantt-body { display:flex; flex:1; min-height:0; overflow:hidden; }

.gantt-left {
  width: var(--left-w);
  min-width: var(--left-w);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--surface);
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.gantt-left::-webkit-scrollbar { width:5px; }
.gantt-left::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

.gantt-scroll {
  flex: 1;
  overflow: auto;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.gantt-scroll::-webkit-scrollbar { height:5px; width:5px; }
.gantt-scroll::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

.gantt-grid { position:relative; }

/* ══════════════════════════════════════════════
   LEFT PANEL ROWS
══════════════════════════════════════════════ */
.prog-row {
  height: var(--row-h);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface2);
  transition: background .1s;
  position: relative;
}
.prog-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 0 2px 2px 0;
}
.prog-row:hover { background: var(--surface3); }
.prog-row.selected { background: var(--surface3); }

.collapse-btn {
  width: 18px; height: 18px;
  border-radius: 4px;
  display: flex; align-items:center; justify-content:center;
  color: var(--text3);
  font-size: 10px;
  flex-shrink: 0;
  transition: transform .2s;
}
.collapse-btn.open { transform: rotate(90deg); }

.prog-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.prog-name {
  flex: 1;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.prog-count {
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  background: var(--surface3);
  padding: 2px 6px;
  border-radius: 10px;
  flex-shrink: 0;
}

/* Task rows */
.task-left-row {
  height: var(--row-h);
  display: flex;
  align-items: center;
  padding: 0 12px 0 32px;
  gap: 7px;
  border-bottom: 1px solid rgba(148,163,184,.16);
  cursor: pointer;
  transition: background .1s;
}
.task-left-row:hover { background: rgba(79,124,255,.05); }
.task-left-row.selected { background: rgba(79,124,255,.10); }

.task-status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.task-left-name {
  flex: 1;
  font-size: 12px;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text2);
}
.task-left-dates {
  font-size: 10px;
  color: var(--text3);
  font-family: var(--mono);
  flex-shrink: 0;
}

/* ══════════════════════════════════════════════
   GRID ROWS (RIGHT SIDE)
══════════════════════════════════════════════ */
.grid-row {
  height: var(--row-h);
  position: relative;
  border-bottom: 1px solid rgba(148,163,184,.16);
  display: flex;
}
.grid-row.prog-bg {
  background: rgba(148,163,184,.08);
  border-bottom: 1px solid var(--border);
}
.grid-col {
  flex-shrink: 0;
  height: 100%;
  border-right: 1px solid transparent;
  position: relative;
}
.grid-col.weekend { background: rgba(148,163,184,.08); }
.grid-col.today-col { background: rgba(79,124,255,.08); }
.grid-col.month-sep { border-right: 1px dashed rgba(148,163,184,.28); }

/* TODAY LINE */
.today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1.5px;
  background: var(--accent);
  z-index: 25;
  pointer-events: none;
  opacity: .55;
}
.today-line::before {
  content: '●';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: var(--accent);
}

/* ══════════════════════════════════════════════
   BARS
══════════════════════════════════════════════ */
.prog-bar {
  position: absolute;
  height: 22px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: grab;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(15,23,42,.14);
  transition: box-shadow .15s, opacity .15s;
  min-width: 20px;
  user-select: none;
}
.prog-bar:active { cursor:grabbing; box-shadow:0 6px 20px rgba(0,0,0,.5); }
.prog-bar.overdue {
  box-shadow: 0 0 0 2px var(--danger), 0 2px 8px rgba(0,0,0,.3);
  animation: pulse-warn 2s ease-in-out infinite;
}
@keyframes pulse-warn {
  0%,100% { box-shadow:0 0 0 2px rgba(239,68,68,.55), 0 2px 8px rgba(15,23,42,.14); }
  50%      { box-shadow:0 0 0 4px rgba(239,68,68,.18), 0 2px 8px rgba(15,23,42,.14); }
}
.prog-bar-label { pointer-events:none; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.prog-bar-warn { margin-left:4px; font-size:12px; flex-shrink:0; pointer-events:none; }

/* Task bar */
.task-bar {
  position: absolute;
  height: 18px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 4px;
  display: flex;
  align-items: center;
  cursor: grab;
  z-index: 12;
  min-width: 8px;
  user-select: none;
  transition: filter .1s, box-shadow .1s;
}
.task-bar:active { cursor:grabbing; }
.task-bar:hover  { filter:brightness(1.05); z-index:20; box-shadow: 0 2px 8px rgba(15,23,42,.12); }

.task-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 4px 0 0 4px;
  background: rgba(255,255,255,.28);
  pointer-events: none;
}
.task-bar-label {
  position: relative;
  z-index: 1;
  font-size: 10.5px;
  font-weight: 500;
  color: #ffffff;
  padding: 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}

/* Resize handles */
.resize-handle {
  position: absolute;
  top: 0; bottom: 0;
  width: 7px;
  cursor: ew-resize;
  z-index: 15;
  border-radius: inherit;
}
.resize-handle.left  { left: 0; }
.resize-handle.right { right: 0; }
.resize-handle:hover { background: rgba(255,255,255,.15); }

/* ══════════════════════════════════════════════
   SVG ARROWS
══════════════════════════════════════════════ */
.dep-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 8;
  overflow: visible;
}

/* ══════════════════════════════════════════════
   TOOLTIP
══════════════════════════════════════════════ */
.tooltip {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 13px;
  font-size: 12px;
  box-shadow: 0 10px 30px rgba(15,23,42,.10);
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .15s, transform .15s;
  min-width: 180px;
  max-width: 260px;
}
.tooltip.show { opacity:1; transform:translateY(0); }
.tooltip-name { font-weight:700; color:var(--text); margin-bottom:7px; font-size:13px; }
.tooltip-row { display:flex; justify-content:space-between; gap:16px; margin-top:4px; }
.tooltip-key { color:var(--text3); font-size:11px; }
.tooltip-val { color:var(--text2); font-size:11px; font-family:var(--mono); }
.tooltip-status { display:inline-block; padding:2px 7px; border-radius:10px; font-size:10px; font-weight:600; margin-top:6px; }

/* ══════════════════════════════════════════════
   DRAG GHOST / SELECTION
══════════════════════════════════════════════ */
.dragging { opacity:.6; filter:brightness(1.3); cursor:grabbing !important; z-index:100 !important; }

/* ══════════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════════ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  gap: 10px;
  font-size: 13px;
}
.empty-state svg { opacity:.3; }

/* ══════════════════════════════════════════════
   LEGEND
══════════════════════════════════════════════ */
.legend {
  position: absolute;
  bottom: 10px;
  right: 14px;
  display: flex;
  gap: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 12px;
  z-index: 30;
}
.legend-item { display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text3); }
.legend-dot  { width:8px; height:8px; border-radius:50%; }
.legend-bar  { width:18px; height:5px; border-radius:2px; }


/* RIGHT PANEL + ACTION BUTTONS */
.btn-primary {
  padding: 7px 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.03); }
.btn-secondary {
  padding: 7px 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.btn-secondary:hover { background: var(--surface3); }
.gantt-main { display:flex; flex:1; min-height:0; }
.side-panel {
  width: 0;
  border-left: 1px solid transparent;
  background: var(--surface);
  overflow: hidden;
  transition: width .18s ease, border-color .18s ease;
  flex-shrink: 0;
}
.side-panel.open { width: 360px; border-color: var(--border); }
.side-panel-inner { width: 360px; height: 100%; display:flex; flex-direction:column; }
.panel-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.panel-title { font-weight:700; font-size:14px; }
.panel-close { background:none; border:none; font-size:18px; cursor:pointer; color:var(--text3); }
.panel-body { padding: 14px 16px 18px; overflow:auto; display:flex; flex-direction:column; gap:12px; }
.form-row { display:flex; flex-direction:column; gap:6px; }
.form-grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.form-label { font-size:11px; color:var(--text3); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.form-input, .form-select, .form-textarea {
  width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius: var(--radius-sm); padding: 9px 10px; font: inherit; outline:none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { min-height: 90px; resize: vertical; }
.panel-meta { font-size:12px; color:var(--text3); display:flex; gap:10px; flex-wrap:wrap; }
.panel-actions { margin-top:auto; display:flex; gap:8px; padding-top:4px; }
.panel-empty { color:var(--text3); font-size:12px; line-height:1.5; }

/* ── AUTOCOMPLETE ── */
.ac-wrap { position:relative; width:100%; }
.ac-input {
  width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius:var(--radius-sm); padding:9px 30px 9px 10px;
  font:inherit; outline:none; transition:border-color .15s; cursor:text;
}
.ac-input:focus { border-color:var(--accent); }
.ac-input.has-value { border-color:var(--accent); background:#f0f5ff; font-weight:500; }
.ac-clear {
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text3); cursor:pointer;
  font-size:14px; line-height:1; padding:2px; display:none;
}
.ac-clear.visible { display:block; }
.ac-dropdown {
  position:absolute; top:calc(100% + 3px); left:0; right:0;
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--radius-sm); box-shadow:0 8px 24px rgba(15,23,42,.12);
  z-index:500; max-height:200px; overflow-y:auto; display:none;
}
.ac-dropdown.open { display:block; }
.ac-option {
  padding:8px 12px; cursor:pointer; font-size:12.5px; color:var(--text);
  border-bottom:1px solid var(--border); display:flex; align-items:center;
  gap:6px; transition:background .1s;
}
.ac-option:last-child { border-bottom:none; }
.ac-option:hover, .ac-option.focused { background:var(--surface3); }
.ac-option.selected { background:#e8f0ff; color:var(--accent); font-weight:600; }
.ac-option .ac-opt-label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-option .ac-opt-check { font-size:12px; color:var(--accent); flex-shrink:0; }
.ac-empty { padding:10px 12px; font-size:12px; color:var(--text3); font-style:italic; }
.ac-option mark { background:#fff3cd; border-radius:2px; padding:0 1px; font-weight:600; }


/* ── CORRECTION LARGEUR FILTRES TOOLBAR ──
   Les champs de filtre utilisent aussi .ac-wrap, qui est à width:100% pour le panneau latéral.
   On force ici une largeur compacte uniquement dans la barre d'outils. */
.toolbar .filter-group {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
  min-width: 0;
}
.toolbar .filter-group .filter-ac {
  width: 108px !important;
  min-width: 108px;
  max-width: 108px;
  flex: 0 0 108px;
}
.toolbar .filter-group .filter-ac-program {
  width: 128px !important;
  min-width: 128px;
  max-width: 128px;
  flex-basis: 128px;
}
.toolbar .filter-group .filter-ac-input {
  width: 100%;
  height: 26px;
  padding: 4px 22px 4px 6px;
  font-size: 11px;
}
.toolbar .filter-group .ac-clear {
  right: 6px;
}
.toolbar .filter-group .ac-dropdown {
  left: 0;
  right: auto;
  width: 220px;
  min-width: 220px;
}
.toolbar .filter-group .filter-ac-program .ac-dropdown {
  width: 280px;
  min-width: 280px;
}
@media (max-width: 1100px) {
  .toolbar .filter-group .filter-ac { width: 92px !important; min-width:92px; max-width:92px; flex-basis:92px; }
  .toolbar .filter-group .filter-ac-program { width: 110px !important; min-width:110px; max-width:110px; flex-basis:110px; }
}


/* ─── BARRE NAVIGATION SPS ─── */
.sps-nav-bar {
  display: flex;
  gap: 6px;
  align-items: center;
  background: rgba(255,255,255,0.95);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  padding: 6px 14px;
  flex-shrink: 0;
  width: 100%;
  z-index: 1000;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  overflow-x: auto;       /* scroll si trop étroit */
  overflow-y: hidden;
  scrollbar-width: none;  /* scrollbar invisible */
  flex-wrap: nowrap;      /* boutons sur une seule ligne */
}
.sps-nav-bar::-webkit-scrollbar { display: none; }
.sps-nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 7px;
  border: 1.5px solid transparent;
  background: #f3f4f6;
  color: #374151;
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
  transition: all 150ms ease;
  white-space: nowrap;
  cursor: pointer;
  font-family: inherit;
}
.sps-nav-btn:hover {
  background: #e0f2f1;
  border-color: #01696f;
  color: #01696f;
}
.sps-nav-btn.sps-active {
  background: #c0392b;
  color: white;
  border-color: #c0392b;
}

<script>
/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let allActions = [];          // raw from Grist
let programs   = [];          // niveau 1 (projects)
let tasksByProg= {};          // progId → [tasks]
let membersRows = [];         // table Membres
let programSheetRows = [];    // table Fiches Programmes
let programSheetById = {};   // id -> nom du programme
let _detectedProgramNameCol = null; // colonne detectee auto
let collapsed  = {};          // progId → bool
let filterStatus  = '';
let filterProgram = '';
let filterPilot = '';
let selectedId = null;
let panelMode = 'view';

let zoom = 'month';
let viewStart;               // Date (first day shown)
let hasAutoFittedView = false;

const LEVEL1_COLOR = '#2563eb'; // bleu
const LEVEL2_COLOR = '#16a34a'; // vert
let progColors = {};

/* ════════════════════════════════════════════
   ZOOM CONFIG
════════════════════════════════════════════ */
const ZOOM_CFG = {
  week:     { cellW: 48, days: 21,  navDays: 7  },
  month:    { cellW: 30, days: 60,  navDays: 14 },
  quarter:  { cellW: 12, days: 120, navDays: 30 },
  halfyear: { cellW: 8,  days: 183, navDays: 45 },
  year:     { cellW: 4,  days: 365, navDays: 90 },
};

function cellWidth()  { return ZOOM_CFG[zoom].cellW; }
function visibleDays(){ return ZOOM_CFG[zoom].days;  }

/* ════════════════════════════════════════════
   DATE UTILS
════════════════════════════════════════════ */
const MS_DAY = 86400000;
const fmtSh = d => d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) : '—';
const fmtFull = d => d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const isWE = d => { const day = d.getDay(); return day===0||day===6; };
const isToday = d => d.toDateString()===new Date().toDateString();
const daysDiff = (a,b) => Math.round((b-a)/MS_DAY);
const addDays  = (d,n) => new Date(d.getTime()+n*MS_DAY);
const startOfMonth = d => new Date(d.getFullYear(),d.getMonth(),1);
const startOfWeek  = d => { const r=new Date(d); r.setDate(r.getDate()-((r.getDay()+6)%7)); return r; };

function gristTs(ts) {
  if (ts == null || ts === '') return null;
  if (ts instanceof Date) return new Date(ts.getTime());

  if (typeof ts === 'string') {
    const raw = ts.trim();
    if (!raw) return null;
    if (!Number.isNaN(Number(raw))) {
      ts = Number(raw);
    } else {
      const parsed = new Date(raw);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }
  }

  const n = Number(ts);
  if (Number.isNaN(n)) return null;

  // Grist stocke généralement les dates en timestamp Unix (secondes).
  // On garde quand même des garde-fous pour d'autres formats éventuels.
  if (Math.abs(n) >= 1e12) return new Date(n);          // millisecondes
  if (Math.abs(n) >= 1e8)  return new Date(n * 1000);   // secondes Unix
  if (Math.abs(n) >= 1000) return new Date(n * MS_DAY); // ancien fallback en jours
  return null;
}
function toGristTs(d) {
  if (!d) return null;
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000);
}

function leftPx(date) {
  return daysDiff(viewStart, date) * cellWidth();
}
function widthPx(start, end) {
  return Math.max(daysDiff(start, end)+1, 1) * cellWidth();
}

/* ════════════════════════════════════════════
   DATA PROCESSING
════════════════════════════════════════════ */
function buildProgramStructure(rawActions) {
  // Identify programs (niveau 1) and tasks (niveau 2)
  programs = [];
  tasksByProg = {};
  progColors = {};

  const projs = rawActions.filter(a => {
    const niv = String(a.Niveau||'').toLowerCase();
    return niv.includes('1') || niv.includes('projet') || niv.includes('project');
  });
  const tasks = rawActions.filter(a => {
    const niv = String(a.Niveau||'').toLowerCase();
    return niv.includes('2') || niv.includes('tâche') || niv.includes('tache') || niv.includes('task');
  });

  // Assign colors
  projs.forEach((p) => {
    progColors[p.id] = LEVEL1_COLOR;
    if (!collapsed.hasOwnProperty(p.id)) collapsed[p.id] = false;
  });

  programs = projs;

  // Map tasks to programs
  programs.forEach(p => { tasksByProg[p.id] = []; });

  tasks.forEach(t => {
    // Action_Parent is a ref to another action (the project)
    const parentId = refIdOf(t.Action_Parent) || null;
    if (parentId && tasksByProg[parentId] !== undefined) {
      tasksByProg[parentId].push(t);
    } else if (parentId) {
      // try to find it
      const prog = programs.find(p => p.id === parentId);
      if (prog) {
        if (!tasksByProg[prog.id]) tasksByProg[prog.id] = [];
        tasksByProg[prog.id].push(t);
      } else {
        // add to first program or orphan
        if (programs.length > 0) {
          tasksByProg[programs[0].id] = tasksByProg[programs[0].id]||[];
          tasksByProg[programs[0].id].push(t);
        }
      }
    }
  });

  // Build Tache_précédente chains within each program
  programs.forEach(p => {
    const tks = tasksByProg[p.id]||[];
    // Resolve predecessor refs
    tks.forEach(t => {
      const prevRaw = t.Tache_precedente || t['Tache_précédente'] || t.Tache_prev || null;
      t._prevId = refIdOf(prevRaw) || null;
    });
  });

  populateProgFilter();
  populatePilotFilter();
  if (!hasAutoFittedView) initViewStart();
}

function populateProgFilter() {
  facInit('program', buildFilterProgramOptions(), filterProgram, (val) => {
    filterProgram = val;
    render();
  });
}

function populatePilotFilter() {
  populateStatusFilter();
  facInit('pilot', buildFilterPilotOptions(), filterPilot, (val) => {
    filterPilot = val;
    render();
  });
}

function populateStatusFilter() {
  facInit('status', buildFilterStatusOptions(), filterStatus, (val) => {
    filterStatus = val;
    render();
  });
}

function getFilteredPrograms() {
  return programs.filter(p => {
    if (!filterProgram) return true;
    const pid = linkedProgramIdForAction(p) || directInitiativeIdOf(p);
    return String(pid || '') === String(filterProgram);
  });
}
function getFilteredTasks(progId) {
  const tks = tasksByProg[progId]||[];
  return tks.filter(t => {
    if (filterStatus && statusFilterValueOf(t.Statut) !== filterStatus) return false;
    if (filterPilot && pilotFilterValueOf(t) !== filterPilot) return false;
    return true;
  });
}


/* ════════════════════════════════════════════
   SEARCHABLE FILTERS
════════════════════════════════════════════ */
const FAC_CONFIGS = {}; // status/program/pilot → { options, currentValue, onSelect }

function normalizeText(s) {
  return String(s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}

function statusFilterValueOf(status) {
  const n = normalizeText(status);
  if (!n) return '';
  if (n.includes('cours')) return 'en_cours';
  if (n.includes('termine') || n.includes('terminee') || n.includes('fait')) return 'termine';
  if (n.includes('faire') || n.includes('todo') || n.includes('a faire')) return 'a_faire';
  return n;
}

function pilotFilterValueOf(item) {
  const id = pilotRefIdOf(item);
  if (id != null && id !== '') return `id:${id}`;
  const name = pilotNameOf(item);
  return name ? `name:${normalizeText(name)}` : '';
}

function buildFilterStatusOptions() {
  const opts = new Map([
    ['en_cours', { value:'en_cours', label:'En cours' }],
    ['a_faire',  { value:'a_faire',  label:'À faire' }],
    ['termine',  { value:'termine',  label:'Terminé' }],
  ]);
  allActions.forEach(a => {
    const val = statusFilterValueOf(a.Statut);
    if (!val) return;
    const label = String(a.Statut || '').trim() || val;
    if (!opts.has(val)) opts.set(val, { value: val, label });
  });
  return [{ value:'', label:'Tous' }, ...Array.from(opts.values()).sort((a,b)=>a.label.localeCompare(b.label,'fr'))];
}

function buildFilterProgramOptions() {
  return [{ value:'', label:'Tous' }, ...getInitiativeChoices().map(r => ({
    value: String(r.id),
    label: r.label || `Programme ${r.id}`
  }))];
}

function buildFilterPilotOptions() {
  const seen = new Map();
  allActions.forEach(a => {
    const value = pilotFilterValueOf(a);
    const label = pilotNameOf(a);
    if (value && label && !seen.has(value)) seen.set(value, { value, label });
  });
  return [{ value:'', label:'Tous' }, ...Array.from(seen.values()).sort((a,b)=>a.label.localeCompare(b.label,'fr'))];
}

function facIds(id) {
  const suffix = id === 'program' ? 'Prog' : id.charAt(0).toUpperCase() + id.slice(1);
  return {
    inp:  document.getElementById(`filter${suffix}_text`),
    hid:  document.getElementById(`filter${suffix}`),
    drop: document.getElementById(`facDrop_${id}`),
    clr:  document.getElementById(`facClear_${id}`),
  };
}

function facInit(id, options, currentValue, onSelect) {
  FAC_CONFIGS[id] = { options, currentValue: currentValue || '', onSelect };
  const {inp, hid, clr} = facIds(id);
  if (!inp || !hid) return;
  const cur = options.find(o => String(o.value) === String(currentValue || '')) || options[0];
  hid.value = currentValue || '';
  inp.value = currentValue ? (cur ? cur.label : String(currentValue)) : '';
  inp.classList.toggle('has-value', !!currentValue);
  if (clr) clr.classList.toggle('visible', !!currentValue);
}

function facFilter(id) {
  const cfg = FAC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop, clr} = facIds(id);
  if (!inp || !drop) return;
  const q = normalizeText(inp.value);
  const filtered = q ? cfg.options.filter(o => normalizeText(o.label).includes(q)) : cfg.options;
  facRenderDropdown(id, filtered, q, hid ? String(hid.value) : '');
  drop.classList.add('open');
  const exact = cfg.options.find(o => normalizeText(o.label) === q);
  if (!exact && hid) {
    hid.value = '';
    inp.classList.remove('has-value');
  }
  if (clr) clr.classList.toggle('visible', inp.value.length > 0);
}

function facOpen(id) {
  const cfg = FAC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop} = facIds(id);
  if (!drop) return;
  const q = inp ? normalizeText(inp.value) : '';
  const filtered = q ? cfg.options.filter(o => normalizeText(o.label).includes(q)) : cfg.options;
  facRenderDropdown(id, filtered, q, hid ? String(hid.value) : '');
  drop.classList.add('open');
  document.querySelectorAll('.ac-dropdown').forEach(d => {
    if (d.id !== `facDrop_${id}`) d.classList.remove('open');
  });
}

function facRenderDropdown(id, options, q, selectedVal) {
  const {drop} = facIds(id);
  if (!drop) return;
  if (!options.length) {
    drop.innerHTML = `<div class="ac-empty">Aucun résultat</div>`;
    return;
  }
  drop.innerHTML = options.map((o, i) => {
    const isSel = String(o.value) === String(selectedVal);
    const safeLabel = esc(o.label);
    const label = q ? safeLabel.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>') : safeLabel;
    return `<div class="ac-option${isSel?' selected':''}" data-value="${esc(o.value)}" data-label="${esc(o.label)}" data-index="${i}"
      onmousedown="facSelect('${id}', this)">
      <span class="ac-opt-label">${label}</span>
      ${isSel ? '<span class="ac-opt-check">✓</span>' : ''}
    </div>`;
  }).join('');
}

function facSelect(id, optEl) {
  const cfg = FAC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop, clr} = facIds(id);
  const val = optEl.dataset.value || '';
  const label = optEl.dataset.label || '';
  if (inp) { inp.value = val ? label : ''; inp.classList.toggle('has-value', !!val); }
  if (hid) hid.value = val;
  if (clr) clr.classList.toggle('visible', !!val);
  if (drop) drop.classList.remove('open');
  cfg.currentValue = val;
  if (cfg.onSelect) cfg.onSelect(val, label);
}

function facClear(id) {
  const cfg = FAC_CONFIGS[id]; if (!cfg) return;
  const {inp, hid, drop, clr} = facIds(id);
  if (inp) { inp.value = ''; inp.classList.remove('has-value'); inp.focus(); }
  if (hid) hid.value = '';
  if (clr) clr.classList.remove('visible');
  cfg.currentValue = '';
  if (cfg.onSelect) cfg.onSelect('', '');
  if (drop) drop.classList.remove('open');
}

function facKeydown(e, id) {
  const {drop} = facIds(id);
  if (!drop || !drop.classList.contains('open')) return;
  const opts = drop.querySelectorAll('.ac-option');
  const cur  = drop.querySelector('.ac-option.focused');
  let idx = cur ? parseInt(cur.dataset.index) : -1;
  if (e.key === 'ArrowDown') {
    e.preventDefault(); idx = Math.min(idx + 1, opts.length - 1);
    opts.forEach(o => o.classList.remove('focused'));
    if (opts[idx]) { opts[idx].classList.add('focused'); opts[idx].scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); idx = Math.max(idx - 1, 0);
    opts.forEach(o => o.classList.remove('focused'));
    if (opts[idx]) { opts[idx].classList.add('focused'); opts[idx].scrollIntoView({block:'nearest'}); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const focused = drop.querySelector('.ac-option.focused') || opts[0];
    if (focused) facSelect(id, focused);
  } else if (e.key === 'Escape') {
    drop.classList.remove('open');
  }
}

/* ════════════════════════════════════════════
   VIEW START
════════════════════════════════════════════ */
function getTimelineBounds() {
  let earliest = null;
  let latest = null;
  allActions.forEach(a => {
    const s = gristTs(a.Date_Demarrage);
    const e = gristTs(a.Date_Fin);
    if (s && (!earliest || s < earliest)) earliest = s;
    if (e && (!latest || e > latest)) latest = e;
  });
  if (!earliest && !latest) {
    const today = new Date();
    return { earliest: today, latest: addDays(today, 30) };
  }
  if (!earliest) earliest = latest;
  if (!latest) latest = earliest;
  return { earliest, latest };
}

function fitTimelineToAll() {
  const { earliest, latest } = getTimelineBounds();
  const totalDays = Math.max(daysDiff(earliest, latest) + 1, 1);
  const withMargin = totalDays + 14;

  if (withMargin <= ZOOM_CFG.week.days)     zoom = 'week';
  else if (withMargin <= ZOOM_CFG.month.days)    zoom = 'month';
  else if (withMargin <= ZOOM_CFG.quarter.days)  zoom = 'quarter';
  else if (withMargin <= ZOOM_CFG.halfyear.days) zoom = 'halfyear';
  else if (withMargin <= ZOOM_CFG.year.days)     zoom = 'year';
  else {
    // Planning > 1 an : zoom dynamique pour tout faire tenir
    zoom = 'year';
    // Calculer le cellW nécessaire pour que tout tienne dans la zone visible
    const scrollEl = document.getElementById('ganttScroll');
    const availWidth = scrollEl ? scrollEl.clientWidth : 800;
    const neededCellW = Math.max(2, Math.floor(availWidth / withMargin));
    // Mettre à jour ZOOM_CFG.year dynamiquement
    ZOOM_CFG.year = { cellW: neededCellW, days: withMargin, navDays: Math.round(withMargin / 4) };
  }

  document.querySelectorAll('.zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom===zoom));
  viewStart = startOfMonth(addDays(earliest, -7));
  updatePeriodLabel();
}

function initViewStart() {
  fitTimelineToAll();
}

function navigate(dir) {
  const navDays = ZOOM_CFG[zoom].navDays;
  viewStart = addDays(viewStart, dir * navDays);
  updatePeriodLabel();
  render();
}
function goToday() {
  viewStart = startOfMonth(addDays(new Date(), -14));
  updatePeriodLabel();
  render();
}
function setZoom(z) {
  zoom = z;
  document.querySelectorAll('.zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom===z));
  updatePeriodLabel();
  render();
}
function updatePeriodLabel() {
  const end = addDays(viewStart, visibleDays());
  const fmt = d => d.toLocaleDateString('fr-FR',{month:'short',year:'numeric'});
  document.getElementById('periodLabel').textContent = fmt(viewStart)+' – '+fmt(end);
}

/* ════════════════════════════════════════════
   PROG BAR METRICS
════════════════════════════════════════════ */
function computeProgDates(progId) {
  const p = programs.find(x=>x.id===progId);
  if (!p) return null;
  const tks = tasksByProg[progId]||[];
  let minS = gristTs(p.Date_Demarrage);
  let maxE = gristTs(p.Date_Fin);
  tks.forEach(t => {
    const s = gristTs(t.Date_Demarrage);
    const e = gristTs(t.Date_Fin);
    if (s && (!minS||s<minS)) minS=s;
    if (e && (!maxE||e>maxE)) maxE=e;
  });
  const progEnd = gristTs(p.Date_Fin);
  const overdue = progEnd && maxE && maxE > progEnd;
  return { start:minS, end:maxE, overdue };
}

function taskDurationDays(task) {
  const s = gristTs(task?.Date_Demarrage);
  const e = gristTs(task?.Date_Fin);
  if (!s || !e) return 1;
  return Math.max(daysDiff(s, e) + 1, 1);
}

function setTaskDateRange(task, startDate, endDate) {
  if (!task || !startDate || !endDate) return;
  task.Date_Demarrage = toGristTs(startDate);
  task.Date_Fin = toGristTs(endDate);
}

function shiftTaskToStart(task, newStart) {
  if (!task || !newStart) return;
  const duration = taskDurationDays(task);
  const newEnd = addDays(newStart, duration - 1);
  setTaskDateRange(task, newStart, newEnd);
}

function shiftTaskToEnd(task, newEnd) {
  if (!task || !newEnd) return;
  const duration = taskDurationDays(task);
  const newStart = addDays(newEnd, -(duration - 1));
  setTaskDateRange(task, newStart, newEnd);
}

function syncProgramDatesFromTasks(progId) {
  const prog = programs.find(p => String(p.id) === String(progId));
  const tks = (tasksByProg[progId] || []).filter(t => gristTs(t.Date_Demarrage) && gristTs(t.Date_Fin));
  if (!prog || !tks.length) return;

  let minTask = tks[0];
  let maxTask = tks[0];
  tks.forEach(t => {
    if (gristTs(t.Date_Demarrage) < gristTs(minTask.Date_Demarrage)) minTask = t;
    if (gristTs(t.Date_Fin) > gristTs(maxTask.Date_Fin)) maxTask = t;
  });

  prog.Date_Demarrage = toGristTs(gristTs(minTask.Date_Demarrage));
  prog.Date_Fin = toGristTs(gristTs(maxTask.Date_Fin));
}

function alignBoundaryTasksToProgram(progId) {
  const prog = programs.find(p => String(p.id) === String(progId));
  const tks = (tasksByProg[progId] || []).filter(t => gristTs(t.Date_Demarrage) && gristTs(t.Date_Fin));
  if (!prog || !tks.length) return;

  const progStart = gristTs(prog.Date_Demarrage);
  const progEnd = gristTs(prog.Date_Fin);
  if (!progStart && !progEnd) return;

  let firstTask = tks[0];
  let lastTask = tks[0];
  tks.forEach(t => {
    if (gristTs(t.Date_Demarrage) < gristTs(firstTask.Date_Demarrage)) firstTask = t;
    if (gristTs(t.Date_Fin) > gristTs(lastTask.Date_Fin)) lastTask = t;
  });

  if (progStart && progEnd && String(firstTask.id) === String(lastTask.id)) {
    setTaskDateRange(firstTask, progStart, progEnd);
    return;
  }
  if (progStart) shiftTaskToStart(firstTask, progStart);
  if (progEnd) shiftTaskToEnd(lastTask, progEnd);
}

function enforceDependenciesInProgram(progId) {
  const tks = tasksByProg[progId] || [];
  if (!tks.length) return;

  let changed = true;
  let safety = 0;
  while (changed && safety++ < 50) {
    changed = false;
    tks.forEach(task => {
      if (!task._prevId) return;
      const prev = tks.find(t => String(t.id) === String(task._prevId));
      if (!prev) return;

      const prevEnd = gristTs(prev.Date_Fin);
      const taskStart = gristTs(task.Date_Demarrage);
      if (!prevEnd || !taskStart) return;

      const minStart = addDays(prevEnd, 1);
      if (taskStart < minStart) {
        shiftTaskToStart(task, minStart);
        changed = true;
      }
    });
  }
}

/* ════════════════════════════════════════════
   RENDER HEADER
════════════════════════════════════════════ */
function renderHeader() {
  const days = visibleDays();
  const cw   = cellWidth();
  const totalW = days * cw;

  // Month row
  const monthRow = document.getElementById('monthRow');
  const dayRow   = document.getElementById('dayRow');
  monthRow.innerHTML = '';
  dayRow.innerHTML   = '';

  // Build month spans
  const months = {};
  for (let i=0; i<days; i++) {
    const d = addDays(viewStart, i);
    const key = d.getFullYear()*100+d.getMonth();
    if (!months[key]) months[key]={label:d.toLocaleDateString('fr-FR',{month:'short',year:'numeric'}), count:0};
    months[key].count++;
  }
  Object.values(months).forEach(m => {
    const el = document.createElement('div');
    el.className = 'month-cell';
    el.style.width = (m.count*cw)+'px';
    el.textContent = m.label.toUpperCase();
    monthRow.appendChild(el);
  });

  // Day row
  for (let i=0; i<days; i++) {
    const d = addDays(viewStart, i);
    const el = document.createElement('div');
    el.className = 'day-cell';
    el.style.width = cw+'px';
    if (isWE(d)) el.classList.add('weekend');
    if (isToday(d)) el.classList.add('today-col');
    if (d.getDate()===1) el.classList.add('month-sep');

    if (zoom==='week') el.textContent = d.getDate();
    else if (zoom==='month') el.textContent = d.getDate()%2===1 ? d.getDate() : '';
    else el.textContent = d.getDate()===1 ? d.getDate() : '';
    dayRow.appendChild(el);
  }
}

/* ════════════════════════════════════════════
   RENDER ROWS (LEFT + GRID)
════════════════════════════════════════════ */
function render() {
  renderHeader();
  const leftEl  = document.getElementById('ganttLeft');
  const gridEl  = document.getElementById('ganttGrid');
  leftEl.innerHTML  = '';
  gridEl.innerHTML  = '';

  const days  = visibleDays();
  const cw    = cellWidth();
  const totalW = days * cw;
  gridEl.style.width  = totalW+'px';

  // Today line
  const todayOff = daysDiff(viewStart, new Date());
  if (todayOff>=0 && todayOff<days) {
    const tl = document.createElement('div');
    tl.className = 'today-line';
    tl.style.left = (todayOff*cw + cw/2)+'px';
    tl.style.height = '100%';
    gridEl.appendChild(tl);
  }

  const progs = getFilteredPrograms();
  if (!progs.length) {
    leftEl.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7h18M3 12h18M3 17h18"/></svg><div>Aucun programme trouvé</div></div>';
    return;
  }

  // SVG layer for arrows
  const svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.classList.add('dep-svg');
  svgEl.style.width = totalW+'px';
  svgEl.setAttribute('height','10'); // will grow
  gridEl.appendChild(svgEl);

  let rowIndex = 0;
  let rowPositions = {};  // taskId → {y, barLeft, barRight, rowTop}

  progs.forEach((prog) => {
    const color    = progColors[prog.id] || '#4f7cff';
    const tks      = getFilteredTasks(prog.id);
    const isOpen   = !collapsed[prog.id];
    const pDates   = computeProgDates(prog.id);
    const rowH     = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h')) || 42;

    // ── PROGRAM ROW (left) ──
    const pLeft = document.createElement('div');
    pLeft.className = 'prog-row'+(selectedId===prog.id?' selected':'');
    pLeft.style.setProperty('--prog-color', color);
    pLeft.style.borderLeft = '3px solid '+color;
    const pName = prog.Libelle || prog.Programme_Nom || 'Programme '+prog.id;
    pLeft.innerHTML = `
      <span class="collapse-btn ${isOpen?'open':''}" onclick="toggleCollapse(${prog.id},event)">▶</span>
      <span class="prog-dot" style="background:${color}"></span>
      <span class="prog-name">${esc(pName)}</span>
      <span class="prog-count">${tks.length}</span>
    `;
    pLeft.onclick = () => { panelMode='view'; selectedId=prog.id; render(); };
    leftEl.appendChild(pLeft);

    // ── PROGRAM GRID ROW ──
    const pGrid = buildGridRow(days, cw, true);
    gridEl.appendChild(pGrid);

    // Program bar
    if (pDates && pDates.start && pDates.end) {
      const left = leftPx(pDates.start);
      const w    = widthPx(pDates.start, pDates.end);
      const bar  = document.createElement('div');
      bar.className = 'prog-bar'+(pDates.overdue?' overdue':'');
      bar.style.cssText = `left:${left}px;width:${w}px;background:${color};`;
      bar.innerHTML = `<span class="prog-bar-label">${esc(pName)}</span>${pDates.overdue?'<span class="prog-bar-warn">⚠</span>':''}`;
      bar.setAttribute('data-type','prog');
      bar.setAttribute('data-id',prog.id);
      bar.setAttribute('data-start',pDates.start.getTime());
      bar.setAttribute('data-end',pDates.end.getTime());
      bar.onclick = (e) => { e.stopPropagation(); panelMode='view'; selectedId=prog.id; renderSidePanel(); render(); };
      setupTooltip(bar, {
        name: pName,
        rows: [
          ['Début',fmtFull(pDates.start)],
          ['Fin',fmtFull(pDates.end)],
          ['Tâches',tks.length],
          pDates.overdue?['⚠ Dépassement','Fin réelle > Date prévue']:null,
        ].filter(Boolean),
        status: prog.Statut,
        color,
      });
      setupProgDrag(bar, prog.id);
      pGrid.appendChild(bar);
    }
    rowIndex++;

    if (!isOpen) return;

    // ── TASK ROWS ──
    tks.forEach((task) => {
      const rowTop = rowIndex * rowH;
      const tStart = gristTs(task.Date_Demarrage);
      const tEnd   = gristTs(task.Date_Fin);

      // Left row
      const tLeft = document.createElement('div');
      tLeft.className = 'task-left-row'+(selectedId===task.id?' selected':'');
      const tName = task.Libelle||'Tâche '+task.id;
      tLeft.innerHTML = `
        <span class="task-status-dot" style="background:${LEVEL2_COLOR}"></span>
        <span class="task-left-name">${esc(tName)}</span>
        <span class="task-left-dates">${tStart?fmtSh(tStart):''}</span>
      `;
      tLeft.onclick = () => { panelMode='view'; selectedId=task.id; render(); };
      leftEl.appendChild(tLeft);

      // Grid row
      const tGrid = buildGridRow(days, cw, false);
      gridEl.appendChild(tGrid);

      // Bar
      if (tStart && tEnd) {
        const left = leftPx(tStart);
        const w    = widthPx(tStart, tEnd);
        const bar  = document.createElement('div');
        bar.className = 'task-bar';
        bar.style.cssText = `left:${left}px;width:${w}px;background:${LEVEL2_COLOR};`;
        bar.setAttribute('data-type','task');
        bar.setAttribute('data-id',task.id);
        bar.setAttribute('data-progid',prog.id);
        bar.setAttribute('data-start',tStart.getTime());
        bar.setAttribute('data-end',tEnd.getTime());

        const prog_pct = task.PDCA||0;
        bar.innerHTML = `
          <div class="task-bar-fill" style="width:${prog_pct}%"></div>
          <div class="resize-handle left" data-type="task" data-id="${task.id}" data-side="left"></div>
          <span class="task-bar-label">${esc(tName)}</span>
          <div class="resize-handle right" data-type="task" data-id="${task.id}" data-side="right"></div>
        `;
        bar.onclick = (e) => { e.stopPropagation(); panelMode='view'; selectedId=task.id; renderSidePanel(); render(); };
        setupTooltip(bar, {
          name: tName,
          rows:[
            ['Début',fmtFull(tStart)],
            ['Fin',fmtFull(tEnd)],
            ['Pilote',task.Pilote_Nom||task.Pilote||'—'],
            ['Avancement',(prog_pct||0)+'%'],
          ],
          status: task.Statut,
          color,
        });
        setupTaskDrag(bar, task.id, prog.id);
        tGrid.appendChild(bar);

        rowPositions[task.id] = {
          y: rowTop + rowH/2,
          barLeft:  left,
          barRight: left+w,
        };
      }
      rowIndex++;
    });

    // Draw dep arrows
    tks.forEach(t => {
      if (!t._prevId) return;
      const from = rowPositions[t._prevId];
      const to   = rowPositions[t.id];
      if (!from||!to) return;
      drawArrow(svgEl, from.barRight, from.y, to.barLeft, to.y, LEVEL2_COLOR);
    });
  });

  const totalH = rowIndex * (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h'))||42);
  gridEl.style.height = totalH+'px';
  svgEl.setAttribute('height', totalH);
  svgEl.style.height = totalH+'px';

  // Sync vertical scroll
  syncScroll();

  if (!hasAutoFittedView) {
    requestAnimationFrame(() => {
      const scrollEl = document.getElementById('ganttScroll');
      const leftEl = document.getElementById('ganttLeft');
      scrollEl.scrollTop = 0;
      leftEl.scrollTop = 0;
      scrollEl.scrollLeft = 0;
    });
    hasAutoFittedView = true;
  }
  renderSidePanel();
}

function buildGridRow(days, cw, isProg) {
  const row = document.createElement('div');
  row.className = 'grid-row'+(isProg?' prog-bg':'');
  row.style.width = (days*cw)+'px';
  for (let i=0; i<days; i++) {
    const d = addDays(viewStart, i);
    const col = document.createElement('div');
    col.className = 'grid-col';
    col.style.width = cw+'px';
    if (isWE(d)) col.classList.add('weekend');
    if (isToday(d)) col.classList.add('today-col');
    if (d.getDate()===1) col.classList.add('month-sep');
    row.appendChild(col);
  }
  return row;
}

function drawArrow(svgEl, x1,y1,x2,y2, color) {
  const mid = (x1+x2)/2;
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`);
  path.setAttribute('fill','none');
  path.setAttribute('stroke', hexToRgba(color,0.45));
  path.setAttribute('stroke-width','1.5');
  path.setAttribute('stroke-dasharray','4 3');
  path.setAttribute('marker-end','url(#arrow-'+color.replace('#','')+ ')');
  svgEl.appendChild(path);

  // Arrow marker
  const defs = svgEl.querySelector('defs') || (() => {
    const d=document.createElementNS('http://www.w3.org/2000/svg','defs');
    svgEl.insertBefore(d,svgEl.firstChild);
    return d;
  })();
  const mid_id = 'arrow-'+color.replace('#','');
  if (!defs.querySelector('#'+mid_id)) {
    const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id',mid_id);
    marker.setAttribute('markerWidth','6');
    marker.setAttribute('markerHeight','6');
    marker.setAttribute('refX','5');
    marker.setAttribute('refY','3');
    marker.setAttribute('orient','auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points','0 0, 6 3, 0 6');
    poly.setAttribute('fill', hexToRgba(color,0.6));
    marker.appendChild(poly);
    defs.appendChild(marker);
  }
}

function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16)||79;
  const g=parseInt(hex.slice(3,5),16)||124;
  const b=parseInt(hex.slice(5,7),16)||255;
  return `rgba(${r},${g},${b},${a})`;
}

const esc = s => {
  if (!s) return '';
  const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;
};

function statusColor(s) {
  if (!s) return '#555e7a';
  const sl = s.toLowerCase();
  if (sl.includes('cours')) return '#4f7cff';
  if (sl.includes('terminé')||sl.includes('termine')) return '#22c55e';
  if (sl.includes('faire')) return '#8b92a8';
  return '#8b92a8';
}

function pilotNameOf(item) {
  if (!item) return '';
  if (Array.isArray(item.Pilote_Nom)) return item.Pilote_Nom[0] || '';
  if (item.Pilote_Nom) return String(item.Pilote_Nom);
  if (Array.isArray(item.Pilote)) return item.Pilote[0] || String(item.Pilote[1]||'');
  return item.Pilote ? String(item.Pilote) : '';
}

function pilotRefIdOf(item) {
  if (!item) return null;
  if (Array.isArray(item.Pilote)) return item.Pilote[1] ?? null;
  if (typeof item.Pilote === 'number') return item.Pilote;
  return null;
}

function normalizeRefValue(val) {
  if (val == null || val === '' || val === '0' || val === 0) return null;
  if (typeof val === 'object' && !Array.isArray(val)) {
    if ('id' in val) return normalizeRefValue(val.id);
    if ('rowId' in val) return normalizeRefValue(val.rowId);
  }
  const n = Number(val);
  // 0 = "aucune référence" en Grist — on traite comme null côté widget
  if (n === 0) return null;
  return Number.isFinite(n) ? n : (typeof val === 'string' && val.trim() ? val.trim() : null);
}

function refIdOf(val) {
  if (val == null || val === '') return null;
  if (Array.isArray(val)) return val[1] ?? null;
  if (typeof val === 'object') {
    if ('id' in val) return normalizeRefValue(val.id);
    if ('rowId' in val) return normalizeRefValue(val.rowId);
    if ('recordId' in val) return normalizeRefValue(val.recordId);
  }
  if (typeof val === 'number') return val;
  const n = Number(val);
  return Number.isFinite(n) ? n : null;
}

function refLabelOf(val) {
  if (val == null || val === '') return '';
  if (Array.isArray(val)) return val[0] || '';
  if (typeof val === 'object') {
    if ('label' in val) return String(val.label || '');
    if ('displayValue' in val) return String(val.displayValue || '');
    if ('name' in val) return String(val.name || '');
  }
  return String(val);
}

function memberName(row) {
  return String(row.Nom || row.name || row.Name || '').trim();
}

// Nom d'une ligne de Fiches Programmes.
function programSheetName(row) {
  if (!row) return '';
  // Si la colonne a été auto-détectée, l'utiliser en priorité
  if (_detectedProgramNameCol && row[_detectedProgramNameCol] !== undefined) {
    const v = row[_detectedProgramNameCol];
    if (typeof v === 'string' && v.trim()) return v.trim();
  }
  // Fallback : essayer toutes les variantes connues
  for (const col of ['Programme','Programme_Nom','Libelle','Nom','name','Name']) {
    const v = row[col];
    if (typeof v === 'string' && v.trim()) return v.trim();
  }
  return '';
}

// Index id (rowId de Fiches Programmes) -> nom, reconstruit à chaque refresh.
function detectProgramNameColumn() {
  if (!programSheetRows.length) return null;
  const firstRow = programSheetRows[0];
  const cols = Object.keys(firstRow).filter(c => c !== 'id' && c !== 'manualSort');
  console.log('[Gantt] Fiches Programmes columns:', cols);

  // Priorité 1 : correspondance exacte sur les noms attendus
  const priority = ['Programme','Programme_Nom','Libelle','Nom','name','Name','label','Label'];
  for (const p of priority) {
    if (cols.includes(p)) {
      const v = firstRow[p];
      if (typeof v === 'string' && v.trim()) return p;
    }
  }

  // Priorité 2 : première colonne string non vide qui ressemble à un nom
  for (const col of cols) {
    const v = firstRow[col];
    if (typeof v === 'string' && v.trim().length > 1) return col;
  }

  return null;
}

function rebuildProgramSheetIndex() {
  programSheetById = {};
  _detectedProgramNameCol = detectProgramNameColumn();
  console.log('[Gantt] detected programme name column:', _detectedProgramNameCol,
    '| rows:', programSheetRows.length);

  programSheetRows.forEach(r => {
    const id = normalizeRefValue(r.id);
    if (id == null) return;
    // Utiliser la colonne détectée en priorité, puis le fallback générique
    let name = _detectedProgramNameCol ? String(r[_detectedProgramNameCol] || '').trim() : '';
    if (!name) name = programSheetName(r);
    if (name) programSheetById[String(id)] = name;
  });

  console.log('[Gantt] programSheetById:', programSheetById);
}

// Initiative_ID est une Ref Grist -> Fiches Programmes.
// Grist la renvoie comme un entier (rowId de la ligne liée).
function directInitiativeIdOf(action) {
  if (!action) return null;
  const raw = action.Initiative_ID;
  if (raw == null || raw === 0 || raw === '') return null;
  if (typeof raw === 'number' && raw > 0) return raw;
  if (Array.isArray(raw)) {
    const n = raw.find(v => typeof v === 'number' && v > 0);
    if (n != null) return n;
  }
  if (typeof raw === 'string') {
    const n = Number(raw.trim());
    if (Number.isFinite(n) && n > 0) return n;
  }
  const fromRef = refIdOf(raw);
  if (fromRef != null && fromRef > 0) return fromRef;
  return null;
}

// Nom du programme associé à Initiative_ID, via notre index.
function directInitiativeLabelOf(action) {
  if (!action) return '';
  const id = directInitiativeIdOf(action);
  if (id != null) {
    const fromIndex = programSheetById[String(id)];
    if (fromIndex) return fromIndex;
  }
  // Fallback : label stocké dans la valeur de ref (si Grist le fournit)
  const raw = action.Initiative_ID;
  if (Array.isArray(raw)) {
    const str = raw.find(v => typeof v === 'string' && v.trim() && !/^\d+$/.test(v.trim()));
    if (str) return str.trim();
  }
  return '';
}

function getInitiativeChoices() {
  // Source principale : notre index id->nom construit depuis Fiches Programmes
  // (rebuildProgramSheetIndex() est appelé à chaque refreshFromGrist).
  const seen = new Map();

  // 1) Toutes les lignes de Fiches Programmes, nom via programSheetById
  programSheetRows.forEach(r => {
    const id = normalizeRefValue(r.id);
    if (id == null) return;
    const key = String(id);
    // programSheetById est déjà construit avec les bons noms
    const label = programSheetById[key] || programSheetName(r) || `Programme ${id}`;
    seen.set(key, { id, label });
  });

  // 2) Complément depuis Actions.Initiative_ID (cas où Fiches Programmes
  //    n'aurait pas encore été chargé ou aurait des lignes supplémentaires)
  allActions.forEach(a => {
    const id = directInitiativeIdOf(a);
    if (id == null) return;
    const key = String(id);
    if (seen.has(key)) return;   // déjà dans l'index

    // Tenter de trouver la ligne dans programSheetRows
    const row = programSheetRows.find(r => String(normalizeRefValue(r.id)) === key);
    const label = row
      ? (programSheetById[key] || programSheetName(row) || `Programme ${id}`)
      : (directInitiativeLabelOf(a) || `Programme ${id}`);

    seen.set(key, { id, label });
  });

  return Array.from(seen.values()).sort((a, b) =>
    String(a.label).localeCompare(String(b.label), 'fr')
  );
}

function linkedProgramIdForAction(action) {
  const direct = directInitiativeIdOf(action);
  if (direct != null) return direct;
  const parentId = refIdOf(action && action.Action_Parent);
  if (parentId != null) {
    const parent = allActions.find(a => String(a.id) === String(parentId));
    if (parent) return linkedProgramIdForAction(parent);
  }
  return null;
}

function linkedProgramLabelForAction(action) {
  const pid = linkedProgramIdForAction(action);
  if (pid != null) {
    // 1) Index principal (construit depuis Fiches Programmes)
    const fromIndex = programSheetById[String(pid)];
    if (fromIndex) return fromIndex;
    // 2) Fallback ligne directe
    const row = programSheetRows.find(r => String(normalizeRefValue(r.id)) === String(pid));
    if (row) {
      const name = programSheetName(row);
      if (name) return name;
    }
  }
  // Fallback directInitiativeLabelOf (utilise aussi l'index)
  const lbl = directInitiativeLabelOf(action);
  if (lbl) return lbl;
  const parentId = refIdOf(action && action.Action_Parent);
  if (parentId != null) {
    const parent = allActions.find(a => String(a.id) === String(parentId));
    if (parent) return linkedProgramLabelForAction(parent);
  }
  return '';
}

function getParentProjectOptions(selectedProgramId='') {
  return programs.filter(p => {
    if (!selectedProgramId) return true;
    const projectInitiativeId = directInitiativeIdOf(p);
    return String(projectInitiativeId || '') === String(selectedProgramId);
  }).sort((a,b)=> String(a.Libelle||'').localeCompare(String(b.Libelle||''), 'fr'));
}

function getTaskPredecessorOptions(parentId, excludeId=null) {
  if (!parentId) return [];
  return (tasksByProg[parentId] || []).filter(t => String(t.id) !== String(excludeId));
}

function syncCreateLinkedFields() {

  const initiativeHid = document.getElementById('panelInitiative');

function resolvePilotFieldForSave(obj, pilotLabel) {
  const clean = (pilotLabel || '').trim();
  const currentRefId = pilotRefIdOf(obj);

  if (!clean) {
    if ('Pilote' in obj) return { field: 'Pilote', value: null };
    if ('Pilote_Nom' in obj && !('Pilote' in obj)) return { field: 'Pilote_Nom', value: '' };
    return null;
  }

  if (currentRefId != null && pilotNameOf(obj) === clean) {
    return { field: 'Pilote', value: currentRefId };
  }

  const matched = allActions.find(a => pilotRefIdOf(a) != null && pilotNameOf(a) === clean);
  if (matched) {
    return { field: 'Pilote', value: pilotRefIdOf(matched) };
  }

  if ('Pilote' in obj && (Array.isArray(obj.Pilote) || typeof obj.Pilote === 'number')) {
    return { unresolved: true, label: clean };
  }

  if ('Pilote' in obj) return { field: 'Pilote', value: clean };
  if ('Pilote_Nom' in obj) return { field: 'Pilote_Nom', value: clean };
  return null;
}

function selectedItem() {
  if (selectedId == null) return null;
  const prog = programs.find(p => String(p.id) === String(selectedId));
  if (prog) return { type:'prog', item: prog };
  const task = findTask(selectedId);
  if (task) return { type:'task', item: task };
  return null;
}

function toInputDate(val) {
  const d = gristTs(val);
  if (!d) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fromInputDate(val) {
  if (!val) return null;
  const [y, m, d] = val.split('-').map(Number);
  if (!y || !m || !d) return null;
  return Math.floor(Date.UTC(y, m - 1, d) / 1000);
}

function renderSidePanel() {
  const panel = document.getElementById('sidePanel');
  const title = document.getElementById('panelTitle');
  const meta  = document.getElementById('panelMeta');
  const body  = document.getElementById('panelBody');

  if (panelMode === 'create') {
    panel.classList.add('open');
    title.textContent = 'Nouvelle tâche';
    meta.innerHTML = '<span>Création</span>';

    const selected = selectedItem();
    const selectedProg = selected?.type === 'prog' ? selected.item : null;
    const selectedTask = selected?.type === 'task' ? selected.item : null;
    const firstParentForFilteredProgram = filterProgram ? (getParentProjectOptions(filterProgram)[0]?.id || '') : '';
    const defaultParent = selectedProg?.id || refIdOf(selectedTask?.Action_Parent) || firstParentForFilteredProgram || (programs[0] ? programs[0].id : '');
    const defaultParentObj = programs.find(p => String(p.id) === String(defaultParent)) || {};
    const defaultInitiative = selectedProg ? (directInitiativeIdOf(selectedProg) || linkedProgramIdForAction(selectedProg)) : (selectedTask ? (directInitiativeIdOf(selectedTask) || linkedProgramIdForAction(selectedTask)) : (defaultParent ? (directInitiativeIdOf(defaultParentObj) || linkedProgramIdForAction(defaultParentObj)) : ''));

    const createItem = {
      Libelle:'', Statut:'A faire', PDCA:0, Description:'', Pilote:null, Initiative_ID: defaultInitiative || '',
      Tache_precedente: selectedTask?.id || null, Date_Demarrage:'', Date_Fin:'', Action_Parent: defaultParent, Niveau:'2 - Tâche'
    };
    body.innerHTML = formHtml(createItem, 'create');
    setTimeout(() => initFormAC(createItem, 'create', true), 0);
    if (typeof syncCreateLevelFields === 'function') setTimeout(syncCreateLevelFields, 0);
    return;
  }

  const sel = selectedItem();
  if (!sel) {
    panel.classList.remove('open');
    title.textContent = 'Détails';
    meta.innerHTML = '';
    body.innerHTML = '<div class="panel-empty">Sélectionne un élément du Gantt ou clique sur + Tâche pour créer une nouvelle tâche.</div>';
    return;
  }

  panel.classList.add('open');
  const item = sel.item;
  title.textContent = sel.type === 'prog' ? 'Programme' : 'Tâche';
  meta.innerHTML = `<span>ID ${item.id}</span><span>${esc(sel.type === 'prog' ? 'Projet' : 'Action')}</span>`;

  setTimeout(() => initFormAC(item, sel.type, false), 0);
}

async function saveSelectedFromPanel(id, mode) {
  const obj = mode === 'prog' ? programs.find(p => String(p.id) === String(id)) : findTask(id);
  if (!obj) return;
  obj.Libelle = document.getElementById('panelLibelle').value.trim();
  obj.Statut = document.getElementById('panelStatut').value;
  obj.PDCA = Number(document.getElementById('panelPDCA').value || 0);
  obj.Date_Demarrage = fromInputDate(document.getElementById('panelDateStart').value);
  obj.Date_Fin = fromInputDate(document.getElementById('panelDateEnd').value);
  obj.Description = document.getElementById('panelDescription').value;
  obj._pilotEditId = normalizeRefValue(document.getElementById('panelPilot')?.value || '');
  obj._initiativeEditId = normalizeRefValue(document.getElementById('panelInitiative')?.value || '');

  if (mode !== 'prog') {
    obj.Action_Parent = normalizeRefValue(document.getElementById('panelParent').value);
    const prevId = normalizeRefValue(document.getElementById('panelPrev')?.value || '');
    obj['Tache_précédente'] = prevId;
    obj.Tache_precedente = prevId;
    obj._prevId = prevId;

    if (obj.Action_Parent) {
      enforceDependenciesInProgram(obj.Action_Parent);
      syncProgramDatesFromTasks(obj.Action_Parent);
    }
  } else {
    alignBoundaryTasksToProgram(id);
    enforceDependenciesInProgram(id);
    syncProgramDatesFromTasks(id);
  }

  render();
  await saveFullRecord(obj);
}

async function createTaskFromPanel() {
  let initiativeId = normalizeRefValue(document.getElementById('panelInitiative')?.value || '');
  const parentId   = normalizeRefValue(document.getElementById('panelParent')?.value || '');
  const prevId     = normalizeRefValue(document.getElementById('panelPrev')?.value || '');
  const pilotId    = normalizeRefValue(document.getElementById('panelPilot')?.value || '');

  if (!initiativeId && parentId) {
    const parent = programs.find(p => String(p.id) === String(parentId))
                || allActions.find(a => String(a.id) === String(parentId));
    initiativeId = normalizeRefValue(linkedProgramIdForAction(parent || {}));
  }

  // Payload de base — champs toujours présents
  const selectedNiveau = document.getElementById('panelNiveau')?.value || '2 - Tâche';

  const payload = {
    Libelle:         document.getElementById('panelLibelle').value.trim() || 'Nouvelle tâche',
    Niveau:          selectedNiveau,
    Statut:          document.getElementById('panelStatut').value || 'A faire',
    PDCA:            Number(document.getElementById('panelPDCA').value || 0),
    Description:     document.getElementById('panelDescription').value || '',
  };

  // Dates (omises si vides plutôt qu'envoyées null)
  const dateStart = fromInputDate(document.getElementById('panelDateStart').value);
  const dateEnd   = fromInputDate(document.getElementById('panelDateEnd').value);
  if (dateStart != null) payload.Date_Demarrage = dateStart;
  if (dateEnd   != null) payload.Date_Fin       = dateEnd;

  // Colonnes Référence : n'envoyer que si une vraie valeur est sélectionnée
  // (0 ou null causerait une KeyError côté Grist sur les colonnes Ref)
  if (parentId)     payload.Action_Parent    = parentId;
  if (!selectedNiveau.startsWith('1') && prevId) payload.Tache_precedente = prevId;   // nom SANS accent = nom interne Grist
  if (initiativeId) payload.Initiative_ID    = initiativeId;
  if (pilotId)      payload.Pilote           = pilotId;

  if (!gristReady) {
    setSavePill('error', 'Grist non disponible');
    return;
  }
  try {
    setSavePill('saving');
    suppressNextRecordRefresh = true;
    await grist.docApi.applyUserActions([['AddRecord', currentActionsTable(), null, payload]]);
    panelMode = 'view';
    await refreshFromGrist();
    setSavePill('saved');
    setTimeout(() => setSavePill(''), 2500);
  } catch (err) {
    console.error('Create task error', err);
    setSavePill('error', err && err.message ? err.message : 'Erreur de création');
  }
}

async function saveFullRecord(obj) {
  if (!gristReady) return;
  const fields = {
    Libelle: obj.Libelle || '',
    Statut: obj.Statut || '',
    PDCA: Number(obj.PDCA || 0),
    Date_Demarrage: obj.Date_Demarrage,
    Date_Fin: obj.Date_Fin,
    Description: obj.Description || '',
  };
  if ('Niveau' in obj) fields.Niveau = obj.Niveau;

  // Colonnes Référence : Grist accepte 0 pour "effacer" mais rejette null/undefined.
  // On envoie la valeur numérique si elle existe, sinon 0 (= aucune ref).
  const refVal = (v) => { const n = normalizeRefValue(v); return (n != null && n > 0) ? n : 0; };

  if ('Action_Parent' in obj) fields.Action_Parent = refVal(obj.Action_Parent);

  const prevRaw = obj.Tache_precedente ?? obj['Tache_précédente'];
  if ('Tache_precedente' in obj || 'Tache_précédente' in obj) {
    fields['Tache_precedente'] = refVal(prevRaw);
  }

  if (obj._initiativeEditId != null || 'Initiative_ID' in obj) {
    fields.Initiative_ID = refVal(obj._initiativeEditId ?? refIdOf(obj.Initiative_ID));
  }
  if (obj._pilotEditId != null || 'Pilote' in obj) {
    fields.Pilote = refVal(obj._pilotEditId ?? pilotRefIdOf(obj));
  }

  try {
    setSavePill('saving');
    suppressNextRecordRefresh = true;
    await grist.docApi.applyUserActions([[ 'UpdateRecord', currentActionsTable(), obj.id, fields ]]);
    delete obj._pilotEditId;
    delete obj._initiativeEditId;
    await refreshFromGrist();
    setSavePill('saved');
    setTimeout(()=>setSavePill(''),2500);
  } catch (err) {
    console.error('Panel save error', err);
    setSavePill('error', err && err.message ? err.message : 'Erreur de sauvegarde');
  }
}

}

    <div class="tooltip-row">

  }

}
function moveTooltip(e) {
