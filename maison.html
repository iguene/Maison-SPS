<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison SPS</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#maison {
  width: 1400px;
  height: 860px;
  display: flex;
  flex-direction: column;
  transform-origin: top left;
  position: relative;
}

/* ── HEADER ── */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 6px 0 2px;
  flex-shrink: 0;
}
.logo {
  position: absolute;
  left: 40px;
  font-size: 0.9rem;
  font-weight: 900;
  color: #c0392b;
  letter-spacing: 2px;
  border: 2.5px solid #c0392b;
  padding: 4px 10px;
  border-radius: 3px;
  line-height: 1.2;
  text-align: center;
}
.logo-sub { font-size: 0.6rem; letter-spacing: 1px; color: #2c3e50; }
.main-title { font-size: 1.55rem; font-weight: 700; color: #c0392b; text-align: center; }

/* ── TRIANGLE ── */
.triangle-wrap { width: 100%; display: flex; justify-content: center; flex-shrink: 0; }
.triangle-svg  { width: 100%; }

/* ── BANDEAU VISION ── */
.vision-band {
  width: 100%;
  background: #e05d5d;
  color: white;
  text-align: center;
  padding: 18px 60px;
  font-size: 1.25rem;
  font-weight: 500;
  line-height: 1.6;
  flex-shrink: 0;
}

/* ── ZONE PILIERS ── */
.pillars-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
  display: flex;
}

.side-arrow-left, .side-arrow-right {
  position: absolute;
  top: 0; bottom: 0;
  width: 32px;
  z-index: 5;
  pointer-events: none;
}
.side-arrow-left  { left: 0; }
.side-arrow-right { right: 0; }

.pillars {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  padding: 8px 40px;
  min-height: 0;
  flex: 1;
}

.pillar {
  display: flex;
  flex-direction: column;
  border-radius: 6px;
  overflow: hidden;
  height: 100%;
}

.pillar-header {
  padding: 7px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  text-align: center;
  flex-shrink: 0;
  background: white;
}
.pillar.dev     .pillar-header { color: #2980b9; }
.pillar.impact  .pillar-header { color: #27ae60; }
.pillar.culture .pillar-header { color: #c0392b; }

.pillar-body {
  flex: 1;
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  align-content: center;
  align-items: center;
  justify-content: center;
  min-height: 0;
  overflow: hidden;
  position: relative;
  transition: background 0.15s;
}
.pillar.dev     .pillar-body { background: #d6e8f7; }
.pillar.impact  .pillar-body { background: #d5ecd5; }
.pillar.culture .pillar-body { background: #f7d6d6; }

/* Survol drag */
.pillar-body.drag-over {
  outline: 3px dashed #3e5de7;
  outline-offset: -3px;
  background: rgba(62,93,231,0.08) !important;
}

/* ── CARTES ── */
.fiche-card {
  cursor: grab;
  font-weight: 600;
  color: #2c3e50;
  transition: all 0.15s;
  padding: 2px 5px;
  border-radius: 3px;
  text-align: center;
  line-height: 1.3;
  border: 1px solid transparent;
  user-select: none;
}
.fiche-card:hover {
  background: rgba(255,255,255,0.75);
  border-color: rgba(0,0,0,0.2);
}
.fiche-card.selected {
  background: white;
  border-color: #3e5de7;
  color: #3e5de7;
  box-shadow: 0 2px 8px rgba(62,93,231,0.3);
}
.fiche-card.dragging {
  opacity: 0.35;
  cursor: grabbing;
}
.fiche-card.prio-critique { font-size: 1.15rem; }
.fiche-card.prio-haute    { font-size: 0.92rem; }
.fiche-card.prio-moyenne  { font-size: 0.78rem; }
.fiche-card.prio-basse    { font-size: 0.65rem; font-weight: 500; opacity: 0.8; }
.fiche-card.s-en-cours    { color: #1a5276; }
.fiche-card.s-termine     { color: #1a5c2a; }
.fiche-card.s-a-venir     { color: #7d6608; }

/* ── BANDEAU BAS ── */
.bottom-band {
  width: 100%;
  background: #e05d5d;
  color: white;
  text-align: center;
  padding: 18px 8px;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 2px;
  flex-shrink: 0;
}

/* ── TOAST confirmation ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #2c3e50;
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 500;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ── LOADING ── */
#app-loading {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100vh; color: #888; gap: 10px; font-size: 0.9rem;
}
.spinner {
  width: 22px; height: 22px;
  border: 2px solid #ddd;
  border-top-color: #c0392b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-pillar {
  color: rgba(0,0,0,0.3);
  font-size: 0.75rem;
  font-style: italic;
  text-align: center;
  width: 100%;
}
</style>
</head>
<body>

<div id="app-loading"><div class="spinner"></div>Chargement...</div>
<div class="toast" id="toast"></div>

<div id="maison" style="display:none">

  <div class="header">
    <div class="logo">SPS<br><span class="logo-sub">MEDICAL</span></div>
    <div class="main-title">Maison SPS Medical &nbsp;(Vision 3 ans)</div>
  </div>

  <div class="triangle-wrap">
    <svg class="triangle-svg" viewBox="0 0 1400 160">
      <defs>
        <linearGradient id="triGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5b7fa6"/>
          <stop offset="100%" stop-color="#2c3e50"/>
        </linearGradient>
      </defs>
      <polygon points="700,6 1392,154 8,154" fill="url(#triGrad)"/>
      <text x="700" y="82" text-anchor="middle" fill="white"
            font-size="48" font-weight="800"
            font-family="Segoe UI,sans-serif" letter-spacing="6">EXCELLENCE</text>
      <text x="700" y="124" text-anchor="middle" fill="#dce6f5"
            font-size="26" font-family="Segoe UI,sans-serif" font-weight="600">Meilleur ensemble</text>
    </svg>
  </div>

  <div class="vision-band">
    Pionniers d'une industrie de l'emballage médical responsable,
    nous œuvrons tous ensemble pour la plus grande sécurité des patients
  </div>

  <div class="pillars-wrap">
    <div class="side-arrow-left">
      <svg viewBox="0 0 32 600" preserveAspectRatio="none"
           style="width:32px;height:100%">
        <rect x="13" y="30" width="6" height="560" fill="#888" rx="2"/>
        <polygon points="16,2 28,32 4,32" fill="#888"/>
      </svg>
    </div>

    <div class="pillars">
      <div class="pillar dev">
        <div class="pillar-header">DEVELOPPEMENT BUSINESS</div>
        <div class="pillar-body" id="body-dev" data-pilier="Développement Business"></div>
      </div>
      <div class="pillar impact">
        <div class="pillar-header">IMPACT</div>
        <div class="pillar-body" id="body-impact" data-pilier="Impact"></div>
      </div>
      <div class="pillar culture">
        <div class="pillar-header">CULTURE MANAGERIALE</div>
        <div class="pillar-body" id="body-culture" data-pilier="Culture Managériale"></div>
      </div>
    </div>

    <div class="side-arrow-right">
      <svg viewBox="0 0 32 600" preserveAspectRatio="none"
           style="width:32px;height:100%">
        <rect x="13" y="30" width="6" height="560" fill="#888" rx="2"/>
        <polygon points="16,2 28,32 4,32" fill="#888"/>
      </svg>
    </div>
  </div>

  <div class="bottom-band">
    EXCELLENCE — ENTREPRENEURIAT — SOLIDARITÉ — CRÉATIO
