<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison SPS</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 16px;
}

/* ── HEADER ── */
.header {
  width: 100%;
  max-width: 1000px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 4px;
}
.logo {
  position: absolute;
  left: 0;
  font-size: 0.75rem;
  font-weight: 800;
  color: #c0392b;
  letter-spacing: 1px;
  border: 2px solid #c0392b;
  padding: 3px 8px;
  border-radius: 3px;
}
.logo span { color: #2c3e50; }
.main-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #c0392b;
  text-align: center;
}

/* ── TRIANGLE ── */
.triangle-wrap {
  width: 100%;
  max-width: 1000px;
  display: flex;
  justify-content: center;
  margin-bottom: 0;
}
.triangle-svg { width: 65%; max-width: 500px; }

/* ── BANDEAU VISION ── */
.vision-band {
  width: 100%;
  max-width: 1000px;
  background: #e05d5d;
  color: white;
  text-align: center;
  padding: 10px 24px;
  font-size: 0.82rem;
  font-weight: 500;
  line-height: 1.5;
  margin-bottom: 8px;
}

/* ── PILIERS ── */
.pillars {
  width: 100%;
  max-width: 1000px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  flex: 1;
}

.pillar {
  display: flex;
  flex-direction: column;
  min-height: 320px;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

/* Flèches latérales */
.pillar::before,
.pillar::after {
  content: '';
  position: absolute;
  top: 50px;
  bottom: 10px;
  width: 18px;
  background: rgba(255,255,255,0.5);
  border-radius: 2px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pillar.dev::before    { left: 0;  clip-path: polygon(0 50%, 100% 0, 100% 100%); background: rgba(100,149,200,0.3); }
.pillar.dev::after     { right: 0; clip-path: polygon(100% 50%, 0 0, 0 100%);    background: rgba(100,149,200,0.3); }
.pillar.impact::before  { left: 0;  clip-path: polygon(0 50%, 100% 0, 100% 100%); background: rgba(80,160,80,0.3); }
.pillar.impact::after   { right: 0; clip-path: polygon(100% 50%, 0 0, 0 100%);    background: rgba(80,160,80,0.3); }
.pillar.culture::before { left: 0;  clip-path: polygon(0 50%, 100% 0, 100% 100%); background: rgba(200,80,80,0.3); }
.pillar.culture::after  { right: 0; clip-path: polygon(100% 50%, 0 0, 0 100%);    background: rgba(200,80,80,0.3); }

.pillar-header {
  padding: 8px 14px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  text-align: center;
  color: #2c3e50;
}
.pillar.dev     .pillar-header { color: #2980b9; }
.pillar.impact  .pillar-header { color: #27ae60; }
.pillar.culture .pillar-header { color: #c0392b; }

.pillar-body {
  flex: 1;
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  align-content: flex-start;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  border: 1px solid rgba(0,0,0,0.08);
}
.pillar.dev     .pillar-body { background: #d6e8f7; }
.pillar.impact  .pillar-body { background: #d5ecd5; }
.pillar.culture .pillar-body { background: #f7d6d6; }

/* ── CARTES WORD CLOUD ── */
.fiche-card {
  cursor: pointer;
  font-weight: 600;
  color: #2c3e50;
  transition: all 0.15s;
  padding: 2px 4px;
  border-radius: 3px;
  text-align: center;
  line-height: 1.3;
  border: 1px solid transparent;
}
.fiche-card:hover {
  background: rgba(255,255,255,0.7);
  border-color: rgba(0,0,0,0.2);
}
.fiche-card.selected {
  background: rgba(255,255,255,0.9);
  border-color: #3e5de7;
  color: #3e5de7;
  box-shadow: 0 2px 8px rgba(62,93,231,0.25);
}

/* Tailles selon priorité — imite le word cloud */
.fiche-card.prio-critique { font-size: 1.05rem; }
.fiche-card.prio-haute    { font-size: 0.88rem; }
.fiche-card.prio-moyenne  { font-size: 0.75rem; }
.fiche-card.prio-basse    { font-size: 0.65rem; font-weight: 500; opacity: 0.85; }

/* Statut via couleur légère */
.fiche-card.s-en-cours { color: #1a5276; }
.fiche-card.s-termine  { color: #1a5c2a; }
.fiche-card.s-a-venir  { color: #7d6608; }

/* ── BANDEAU BAS ── */
.bottom-band {
  width: 100%;
  max-width: 1000px;
  background: #e05d5d;
  color: white;
  text-align: center;
  padding: 8px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  border-radius: 0 0 4px 4px;
  margin-top: 0;
}

/* ── LOADING ── */
.loading {
  display: flex; align-items: center;
  justify-content: center; height: 80vh;
  color: #666; gap: 10px; font-size: 0.85rem;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid #ddd;
  border-top-color: #c0392b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty-pillar {
  color: rgba(0,0,0,0.35);
  font-size: 0.72rem;
  font-style: italic;
  text-align: center;
  width: 100%;
  padding: 20px 0;
}
</style>
</head>
<body>

<div id="app">
  <div class="loading"><div class="spinner"></div>Chargement...</div>
</div>

<script>
let fiches = [];
let selectedId = null;

function esc(t) {
  const d = document.createElement('div');
  d.textContent = String(t || '');
  return d.innerHTML;
}

function getPilierClass(pilier) {
  if (!pilier) return 'dev';
  const p = String(pilier).toLowerCase();
  if (p.includes('impact'))  return 'impact';
  if (p.includes('culture')) return 'culture';
  return 'dev';
}

function getPrioClass(prio) {
  if (!prio) return 'prio-moyenne';
  const p = String(prio).toLowerCase();
  if (p.includes('critique')) return 'prio-critique';
  if (p.includes('haute'))    return 'prio-haute';
  if (p.includes('moyenne'))  return 'prio-moyenne';
  return 'prio-basse';
}

function getStatutClass(statut) {
  if (!statut) return 's-a-venir';
  const s = String(statut).toLowerCase();
  if (s.includes('cours'))   return 's-en-cours';
  if (s.includes('termin'))  return 's-termine';
  return 's-a-venir';
}

function renderCards(list) {
  if (!list.length) return '<div class="empty-pillar">Aucune fiche programme</div>';
  return list.map(f => {
    const prioCls   = getPrioClass(f.Priorite);
    const statutCls = getStatutClass(f.Statut);
    const isSelected = selectedId === f.id;
    return `<span
      class="fiche-card ${prioCls} ${statutCls} ${isSelected ? 'selected' : ''}"
      onclick="selectFiche(${f.id})"
      title="${esc(f.Statut || '')} — Avancement : ${Math.round(f.Avancement_Global || 0)}%"
    >${esc(f.Programme || 'Sans titre')}</span>`;
  }).join('');
}

function render() {
  const dev     = fiches.filter(f => getPilierClass(f.Pilier) === 'dev');
  const impact  = fiches.filter(f => getPilierClass(f.Pilier) === 'impact');
  const culture = fiches.filter(f => getPilierClass(f.Pilier) === 'culture');

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="logo">S<span>P</span>S<br><span style="font-size:0.6rem;letter-spacing:0">MEDICAL</span></div>
      <div class="main-title">Maison SPS Medical (Vision 3 ans)</div>
    </div>

    <div class="triangle-wrap">
      <svg class="triangle-svg" viewBox="0 0 500 130">
        <defs>
          <linearGradient id="triGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#4a6fa5"/>
            <stop offset="100%" stop-color="#2c3e50"/>
          </linearGradient>
        </defs>
        <polygon points="250,6 492,124 8,124" fill="url(#triGrad)"/>
        <text x="250" y="62" text-anchor="middle" fill="white"
              font-size="26" font-weight="800"
              font-family="Segoe UI,sans-serif" letter-spacing="3">EXCELLENCE</text>
        <text x="250" y="90" text-anchor="middle" fill="#cbd5e1"
              font-size="15" font-family="Segoe UI,sans-serif"
              font-weight="600">Meilleur ensemble</text>
      </svg>
    </div>

    <div class="vision-band">
      Pionniers d'une industrie de l'emballage médical responsable,
      nous œuvrons tous ensemble pour la plus grande sécurité des patients
    </div>

    <div class="pillars">
      <div class="pillar dev">
        <div class="pillar-header">DEVELOPPEMENT BUSINESS</div>
        <div class="pillar-body">${renderCards(dev)}</div>
      </div>
      <div class="pillar impact">
        <div class="pillar-header">IMPACT</div>
        <div class="pillar-body">${renderCards(impact)}</div>
      </div>
      <div class="pillar culture">
        <div class="pillar-header">CULTURE MANAGERIALE</div>
        <div class="pillar-body">${renderCards(culture)}</div>
      </div>
    </div>

    <div class="bottom-band">
      EXCELLENCE — ENTREPRENEURIAT — SOLIDARITÉ — CRÉATION DE VALEUR
    </div>
  `;
}

function selectFiche(id) {
  selectedId = (selectedId === id) ? null : id;
  grist.setSelectedRows([id]);
  render();
}

grist.ready({ requiredAccess: 'full' });
grist.onRecords(records => { fiches = records; render(); });
grist.onRecord(rec => {
  if (rec && rec.id && rec.id !== selectedId) {
    selectedId = rec.id;
    render();
  }
});
</script>
</body>
</html>
