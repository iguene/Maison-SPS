<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche Programme</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #f0f4f8;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.top-bar {
  display: flex;
  align-items: center;
  background: white;
  border-bottom: 1px solid #e2e8f0;
  padding: 8px 16px;
  gap: 12px;
  flex-shrink: 0;
}
.logo-sm {
  font-size: 0.75rem;
  font-weight: 900;
  color: #c0392b;
  border: 2px solid #c0392b;
  padding: 2px 6px;
  border-radius: 3px;
  line-height: 1.3;
  text-align: center;
  flex-shrink: 0;
}
.logo-sm span { font-size: 0.55rem; color: #2c3e50; display: block; }
.prog-name {
  flex: 1;
  font-size: 1.1rem;
  font-weight: 700;
  color: #1e293b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-btns { display: flex; gap: 8px; flex-shrink: 0; }
.nav-btn {
  padding: 7px 28px;
  font-size: 0.82rem;
  font-weight: 700;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 0.5px;
  font-family: inherit;
  transition: opacity 0.15s;
}
.nav-btn:hover { opacity: 0.85; }
.nav-btn.maison   { background: #1a6b6b; color: white; }
.nav-btn.planning { background: #c0392b; color: white; }

/* ── CONTEXTE ── */
.context-bar {
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  padding: 8px 16px;
  font-size: 0.78rem;
  color: #475569;
  flex-shrink: 0;
  line-height: 1.5;
}

/* ── GRILLE TUILES ── */
.tiles-area {
  flex: 1;
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow: auto;
}
.tiles-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1.4fr 1fr 1fr;
  gap: 12px;
  flex-shrink: 0;
}

/* ── TUILE ── */
.tile {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 260px;
}
.tile-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 0 14px;
  flex-shrink: 0;
  border-bottom: 1px solid #f1f5f9;
}
.tile-icon svg {
  width: 68px; height: 68px;
  stroke: #1e3a5f;
  stroke-width: 1.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tile-label {
  padding: 10px 14px 4px;
  font-size: 0.82rem;
  font-weight: 700;
  color: #1e293b;
  flex-shrink: 0;
}
.tile-content {
  padding: 0 14px 14px;
  font-size: 0.78rem;
  color: #334155;
  line-height: 1.6;
  flex: 1;
  overflow-y: auto;
}
.tile-sub {
  border-top: 1px solid #f1f5f9;
  padding: 10px 14px;
  font-size: 0.78rem;
  color: #334155;
  line-height: 1.6;
}
.tile-sub-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 4px;
}
.bullet-list { list-style: none; padding: 0; }
.bullet-list li::before { content: "• "; color: #64748b; }
.bullet-list li { padding: 1px 0; }
.empty { color: #94a3b8; font-style: italic; }

/* ── KSF ── */
.ksf-tile {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 20px;
  flex-shrink: 0;
}
.ksf-icon svg {
  width: 52px; height: 52px;
  stroke: #1e3a5f;
  stroke-width: 1.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ksf-label {
  font-size: 0.82rem;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 6px;
}
.ksf-text {
  font-size: 0.78rem;
  color: #334155;
  line-height: 1.6;
}

/* ── LOADING ── */
#loading {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; color: #888; gap: 10px; font-size: 0.9rem;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid #ddd;
  border-top-color: #c0392b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#fiche { display: none; flex-direction: column; height: 100%; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Chargement...</div>

<div id="fiche">
  <div class="top-bar">
    <div class="logo-sm">SPS<span>MEDICAL</span></div>
    <div class="prog-name" id="prog-name">—</div>
    <div class="nav-btns">
      <button class="nav-btn maison"   onclick="goMaison()">MAISON</button>

  </div>

  <div class="context-bar" id="context-bar" style="display:none"></div>

  <div class="tiles-area">
    <div class="tiles-row">

      <!-- Objectifs -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="26" cy="20" r="13"/>
            <circle cx="26" cy="20" r="5"/>
            <path d="M6 52 a20 20 0 0 1 40 0"/>
            <circle cx="50" cy="34" r="8"/>
            <line x1="50" y1="26" x2="50" y2="22"/>

            <line x1="42" y1="34" x2="38" y2="34"/>
            <line x1="58" y1="34" x2="62" y2="34"/>

            <line x1="55.7" y1="39.7" x2="58.5" y2="42.5"/>
            <line x1="55.7" y1="28.3" x2="58.5" y2="25.5"/>
            <line x1="44.3" y1="39.7" x2="41.5" y2="42.5"/>
          </svg>
        </div>
        <div class="tile-label">Objectifs :</div>
        <div class="tile-content"><ul class="bullet-list" id="objectifs-list"></ul></div>

      <!-- Départements -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="18" r="12"/>
            <path d="M8 54 a24 24 0 0 1 48 0"/>
            <circle cx="32" cy="18" r="5"/>
            <line x1="32" y1="6"  x2="32" y2="2"/>
            <line x1="43" y1="9"  x2="46" y2="6"/>
            <line x1="46" y1="18" x2="50" y2="18"/>
            <line x1="43" y1="27" x2="46" y2="30"/>
            <line x1="21" y1="9"  x2="18" y2="6"/>
            <line x1="18" y1="18" x2="14" y2="18"/>
            <line x1="21" y1="27" x2="18" y2="30"/>
          </svg>
        </div>
        <div class="tile-label">Départements :</div>
        <div class="tile-content"><ul class="bullet-list" id="dept-list"></ul></div>
      </div>

      <!-- Actions -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <rect x="8" y="8" width="48" height="48" rx="4"/>
            <path d="M22 8v14 M8 22h14 M22 22h14v-14 M36 8v14h14 M50 22v14h-14 M36 36v14h14 M50 50v6 M22 36h-14 M8 36v14h14 M22 50v6"/>
          </svg>
        </div>
        <div class="tile-label">Actions :</div>
        <div class="tile-content"><ul class="bullet-list" id="actions-list"></ul></div>
      </div>

      <!-- KPI -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <line x1="4" y1="56" x2="60" y2="56"/>
            <rect x="6"  y="38" width="10" height="18" rx="2"/>
            <rect x="20" y="28" width="10" height="28" rx="2"/>
            <rect x="34" y="16" width="10" height="40" rx="2"/>
            <rect x="48" y="8"  width="10" height="48" rx="2"/>
          </svg>
        </div>
        <div class="tile-label">KPI :</div>
        <div class="tile-content"><ul class="bullet-list" id="kpi-list"></ul></div>
      </div>

      <!-- Leader + Ressources -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <rect x="8" y="4" width="48" height="56" rx="3"/>
            <line x1="18" y1="18" x2="46" y2="18"/>
            <line x1="18" y1="26" x2="38" y2="26"/>
            <line x1="18" y1="34" x2="46" y2="34"/>
            <line x1="18" y1="42" x2="34" y2="42"/>
            <line x1="18" y1="50" x2="42" y2="50"/>
          </svg>
        </div>
        <div class="tile-label">Leader :</div>
        <div class="tile-content" id="leader-content"></div>
        <div class="tile-sub">
          <div class="tile-sub-label">Ressources :</div>
          <div id="ressources-content"></div>
        </div>
      </div>

    </div>

    <!-- KSF -->
    <div class="ksf-tile">
      <div class="ksf-icon">
        <svg viewBox="0 0 64 64">
          <circle cx="20" cy="34" r="14"/>
          <circle cx="20" cy="34" r="6"/>
          <line x1="30" y1="34" x2="56" y2="34"/>
          <line x1="48" y1="34" x2="48" y2="44"/>
          <line x1="56" y1="34" x2="56" y2="44"/>
