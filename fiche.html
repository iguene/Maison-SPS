<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Debug Fiche</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #00ff88; font-size: 13px; }
h2 { color: #fff; margin-bottom: 16px; }
.log { background: #0d0d1a; padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid #00ff88; }
.log.warn { border-color: #f59e0b; color: #f59e0b; }
.log.error { border-color: #ef4444; color: #ef4444; }
.log.info  { border-color: #3b82f6; color: #aad4ff; }
</style>
</head>
<body>
<h2>🔍 Debug Widget Grist</h2>
<div id="logs"></div>

<script>
function log(msg, type='log') {
  const el = document.createElement('div');
  el.className = 'log ' + type;
  el.textContent = new Date().toISOString().slice(11,19) + ' — ' + msg;
  document.getElementById('logs').prepend(el);
  console.log(msg);
}

log('Script démarré', 'info');
log('grist disponible : ' + (typeof grist !== 'undefined'), 'info');

if (typeof grist === 'undefined') {
  log('❌ API Grist non chargée !', 'error');
} else {
  log('✓ API Grist chargée', 'info');

  // Test 1 : onRecord AVANT ready
  grist.onRecord(function(rec) {
    if (!rec) {
      log('onRecord → null (aucune sélection)', 'warn');
    } else {
      log('✓ onRecord reçu : id=' + rec.id + ' Programme=' + (rec.Programme||'?'));
    }
  });

  // Test 2 : onRecords AVANT ready
  grist.onRecords(function(records) {
    log('✓ onRecords reçu : ' + (records ? records.length : 0) + ' lignes');
    if (records && records[0]) {
      log('  Colonnes dispo : ' + Object.keys(records[0]).join(', '), 'info');
    }
  });

  // Test 3 : ready()
  log('Appel grist.ready()...', 'info');
  try {
    var result = grist.ready({ requiredAccess: 'full' });
    log('grist.ready() appelé, résultat type : ' + typeof result, 'info');
    if (result && typeof result.then === 'function') {
      result.then(function() {
        log('✓ grist.ready() Promise résolue');
      }).catch(function(e) {
        log('❌ grist.ready() Promise rejetée : ' + e, 'error');
      });
    }
  } catch(e) {
    log('❌ grist.ready() exception : ' + e, 'error');
  }

  // Test 4 : après 2s, tester getUserInfo
  setTimeout(function() {
    log('Test getUserInfo...', 'info');
    try {
      grist.getUserInfo().then(function(u) {
        log('✓ getUserInfo : ' + JSON.stringify(u), 'info');
      }).catch(function(e) {
        log('getUserInfo failed : ' + e, 'warn');
      });
    } catch(e) {
      log('getUserInfo exception : ' + e, 'warn');
    }
  }, 2000);

  // Test 5 : timeout général
  setTimeout(function() {
    log('⏱ 5s écoulées — état final ci-dessus', 'warn');
  }, 5000);
}
</script>
</body>
</html>
