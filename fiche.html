<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche Programme</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #f0f4f8;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.top-bar {
  display: flex;
  align-items: center;
  background: white;
  border-bottom: 1px solid #e2e8f0;
  padding: 8px 16px;
  gap: 12px;
  flex-shrink: 0;
}
.logo-sm {
  font-size: 0.75rem;
  font-weight: 900;
  color: #c0392b;
  border: 2px solid #c0392b;
  padding: 2px 6px;
  border-radius: 3px;
  line-height: 1.3;
  text-align: center;
  flex-shrink: 0;
}
.logo-sm span { font-size: 0.55rem; color: #2c3e50; display: block; }

.prog-name {
  flex: 1;
  font-size: 1.1rem;
  font-weight: 700;
  color: #1e293b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-btns { display: flex; gap: 8px; flex-shrink: 0; }
.nav-btn {
  padding: 7px 28px;
  font-size: 0.82rem;
  font-weight: 700;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 0.5px;
  font-family: inherit;
  transition: opacity 0.15s;
}
.nav-btn:hover { opacity: 0.85; }
.nav-btn.maison   { background: #1a6b6b; color: white; }
.nav-btn.planning { background: #c0392b; color: white; }

/* ── CONTEXTE ── */
.context-bar {
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  padding: 8px 16px;
  font-size: 0.78rem;
  color: #475569;
  flex-shrink: 0;
  line-height: 1.5;
}
.context-bar strong { color: #1e293b; }

/* ── GRILLE TUILES ── */
.tiles-area {
  flex: 1;
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow: auto;
}

.tiles-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1.4fr 1fr 1fr;
  gap: 12px;
  flex-shrink: 0;
}

/* ── TUILE ── */
.tile {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 280px;
}

.tile-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px 0 16px;
  flex-shrink: 0;
  border-bottom: 1px solid #f1f5f9;
}
.tile-icon svg {
  width: 72px;
  height: 72px;
  stroke: #1e3a5f;
  stroke-width: 1.2;
  fill: none;
}

.tile-label {
  padding: 10px 14px 6px;
  font-size: 0.82rem;
  font-weight: 700;
  color: #1e293b;
  flex-shrink: 0;
}

.tile-content {
  padding: 0 14px 14px;
  font-size: 0.78rem;
  color: #334155;
  line-height: 1.6;
  flex: 1;
  overflow-y: auto;
}

.bullet-list { list-style: none; padding: 0; }
.bullet-list li::before { content: "• "; color: #64748b; }
.bullet-list li { padding: 1px 0; }

/* ── TUILE KSF (bas) ── */
.ksf-tile {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 20px;
  flex-shrink: 0;
}
.ksf-icon {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 64px; height: 64px;
}
.ksf-icon svg {
  width: 56px; height: 56px;
  stroke: #1e3a5f; stroke-width: 1.2; fill: none;
}
.ksf-body { flex: 1; }
.ksf-label {
  font-size: 0.82rem;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 6px;
}
.ksf-text {
  font-size: 0.78rem;
  color: #334155;
  line-height: 1.6;
}

/* ── TUILE LEADER/RESSOURCES ── */
.tile-sub {
  border-top: 1px solid #f1f5f9;
  padding: 10px 14px;
  font-size: 0.78rem;
  color: #334155;
  line-height: 1.6;
}
.tile-sub-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 4px;
}

/* ── LOADING ── */
#loading {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; color: #888; gap: 10px; font-size: 0.9rem;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid #ddd;
  border-top-color: #c0392b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#fiche { display: none; flex-direction: column; height: 100%; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Chargement...</div>

<div id="fiche">
  <!-- HEADER -->
  <div class="top-bar">
    <div class="logo-sm">SPS<span>MEDICAL</span></div>
    <div class="prog-name" id="prog-name">—</div>
    <div class="nav-btns">
      <button class="nav-btn maison"   onclick="goMaison()">MAISON</button>
      <button class="nav-btn planning" onclick="goPlanning()">PLANNING</button>
    </div>
  </div>

  <!-- CONTEXTE -->
  <div class="context-bar" id="context-bar"></div>

  <!-- TUILES -->
  <div class="tiles-area">
    <div class="tiles-row">

      <!-- Objectifs -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <!-- Tête avec engrenage -->
            <circle cx="28" cy="22" r="14"/>
            <circle cx="28" cy="22" r="6"/>
            <path d="M46 46 a18 18 0 0 0-36 0"/>
            <circle cx="50" cy="36" r="8"/>
            <path d="M50 28v-4M50 48v-4M42 36h-4M62 36h-4M44.3 30.3l-2.8-2.8M58.5 44.5l-2.8-2.8M44.3 41.7l-2.8 2.8M58.5 27.5l-2.8 2.8"/>
          </svg>
        </div>
        <div class="tile-label">Objectifs :</div>
        <div class="tile-content">
          <ul class="bullet-list" id="objectifs-list"></ul>
        </div>
      </div>

      <!-- Départements -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="20" r="12"/>
            <path d="M8 56 a24 24 0 0 1 48 0"/>
            <circle cx="32" cy="20" r="5"/>
            <line x1="32" y1="8" x2="32" y2="4"/>
            <line x1="42" y1="11" x2="45" y2="8"/>
            <line x1="44" y1="20" x2="48" y2="20"/>
            <line x1="42" y1="29" x2="45" y2="32"/>
            <line x1="22" y1="11" x2="19" y2="8"/>
            <line x1="20" y1="20" x2="16" y2="20"/>
          </svg>
        </div>
        <div class="tile-label">Départements :</div>
        <div class="tile-content">
          <ul class="bullet-list" id="dept-list"></ul>
        </div>
      </div>

      <!-- Actions -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <!-- Labyrinthe stylisé -->
            <rect x="8" y="8" width="48" height="48" rx="3"/>
            <path d="M20 8v16M8 20h12M20 20h12v12M32 20h12v-12M44 32v12H32M32 32H20v12M20 44v8M44 44h8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="tile-label">Actions :</div>
        <div class="tile-content">
          <ul class="bullet-list" id="actions-list"></ul>
        </div>
      </div>

      <!-- KPI -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <rect x="8" y="40" width="10" height="16" rx="2"/>
            <rect x="22" y="28" width="10" height="28" rx="2"/>
            <rect x="36" y="16" width="10" height="40" rx="2"/>
            <rect x="50" y="8"  width="10" height="48" rx="2"/>
            <line x1="4" y1="56" x2="64" y2="56"/>
          </svg>
        </div>
        <div class="tile-label">KPI:</div>
        <div class="tile-content">
          <ul class="bullet-list" id="kpi-list"></ul>
        </div>
      </div>

      <!-- Leader + Ressources -->
      <div class="tile">
        <div class="tile-icon">
          <svg viewBox="0 0 64 64">
            <rect x="8" y="8" width="48" height="56" rx="3"/>
            <line x1="20" y1="22" x2="44" y2="22"/>
            <line x1="20" y1="30" x2="36" y2="30"/>
            <line x1="20" y1="38" x2="44" y2="38"/>
            <line x1="20" y1="46" x2="32" y2="46"/>
            <!-- Croix en haut à droite -->
            <line x1="38" y1="10" x2="54" y2="10"/>
            <line x1="38" y1="14" x2="54" y2="14"/>
            <line x1="38" y1="10" x2="38" y2="14"/>
            <line x1="54" y1="10" x2="54" y2="14"/>
          </svg>
        </div>
        <div class="tile-label">Leader :</div>
        <div class="tile-content" id="leader-content"></div>
        <div class="tile-sub">
          <div class="tile-sub-label">Ressources :</div>
          <div id="ressources-content"></div>
        </div>
      </div>

    </div>

    <!-- KSF -->
    <div class="ksf-tile">
      <div class="ksf-icon">
        <svg viewBox="0 0 64 64">
          <!-- Clé -->
          <circle cx="20" cy="32" r="14"/>
          <circle cx="20" cy="32" r="7"/>
          <line x1="30" y1="32" x2="58" y2="32"/>
          <line x1="50" y1="32" x2="50" y2="40"/>
          <line x1="58" y1="32" x2="58" y2="40"/>
        </svg>
      </div>
      <div class="ksf-body">
        <div class="ksf-label">Key Success Factor:</div>
        <div class="ksf-text" id="ksf-content"></div>
      </div>
    </div>
  </div>
</div>

<script>
let currentFiche = null;
let allActions   = [];

function esc(t) {
  const d = document.createElement('div');
  d.textContent = String(t || '');
  return d.innerHTML;
}

function splitBullets(text) {
  if (!text) return [];
  return String(text).split(/\n|;/).map(s => s.trim()).filter(Boolean);
}

function renderList(elId, items) {
  const ul = document.getElementById(elId);
  if (!items.length) { ul.innerHTML = '<li style="color:#94a3b8;font-style:italic">—</li>'; return; }
  ul.innerHTML = items.map(i => `<li>${esc(i)}</li>`).join('');
}

function renderFiche(f) {
  if (!f) return;
  currentFiche = f;

  // Nom
  document.getElementById('prog-name').textContent = f.Programme || '—';

  // Contexte
  const ctx = document.getElementById('context-bar');
  if (f.Contexte) {
    ctx.innerHTML = f.Contexte.split('\n').map(l => `<div>${esc(l)}</div>`).join('');
    ctx.style.display = 'block';
  } else {
    ctx.style.display = 'none';
  }

  // Objectifs
  renderList('objectifs-list', splitBullets(f.Objectifs));

  // Départements
  renderList('dept-list', splitBullets(f.Departements));

  // Actions (depuis la table Actions liée)
  const linked = allActions.filter(a => {
    const ref = Array.isArray(a.Initiative_ID) ? a.Initiative_ID[1] : a.Initiative_ID;
    return ref == f.id;
  });
  const actionItems = linked.length
    ? linked.map(a => a.Libelle || a.titre || '').filter(Boolean)
    : splitBullets(f.KPIs); //
