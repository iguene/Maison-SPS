<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Indicateur</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }
    .page {
      min-height: 100vh;
      padding: 12px 14px 40px;
      position: relative;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 500;
    }
    .home-button {
      position: absolute;
      top: 50px;
      right: 10px;
      width: 300px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00576b;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 2px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .home-button:hover {
      background: #004659;
      transform: translateY(-1px);
    }
    /* Zone image(s) */
    .images-wrapper {
      width: min(1300px, 90vw);
      margin: 90px auto 0;
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
    }
    .image-box {
      background: #fff;
      border: 1px solid #ddd;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    .image-box img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Indicateur sans image */
    .no-image {
      width: min(1300px, 90vw);
      margin: 90px auto 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      color: #666;
      font-size: 18px;
    }
    @media (max-width: 900px) {
      .home-button { position: static; margin: 20px 0 0 auto; width: 220px; }
      .images-wrapper { flex-direction: column; width: 100%; margin-top: 30px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 id="indicateur-title">Indicateur</h1>
    <a class="home-button" href="https://iguene.github.io/Maison-SPS/sps-public.html">MAISON</a>
    <div id="content"></div>
  </main>

  <script>
    const BASE = 'https://iguene.github.io/Maison-SPS/';

    // Correspondances id → { titre, images[] }
    const INDICATEURS = {
      'ebitda':         { titre: 'EBITDA',                       images: ['EBITDA.png'] },
      'ca60m':          { titre: 'CA 60M€',                      images: ['CA.png'] },
      'otif95':         { titre: 'OTIF 95%',                     images: ['OTIF.png'] },
      'prod-dechets':   { titre: '-30% Production de déchets',   images: ['Dechets1.png', 'Dechets2.png'] },
      '0accident':      { titre: '0 Accident',                   images: ['Accident.png'] },
      'recyclage':      { titre: 'Recyclage déchets +20%',       images: [] },
      'enquete-collab': { titre: 'Enquête Collaborateur 65%',    images: ['Satisfaction collaborateur.png'] },
      'absenteisme':    { titre: 'Absentéisme 3%',               images: ['Absenteisme.png'] },
      'fidelisation':   { titre: 'Fidélisation 90%',             images: ['Fidelisation.png'] },
    };

    // Lire le paramètre ?id= dans l'URL
    var params = new URLSearchParams(window.location.search);
    var id     = params.get('id') || '';
    var data   = INDICATEURS[id];

    if (!data) {
      // Fallback : essayer via le hash (ancien format #ebitda)
      var hash = window.location.hash.replace('#', '');
      data = INDICATEURS[hash] || { titre: 'Indicateur', images: [] };
    }

    // Mettre à jour le titre
    document.getElementById('page-title').textContent      = data.titre;
    document.getElementById('indicateur-title').textContent = data.titre;

    // Construire le contenu
    var content = document.getElementById('content');

    if (data.images.length === 0) {
      // Pas d'image
      var div = document.createElement('div');
      div.className = 'no-image';
      div.textContent = 'Contenu à venir pour : ' + data.titre;
      content.appendChild(div);
    } else {
      // 1 ou 2 images
      var wrap = document.createElement('div');
      wrap.className = 'images-wrapper';
      data.images.forEach(function(imgFile) {
        var box = document.createElement('div');
        box.className = 'image-box';
        var img = document.createElement('img');
        img.src = BASE + encodeURIComponent(imgFile);
        img.alt = data.titre;
        box.appendChild(img);
        wrap.appendChild(box);
      });
      content.appendChild(wrap);
    }
  </script>
</body>
</html>
